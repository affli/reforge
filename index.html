<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reforge Legacy Analyzer — JCL &amp; COBOL Mainframe | Traduction Python IA</title>
<meta name="description" content="Analyze your JCL and COBOL IBM z/OS files, visualize your mainframe system map and translate COBOL to Python with AI. Free, 100% browser-based.">
<meta name="keywords" content="JCL analyzer, COBOL analyzer, mainframe modernization, IBM z/OS, COBOL to Python, legacy code analysis, Reforge, OPC TWS, mainframe modernization">
<meta name="author" content="Adrien — adrien@vyniad.be">
<meta name="robots" content="index, follow">
<meta property="og:title" content="Reforge Legacy Analyzer — JCL &amp; COBOL Mainframe Tool">
<meta property="og:description" content="Analyze JCL and COBOL mainframe files, interactive system map, AI-powered COBOL→Python translation. Free.">
<meta property="og:type" content="website">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0d0f14;
    --bg2:      #13161e;
    --bg3:      #1a1d28;
    --border:   #252836;
    --border2:  #2e3248;
    --text:     #c9cdd8;
    --text2:    #7a80a0;
    --text3:    #454a66;
    --accent:   #4e9bff;
    --accent2:  #2563c0;
    --green:    #3dd68c;
    --yellow:   #f0b429;
    --red:      #f06560;
    --purple:   #a78bfa;
    --cyan:     #38bdf8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--bg2);
    flex-shrink: 0;
  }
  .logo {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 15px;
    color: var(--accent);
    letter-spacing: 0.04em;
  }
  .logo span { color: var(--text2); font-weight: 300; }
  .header-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--text3);
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: 3px;
    padding: 2px 7px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .header-spacer { flex: 1; }
  .status-dot {
    width: 7px; height: 7px;
    background: var(--green);
    border-radius: 50%;
    box-shadow: 0 0 6px var(--green);
  }
  .status-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text2);
  }

  /* ── LAYOUT ── */
  .workspace { display: flex; flex: 1; overflow: hidden; }

  /* ── LEFT PANEL ── */
  .left-panel {
    width: 340px;
    border-right: 1px solid var(--border);
    background: var(--bg2);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .panel-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--text3);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-header-icon { color: var(--accent); font-size: 12px; }

  /* ── UPLOAD ZONE ── */
  .upload-zone {
    margin: 16px;
    border: 1.5px dashed var(--border2);
    border-radius: 8px;
    padding: 26px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--bg3);
    position: relative;
  }
  .upload-zone:hover, .upload-zone.drag-over {
    border-color: var(--accent);
    background: rgba(78,155,255,0.05);
  }
  .upload-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .upload-icon { font-size: 26px; margin-bottom: 8px; filter: grayscale(0.3); }
  .upload-title { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text); margin-bottom: 4px; }
  .upload-sub { font-size: 11px; color: var(--text3); }
  .upload-sub em { color: var(--accent); font-style: normal; cursor: pointer; }

  /* ── PASTE CODE PANEL ── */
  .paste-toggle-btn {
    margin: 0 16px 12px;
    padding: 8px 14px;
    background: transparent;
    border: 1px solid var(--border2);
    border-radius: 6px;
    color: var(--text2);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    width: calc(100% - 32px);
  }
  .paste-toggle-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(78,155,255,0.05); }
  .paste-toggle-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(78,155,255,0.08); }
  .paste-panel {
    margin: 0 16px 14px;
    border: 1px solid var(--border2);
    border-radius: 8px;
    background: var(--bg3);
    padding: 10px;
  }
  .paste-textarea {
    width: 100%; min-height: 140px; max-height: 280px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    line-height: 1.6; padding: 10px; resize: vertical; outline: none;
  }
  .paste-textarea:focus { border-color: var(--accent); }
  .paste-textarea::placeholder { color: var(--text3); }
  .paste-actions { display: flex; gap: 8px; margin-top: 8px; }
  .paste-filename {
    flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text2); font-family: 'IBM Plex Mono', monospace; font-size: 11px;
    padding: 7px 10px; outline: none;
  }
  .paste-filename:focus { border-color: var(--accent); }
  .paste-filename::placeholder { color: var(--text3); }
  .paste-add-btn {
    padding: 7px 14px; background: var(--accent2); border: none; border-radius: 6px;
    color: #fff; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 500;
    cursor: pointer; transition: background 0.2s; white-space: nowrap;
  }
  .paste-add-btn:hover { background: var(--accent); }
  .paste-add-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── FILE LIST ── */
  .file-info { margin: 0 16px 16px; display: none; }
  .file-info.show { display: block; }

  .lang-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 8px;
    font-weight: 700;
    padding: 1px 5px;
    border-radius: 3px;
    letter-spacing: 0.04em;
  }
  .lang-jcl   { background: rgba(78,155,255,0.12); color: var(--accent); border: 1px solid rgba(78,155,255,0.3); }
  .lang-cobol { background: rgba(167,139,250,0.12); color: var(--purple); border: 1px solid rgba(167,139,250,0.3); }
  .lang-unknown { background: rgba(122,128,160,0.12); color: var(--text3); border: 1px solid rgba(122,128,160,0.3); }

  /* ── PARSE BUTTON ── */
  .parse-btn {
    margin: 0 16px 16px;
    padding: 11px 16px;
    background: var(--accent2);
    border: none;
    border-radius: 6px;
    color: #fff;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.04em;
    display: none;
  }
  .parse-btn.show { display: block; }

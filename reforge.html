        note += ' — reader targets an OLDER generation than the one written here';
      addEdge('job|' + W.job, 'job|' + R2.job, 'feed', 'probable', [{ file: W.file, ln: W.ln, note }]);
    }));
  });

  // ── Scheduler: EXPLICIT execution orders (import) → CERTAIN ──
  // "JOB B AFTER A" declares that B runs after A: the order becomes certain.
  // A pair already inferred by shared dataset (probable feed) is promoted CERTAIN
  // with merged evidence; a pair without a shared dataset gets the
  // order-only edge (explicit "order only" note). Declared but absent jobs,
  // absent predecessors, cycles, jobs without a scheduler line → warnings.
  const schedFiles = files.filter(f => f.lang === 'SCHED' && f.parsed.sched);
  if (schedFiles.length){
    const jobsKnown = new Set([...nodes.values()].filter(n => n.type === 'job').map(n => n.name));
    const ensureJob = n => {
      if (!jobsKnown.has(n)){ addNode('job', n, { referenced: true, sched: true }); jobsKnown.add(n); }
      return 'job|' + n;
    };
    schedFiles.forEach(f => {
      (f.parsed.sched.deps || []).forEach(d => {
        if (!jobsKnown.has(d.job))
          m.warnings.push('scheduler: job ' + d.job + ' declared in ' + f.name + ' but not uploaded — order edges kept, endpoint unknown');
        (d.after || []).forEach(a => {
          if (!jobsKnown.has(a) && !schedFiles.some(sf => (sf.parsed.sched.deps || []).some(x => x.job === a)))
            m.warnings.push('scheduler: predecessor ' + a + ' (before ' + d.job + ') declared in ' + f.name + ' but not uploaded — order edge kept, source unknown');
          const ex = eIdx.get('job|' + a + '\u0001' + 'job|' + d.job + '\u0001' + 'feed');
          const note = ex
            ? 'scheduler: ' + d.job + ' runs AFTER ' + a + ' (explicit import ' + f.name + ') — order CONFIRMED, dataset-inferred feed upgraded to CERTAIN'
            : 'scheduler: ' + d.job + ' runs AFTER ' + a + ' (explicit import ' + f.name + ') — order confirmed by scheduler, no shared dataset detected (order only)';
          addEdge(ensureJob(a), ensureJob(d.job), 'feed', 'certain', [{ file: f.name, note }]);
        });
      });
    });
    // project job without a scheduler line → its cross-job order stays inferred (PROBABLE)
    jobsKnown.forEach(j => {
      const mentioned = schedFiles.some(f => (f.parsed.sched.deps || []).some(d => d.job === j || d.after.includes(j)));
      if (!mentioned) m.warnings.push('job ' + j + ': no scheduler line found — cross-job order stays dataset-inferred (PROBABLE) or unknown');
    });
  }

  // ── REXX ──
  files.forEach(f => {
    if (f.lang !== 'REXX' || !f.parsed.rexx) return;
    const R = f.parsed.rexx;
    const rid = addNode('prog', R.execName, { file: f.name, rexx: true }).id;
    R.calls.forEach(c => {
      if (c.quoted){
        const mem = (c.target.match(/\(([A-Z0-9\-@#$.]+)\)\s*$/)||[])[1] || null;
        const dsn = c.target.replace(/\([A-Z0-9\-@#$.]+\)\s*$/, '');
        const tgt = mem || (dsn.includes('.') ? null : dsn.toUpperCase());
        if (tgt){
          const rx2 = files.find(x => x.lang === 'REXX' && x !== f && x.parsed.rexx && x.parsed.rexx.execName === tgt);
          const cb2 = files.find(x => x.lang === 'CBL' && x.parsed.cobol && x.parsed.cobol.programId === tgt);
          const isUp = !!(rx2 || cb2);
          addNode(isUp ? 'prog' : 'xpgm', tgt, { file: rx2 ? rx2.name : (cb2 ? cb2.name : null) });
          addEdge(rid, (isUp ? 'prog|' : 'xpgm|') + tgt, 'call', 'certain', [{ file: f.name, ln: c.ln, note: "REXX CALL '" + c.target + "'" }]);
        } else {
          // CALL 'dsn.without.member' → quoted dataset, exact target unknown: references edge, no invention
          const did = addNode('ds', dsn, { referenced: true }).id;
          addEdge(rid, did, 'references', 'unknown', [{ file: f.name, ln: c.ln, note: "REXX CALL '" + c.target + "' — member unknown" }]);
        }
      } else if (c.viaVar){
        m.warnings.push('REXX ' + R.execName + ': CALL via variable ' + c.viaVar + ' (line ' + c.ln + ') — target unknown, no edge invented');
      }
    });
    R.dsns.forEach(d => {
      const did = addNode('ds', d.name, { referenced: true }).id;
      addEdge(rid, did, 'references', 'unknown', [{ file: f.name, ln: d.ln, note: "REXX dataset reference '" + d.name + "' — access type (read/write) unknown" }]);
    });
  });

  // ── COBOL ──
  files.forEach(f => {
    if (f.lang !== 'CBL' && f.lang !== 'CPY') return;
    const C = f.parsed.cobol;
    if (!C) return;
    if (f.lang === 'CBL' && C.programId){
      // duplicate PROGRAM-ID: each file keeps its own node (DUPPGM, DUPPGM#2)
      const progName = progKeyOf.get(f.name) || C.programId;
      const pid = 'prog|' + progName;
      addNode('prog', progName, { file: f.name });
      // copybooks
      C.copyUsed.forEach(cu => {
        const cnode = addNode('cpy', cu.name, { file: cu.file || null });
        const resolved = cu.resolved;
        addEdge(pid, cnode.id, 'uses', resolved ? 'certain' : 'unknown', [{ file: f.name, ln: cu.ln, note: 'COPY ' + cu.name + (resolved ? '' : ' (not uploaded)') }]);
      });
      // CALLs
      C.calls.forEach(c => {
        if (!c.target) return;
        // IMS DL/I: system entry, not an application program to link —
        // handled below (honest detection, no invented edge).
        if (c.target === 'CBLTDLI' || c.target === 'ASMTDLI') return;
        const isCbl = files.some(x => x.lang === 'CBL' && x.parsed.cobol && x.parsed.cobol.programId === c.target);
        const tid = (isCbl ? 'prog|' : 'xpgm|') + c.target;
        addNode(isCbl ? 'prog' : 'xpgm', c.target, { file: isCbl ? files.find(x => x.lang==='CBL' && x.parsed.cobol && x.parsed.cobol.programId===c.target).name : null });
        const conf = c.resolved === true ? 'certain' : c.resolved === 'var' ? 'probable' : 'unknown';
        addEdge(pid, tid, 'call', conf, [{ file: f.name, ln: c.ln, note: 'CALL ' + (c.viaVar ? c.viaVar + ' (dynamic)' : c.target) }]);
        if (conf === 'unknown') m.unknownCalls.push(c);
      });
      // IMS DL/I (CALL CBLTDLI/ASMTDLI): detected and shown, never linked —
      // PCB/segments unknown offline, no invented edge, warning.
      if ((C.dli || []).length){
        const pnode = m.nodes.get(pid);
        if (pnode){
          pnode.data.ims = { calls: C.dli.length, ops: C.dli.map(d => d.op || 'UNKNOWN') };
          const withOp = C.dli.filter(d => d.op).map(d => d.op).join(', ');
          m.warnings.push('prog ' + progName + ': IMS DL/I program — ' + C.dli.length + ' CALL ' + C.dli[0].entry + (withOp ? ', op-codes: ' + withOp : ', op-codes unknown (dynamic)') + '. PCB/segment names are built at runtime, unknown offline — no relation invented');
        }
      }
      // DDNAME ↔ SELECT: certain link if an I/O verb exists (backrefs resolved)
      C.selects.forEach(sl => {
        C.fileOps[sl.file] && C.fileOps[sl.file].forEach(op => {
          // find the steps referencing this DDNAME (in the jobs)
          files.forEach(jf => {
            if (jf.lang !== 'JCL') return;
            (jf.parsed.jobs || []).forEach(jb => {
              (jb.steps || []).forEach(st => {
                if (String(st.target || '').toUpperCase() !== C.programId) return; // the step must run THIS program (DDNAMEs are local to a step)
                (st.dds || []).forEach(d => {
                  if ((d.ddname || '').toUpperCase() !== sl.dd) return;
                  const r = resolveDD(jb, d);
                  if (!r) return;
                  const dsNode = addNode('ds', r.name, { temp: r.temp, gdg: r.gdg });
                  const ev = [
                    { file: jf.name, ln: d.line, note: 'JCL: DD ' + d.ddname + ' DSN=' + (r.via ? r.via + ' → ' + r.name : r.name) + (r.gdg != null ? ' (GDG ' + (r.gdg > 0 ? '+' : '') + r.gdg + ')' : '') },
                    { file: f.name, ln: sl.ln, note: 'COBOL: SELECT ' + sl.file + ' ASSIGN TO ' + sl.dd },
                    { file: f.name, ln: op.ln, note: op.cics ? 'COBOL: EXEC CICS ' + op.cics + ' FILE(' + (op.cicsFile || sl.file) + ')' : 'COBOL: ' + op.op.toUpperCase() + ' ' + sl.file }
                  ];
                  addEdge('step|' + jnameOf(jb, jf) + '.' + (st._sname || st.name), dsNode.id, op.op, op.viaVar ? 'probable' : 'certain', ev);
                });
              });
            });
          });
        });
      });
      // SQL → tables (recognized operation only; unknown type already flagged by the parser)
      C.sql.forEach(x => {
        if (!['read','write','update'].includes(x.op)) return;
        x.tables.forEach(tb => {
          const tn = addNode('tbl', tb, {});
          addEdge(pid, tn.id, 'sql-' + x.op, 'certain', [{ file: f.name, ln: x.ln, note: 'EXEC SQL ' + x.op.toUpperCase() + ' — ' + tb }]);
        });
      });
      // EXEC CICS: linked programs (XCTL/LINK), maps, queues, FCT files
      // not attached. The reference is certain (it is written in the
      // code); what is unknown (dataset behind an FCT) stays unknown.
      C.cics.forEach(e => {
        if (e.program){
          const tgt = files.find(x => x.lang === 'CBL' && x.parsed.cobol && x.parsed.cobol.programId === e.program);
          const tid = (tgt ? 'prog|' : 'xpgm|') + e.program;
          addNode(tgt ? 'prog' : 'xpgm', e.program, { file: tgt ? tgt.name : null });
          addEdge(pid, tid, 'call', 'certain', [{ file: f.name, ln: e.ln, note: 'EXEC CICS ' + e.cmd + ' PROGRAM(' + e.program + ')' }]);
        }
        if (e.map){
          const mnode = addNode('map', e.map, {});
          addEdge(pid, mnode.id, 'uses', 'certain', [{ file: f.name, ln: e.ln, note: 'EXEC CICS ' + e.cmd + ' MAP(' + e.map + ')' }]);
        }
        if (e.queue){
          const qnode = addNode('q', e.queue, { qtype: e.qtype });
          addEdge(pid, qnode.id, e.op, 'certain', [{ file: f.name, ln: e.ln, note: 'EXEC CICS ' + e.cmd + (e.qtype ? ' ' + e.qtype : '') + ' QUEUE(' + e.queue + ')' }]);
        }
        if (e.op && e.file && !(C.cicsToFile && C.cicsToFile[e.file])){
          const fnode = addNode('fct', e.file, {});
          addEdge(pid, fnode.id, e.op, e.fileViaVar ? 'probable' : 'certain', [{ file: f.name, ln: e.ln, note: 'EXEC CICS ' + e.cmd + ' FILE(' + e.file + ')' + (e.fileViaVar ? ' (via variable, value traced)' : '') + ' — FCT entry, dataset unknown' }]);
        }
      });
      // internal flow for the flow panel
      const inn = { paragraphs: C.paragraphs, dead: C.dead || [], edges: [] };
      C.performs.forEach(p => inn.edges.push({ from: p.from, to: p.to, k: 'perform', ln: p.ln }));
      C.gotos.forEach(g => inn.edges.push({ from: g.from, to: g.to, k: 'goto', ln: g.ln }));
      C.cics.forEach(x => (x.handles || []).forEach(h => inn.edges.push({ from: x.para, to: h.to, k: 'handle', ln: x.ln })));
      m.internal[progName] = inn;
      // paragraphs/sections = graph nodes (navigable impact: job → step → prog → para)
      const paraIds = new Set(C.paragraphs.map(p=>p.name));
      C.paragraphs.forEach(p => {
        const pnode = addNode('para', progName + '.' + p.name, { program: progName, ln: p.ln, section: !!p.section, dead: (C.dead || []).some(d => d.name === p.name) });
        addEdge(pid, pnode.id, 'contains', 'certain', [{ file: f.name, ln: p.ln, note: p.section ? 'section header' : 'paragraph' }]);
      });
      const pEdge = (from, to, k, conf, note, ln2) => {
        if (!from || !paraIds.has(from) || !paraIds.has(to) || from === to) return;
        addEdge('para|' + progName + '.' + from, 'para|' + progName + '.' + to, k, conf, [{ file: f.name, ln: ln2, note }]);
      };
      // PERFORM/GO TO targets not defined (dynamic via variable, inline form):
      // never an invented edge, but explicitly flagged (limits card convention)
      C.performs.forEach(pr => {
        if (pr.to && pr.kind !== 'sort' && !paraIds.has(pr.to))
          m.warnings.push('PERFORM ' + pr.to + ' in ' + progName + ' (line ' + pr.ln + '): target unknown (not a defined paragraph — dynamic or inline form), no edge created');
      });
      C.gotos.forEach(g => {
        if (g.to && !paraIds.has(g.to))
          m.warnings.push('GO TO ' + g.to + ' in ' + progName + ' (line ' + g.ln + '): target unknown (not a defined paragraph — dynamic GO TO?), no edge created');
      });
      C.performs.forEach(pr => {
        pEdge(pr.from, pr.to, 'perform', 'certain', 'PERFORM ' + pr.to + (pr.thru ? ' THRU ' + pr.thru : ''), pr.ln);
        if (pr.thru) pEdge(pr.from, pr.thru, 'perform', 'certain', 'PERFORM ' + pr.to + ' THRU ' + pr.thru, pr.ln);
      });
      C.gotos.forEach(g => {
        pEdge(g.from, g.to, 'goto', g.depending ? 'probable' : 'certain', g.depending ? 'GO TO (DEPENDING ON — branch)' : 'GO TO', g.ln);
      });
      // EXEC CICS HANDLE CONDITION/AID err(PARA): explicit control transfer → certain edge
      C.cics.forEach(x => (x.handles || []).forEach(h => pEdge(x.para, h.to, 'handle', 'certain', 'EXEC CICS ' + x.cmd + ' ' + h.key + '(' + h.to + ')', x.ln)));
      if ((C.dead || []).length){
        m.warnings.push('dead code: ' + C.dead.length + ' unreachable paragraph(s) in ' + progName + ' (' +
          C.dead.slice(0, 6).map(d => d.name).join(', ') + (C.dead.length > 6 ? ', …' : '') +
          ') — never targeted by PERFORM/GO TO, no fall-through path');
      }
    }
    if (f.lang === 'CPY'){
      addNode('cpy', base(f.name), { file: f.name });
    }
  });

  // backrefs: *.STEP.DD → real dataset of the source step (JCL-only usage, no COBOL evidence → probable)
  files.forEach(f => {
    if (f.lang !== 'JCL') return;
    (f.parsed.jobs || []).forEach(jb => {
      const jname = jnameOf(jb, f);
      (jb.steps || []).forEach(st => {
        const sid = 'step|' + jname + '.' + (st._sname || st.name);
        (st.dds || []).forEach(d => {
          if (!d.backref) return;
          const r = resolveDD(jb, d);
          const op = OP_MAP[d.usage] || 'unknown';
          if (r){
            const dsNode = addNode('ds', r.name, { temp: r.temp, gdg: r.gdg });
            addEdge(sid, dsNode.id, op, op === 'unknown' ? 'unknown' : 'probable', [
              { file: f.name, ln: d.line, note: 'DD ' + d.ddname + ' DSN=' + d.name },
              { file: f.name, ln: d.line, note: 'resolves to ' + r.name }
            ]);
          } else {
            m.warnings.push('backref ' + d.name + ' in ' + jname + '.' + st.name + ' could not be resolved (source step/DD not found)');
          }
        });
      });
    });
  });

  // loaded programs never executed nor called in the analyzed set —
  // honest: may be called by NON-uploaded code (CICS START, scheduler…)
  [...nodes.values()].forEach(n => {
    if (n.type !== 'prog') return;
    const called = (rev[n.id] || []).some(e => e.k === 'exec' || e.k === 'call');
    if (!called) m.warnings.push('program ' + n.name + ' is never executed or called in the analyzed set — possibly dead, or called by code not uploaded (scheduler, CICS START, other jobs)');
  });

  // ── Additional dead code: datasets written never read, copybooks never COPYed ──
  // HONEST: "never read in the analyzed set" ≠ useless — other non-uploaded
  // jobs may consume it. No conclusion on unknown-usage datasets
  // (without DISP) nor on temporaries (uncertain intra-job scope)
  // nor on DB2 tables (read by applications outside the set). Signal
  // separate (m.dead), not a blocking warning.
  m.dead = { datasets: [], copybooks: [] };
  [...nodes.values()].forEach(n => {
    if (n.type === 'ds' && !n.data.temp){
      const inc = rev[n.id] || [];
      const hasUnknown = inc.some(e => e.k === 'unknown');
      const writeLike = inc.some(e => e.k === 'write' || e.k === 'update');
      const readLike = inc.some(e => e.k === 'read' || e.k === 'update');
      if (writeLike && !readLike && !hasUnknown) m.dead.datasets.push(n.name);
    } else if (n.type === 'cpy'){
      const used = (rev[n.id] || []).some(e => e.k === 'uses');
      if (!used) m.dead.copybooks.push(n.name);
    }
  });

  // phase 4: stable sort by severity — blocking warnings appear first
  m.warnings.sort((a, b) => warnSeverity(a) - warnSeverity(b));
  return m;
}

function impact(model, id){
  // BFS upstream/downstream, depth ≤ 12, shortest path per node,
  // confidence = the weakest along the path.
  // MULTI-PATHS: when several distinct shortest paths lead to the
  // same node, ALL are kept (up to 3 per node, anti-explosion
  // cap) — an impact is never reduced to one arbitrary route.
  const up = { direct: [], indirect: [] };
  const down = { direct: [], indirect: [] };
  const adj = model.fwd, radj = model.rev;
  // Depth-limit transparency (spec 4.3): when the BFS is stopped at the limit,
  // the caller MUST know the impact may be partial — never presented as exhaustive.
  const truncated = { fwd: false, rev: false };
  const walk = (graph, bucket, dir) => {
    const seen = new Map();
    const q = [{ id, depth: 0, path: [id], edge: null, conf: 'certain' }];
    while (q.length){
      const cur = q.shift();
      if (cur.depth >= 12){ truncated[dir] = true; continue; }
      const list = (dir === 'fwd' ? (adj[cur.id]||[]) : (radj[cur.id]||[]));
      for (const e of list){
        const next = dir === 'fwd' ? e.t : e.f;
        if (next === id) continue;
        const conf = e.c === 'certain' ? cur.conf : (cur.conf === 'certain' ? e.c : (cur.conf === 'probable' && e.c === 'certain' ? 'probable' : 'unknown'));
        const path = cur.path.concat([next]);
        const ex = seen.get(next);
        if (!ex){
          const rec = { id: next, depth: cur.depth + 1, path, edge: e, conf, paths: [{ path, conf, edge: e }] };
          seen.set(next, rec);
          (cur.depth + 1 === 1 ? bucket.direct : bucket.indirect).push(rec);
          q.push({ id: next, depth: cur.depth + 1, path, edge: e, conf });
        } else if (path.length === ex.path.length && ex.paths.length < 3
                   && !ex.paths.some(p => p.path.join('\u0001') === path.join('\u0001'))){
          // alternative path of the same length (BFS guarantees shortest
          // first): recorded, never hidden.
          ex.paths.push({ path, conf, edge: e });
        }
      }
    }
  };
  walk(adj, down, 'fwd');
  walk(radj, up, 'rev');
  return { up, down, depthLimit: 12,
    truncated: (truncated.fwd || truncated.rev) ? { fwd: truncated.fwd, rev: truncated.rev } : null };
}

function getModel(){
  if (!state._model){
    // re-parse of COBOL whose missing copybook arrived later
    let changed = true, guard = 0;
    while (changed && guard < 5){
      changed = false; guard++;
      const reg = cobRegistry();
      state.files.forEach(f => {
        // INCLUDE JCL: re-parse if a missing member arrived since
        if (f.lang === 'JCL' && (f.parsed.warnings||[]).some(w => {
          const mm = /INCLUDE member ([A-Z0-9@$.]+) not uploaded/.exec(w);
          return mm && jclMembers(f.name)[mm[1]] !== undefined;
        })){
          parseFile(f);
          changed = true;
        }
        if (f.lang !== 'CBL' || !f.parsed.cobol) return;
        if ((f.parsed.cobol.copyUsed||[]).some(c => !c.resolved && reg[c.name])){
          parseFile(f);
          changed = true;
        }
      });
    }
    state._model = buildModel(state.files);
    // ── Living graph: auto-snapshot after each (re)build. Deduplicated:
    // a rebuild that changes nothing does not create a new version. ──
    autoSnapshot();
  }
  return state._model;
}

// ══════════════════ LIVING GRAPH: versioned snapshots + diff over time ══════════════════
// Every analysis build records a snapshot (nodes, relations, per-file content
// hashes). The History panel diffs any two snapshots — the reviewer sees what
// a change touched, with the same evidence rules as the rest of the tool.
// Honest limits: rename detection is NOT attempted (a renamed dataset shows as
// one removal + one addition); snapshots are content-derived, nothing invented.
const HISTORY_CAP = 20; // oldest snapshots dropped; export the project to keep more
function strHash(s){ let h = 5381; for (let i = 0; i < s.length; i++){ h = ((h << 5) + h + s.charCodeAt(i)) | 0; } return String(h); }
function graphSnapshot(label){
  const m = getModel();
  const nodes = {};
  m.nodes.forEach(n => { nodes[n.id] = { type: n.type, name: n.name }; });
  const edges = {};
  m.edges.forEach(e => { edges[e.f + '|' + e.t + '|' + e.k] = e.c; });
  const fileHashes = {};
  state.files.forEach(f => { fileHashes[f.name] = strHash(f.text || ''); });
  return { label: label || '', ts: Date.now(),
    counts: { nodes: m.nodes.size, edges: m.edges.length, warnings: (m.warnings || []).length },
    nodes, edges, fileHashes };
}
function graphDiff(a, b){
  const nodesAdded = [], nodesRemoved = [], edgesAdded = [], edgesRemoved = [], edgesChanged = [];
  Object.keys(b.nodes).forEach(id => { if (!a.nodes[id]) nodesAdded.push({ id, name: b.nodes[id].name, type: b.nodes[id].type }); });
  Object.keys(a.nodes).forEach(id => { if (!b.nodes[id]) nodesRemoved.push({ id, name: a.nodes[id].name, type: a.nodes[id].type }); });
  Object.keys(b.edges).forEach(k => {
    if (!a.edges[k]) edgesAdded.push(k);
    else if (a.edges[k] !== b.edges[k]) edgesChanged.push({ k, from: a.edges[k], to: b.edges[k] });
  });
  Object.keys(a.edges).forEach(k => { if (!b.edges[k]) edgesRemoved.push(k); });
  const filesChanged = Object.keys(b.fileHashes).filter(f => f in a.fileHashes && a.fileHashes[f] !== b.fileHashes[f]);
  const filesAdded = Object.keys(b.fileHashes).filter(f => !(f in a.fileHashes));
  const filesRemoved = Object.keys(a.fileHashes).filter(f => !(f in b.fileHashes));
  return { nodesAdded, nodesRemoved, edgesAdded, edgesRemoved, edgesChanged, filesChanged, filesAdded, filesRemoved };
}
function autoSnapshot(){
  const snap = graphSnapshot();
  const last = state.history[state.history.length - 1];
  if (last && JSON.stringify(last.fileHashes) === JSON.stringify(snap.fileHashes)
           && last.counts.nodes === snap.counts.nodes && last.counts.edges === snap.counts.edges) return last;
  snap.label = 'v' + (state.history.length + 1);
  state.history.push(snap);
  if (state.history.length > HISTORY_CAP) state.history.shift();
  return snap;
}
function takeSnapshot(label){
  const snap = graphSnapshot(label || 'manual');
  snap.label = label || ('v' + (state.history.length + 1) + ' (manual)');
  state.history.push(snap);
  if (state.history.length > HISTORY_CAP) state.history.shift();
  return snap;
}
function clearHistory(){ state.history = []; state.histA = null; state.histB = null; }

function confBadge(c){

  const x = map[c] || map.unknown;

  const x = map[op] || map.unknown;

function evHTML(ev){

const EDGE_VERB = { exec:'executes', contains:'contains step', read:'reads', write:'writes', update:'updates', unknown:'usage unclear', uses:'uses copybook', call:'calls', 'sql-read':'SELECTs', 'sql-write':'INSERTs/DELETEs', 'sql-update':'UPDATEs', perform:'PERFORMs', goto:'branches to (GO TO)', delete:'deletes records in' };
function impNodeId(i){ const ns = [...getModel().nodes.values()].filter(n => n.type !== 'step'); return ns[+i] ? ns[+i].id : null; }

// ══════════════════ SELF-TESTS (built-in test suite) ══════════════════
function runSelfTests(){
  const out = [];
  const T = (name, cond) => out.push({ name, pass: !!cond });
  try {
    const PAYREC = ['01  PAY-RECORD.','    05  ACC-ID      PIC 9(8).','    COPY INNER.'].join('\n');
    const INNER  = '05  INNER-FLD PIC X(4).';
    const reg = { PAYREC:{text:PAYREC,file:'PAYREC.CPY'}, INNER:{text:INNER,file:'INNER.CPY'} };
    const F1 = ['000100 IDENTIFICATION DIVISION.','000200 PROGRAM-ID. CBPAY100.','000300 ENVIRONMENT DIVISION.','000400 INPUT-OUTPUT SECTION.','000500 FILE-CONTROL.','000600     SELECT TRANS-FILE ASSIGN TO TRANS.','000700 DATA DIVISION.','000800 FILE SECTION.','000900 FD  TRANS-FILE.','001000 01  TRANS-RECORD.','001100     COPY PAYREC.','001200 WORKING-STORAGE SECTION.','001300 01  WS-HOURS      PIC 9(4)V99.','001400 01  WS-PGM        PIC X(8).','001700 PROCEDURE DIVISION.','001800 MAIN-PARA.','001900     PERFORM INIT-PARA.','002000     MOVE \'SUBPGM\' TO WS-PGM.','002100     CALL WS-PGM.','002200     CALL \'CBPAY200\'.','002300     GO TO END-PARA.','002400 INIT-PARA.','002500     OPEN INPUT TRANS-FILE.','002600     READ TRANS-FILE.','002900 END-PARA.','003000     EXEC SQL','003100         SELECT ACC_ID FROM PAYROLL.ACCOUNTS A, PAYROLL.HIST','003200     END-EXEC','003400     EXEC SQL INSERT INTO PAYHIST VALUES (:X) END-EXEC'].join('\n');
    const C1 = parseCOBOL('CBPAY100.CBL', F1, reg);
    T('COBOL: fixed format detected', C1.fixed === true);
    T('COBOL: PROGRAM-ID', C1.programId === 'CBPAY100');
    T('COBOL: SELECT ASSIGN', C1.selects.length === 1 && C1.selects[0].dd === 'TRANS');
    T('COBOL: PIC clause', (C1.vars.find(v=>v.name==='WS-HOURS')||{}).pic === '9(4)V99');
    T('COBOL: COPY spliced into vars', !!C1.vars.find(v=>v.name==='ACC-ID'));
    T('COBOL: nested COPY resolved', !!C1.vars.find(v=>v.name==='INNER-FLD'));
    T('COBOL: PERFORM target', ((C1.performs.find(p=>p.to==='INIT-PARA')||{}).from) === 'MAIN-PARA');
    T('COBOL: dynamic CALL resolved from MOVE', (C1.calls.find(c=>c.viaVar==='WS-PGM')||{}).target === 'SUBPGM');
    T('COBOL: I/O verb on file', (C1.fileOps['TRANS-FILE']||[]).some(o=>o.op==='read'));
    const reads = C1.sql.filter(x=>x.op==='read').flatMap(x=>x.tables);
    T('SQL: FROM tables + alias list', reads.includes('PAYROLL.ACCOUNTS') && reads.includes('PAYROLL.HIST'));
    T('SQL: INSERT INTO table', C1.sql.filter(x=>x.op==='write').flatMap(x=>x.tables).includes('PAYHIST'));
    const F2 = ['IDENTIFICATION DIVISION.','PROGRAM-ID. FREEPGM.','WORKING-STORAGE SECTION.','COPY PAYREC REPLACING ==PAY-== BY ==FR-==.','COPY MISSING1.','PROCEDURE DIVISION.'].join('\n');
    const C2 = parseCOBOL('F2.CBL', F2, reg);
    T('COBOL: REPLACING applied', !!C2.vars.find(v=>v.name==='FR-RECORD'));
    T('COBOL: missing copybook warned, not invented', C2.warns.some(w=>w.includes('MISSING1')));
    const JCLT = ['//PAYRUN0  JOB  (ACCT),\'PAY\',CLASS=A','//STEP010  EXEC PGM=SORT','//SORTIN   DD DSN=PAYROLL.TRANS,DISP=SHR','//SORTOUT  DD DSN=&&SORTED,DISP=(,PASS)','//STEP020  EXEC PGM=CBPAY100','//TRANS    DD DSN=*.STEP010.SORTOUT,DISP=OLD','//OUTDS    DD DSN=PAYROLL.MASTER(+1),DISP=(,CATLG)','//STEP030  EXEC PGM=CBPAY200','//PAYMAST  DD DSN=PAYROLL.MASTER,DISP=OLD','//NODISP   DD DSN=NODISP.DATA'].join('\n');
    const mfiles = [
      { name:'PAYRUN0.JCL', lang:'JCL', text:JCLT },
      { name:'CBPAY100.CBL', lang:'CBL', text:F1 },
      { name:'PAYREC.CPY', lang:'CPY', text:PAYREC },
    ];
    mfiles.forEach(f => {
      if (f.lang === 'JCL'){
        const res = parseJCL(f.text);
        if (!res.jobs.length && !Object.keys(res.procs).length) res.jobs.push({ name: base(f.name), steps: [], procsUsed: [], params: {} });
        f.parsed = { jobs: res.jobs, procs: res.procs, warnings: res.warnings };
      } else {
        const C = parseCOBOL(f.name, f.text, reg);
        f.parsed = { cobol: C, warnings: C.warns, programId: C.programId,
          copies: C.copyUsed.map(c=>({name:c.name, resolved:!!c.resolved})),
          sqlCount: C.sql.length, performs: C.performs.length, gotos: C.gotos.length };
      }
    });
    const M = buildModel(mfiles);
    const E = M.edges;
    const has = (f,t,k) => E.some(e => e.f===f && e.t===t && e.k===k);
    T('GRAPH: exec step→prog', has('step|PAYRUN0.STEP020','prog|CBPAY100','exec'));
    T('GRAPH: SELECT+READ → certain read (backref)', (E.find(e=>e.f==='step|PAYRUN0.STEP020'&&e.t==='ds|&&SORTED'&&e.k==='read')||{}).c === 'certain');
    T('GRAPH: DISP-only → probable input', (E.find(e=>e.f==='step|PAYRUN0.STEP010'&&e.t==='ds|PAYROLL.TRANS'&&e.k==='read')||{}).c === 'probable');
    T('GRAPH: no DISP → unknown, flagged not guessed', has('step|PAYRUN0.STEP030','ds|NODISP.DATA','unknown'));
    T('GRAPH: program uses copybook', has('prog|CBPAY100','cpy|PAYREC','uses'));
    T('GRAPH: SQL table edge', has('prog|CBPAY100','tbl|PAYROLL.ACCOUNTS','sql-read'));
    const imp = impact(M, 'cpy|PAYREC');
    T('IMPACT: copybook → program direct', imp.up.direct.length === 1 && imp.up.direct[0].id === 'prog|CBPAY100');
    const jobHit = imp.up.indirect.find(x => x.id === 'job|PAYRUN0');
    T('IMPACT: copybook → job indirect via full path', !!jobHit && jobHit.path.length === 4);
    const imp2 = impact(M, 'prog|CBPAY100');
    T('IMPACT: program upstream direct = executing step', imp2.up.direct.some(x => x.id === 'step|PAYRUN0.STEP020'));
    T('GRAPH: no duplicate edges (conf dedup + evidence merge)', !E.some((e,i)=>E.slice(i+1).some(x=>x.f===e.f&&x.t===e.t&&x.k===e.k)));
  } catch (err){
    out.push({ name: 'self-test crashed: ' + err.message, pass: false });
  }
  return out;
}

    // ── 6. EXEC CICS: FCT files, maps, queues, XCTL/LINK, never invented ──

      // translation: PERFORM THRU simulated, GO TO DEPENDING not silently translated
      const TR = translateCOBOL({ name: 'NPX.CBL', text: CT, parsed: { cobol: C } });
      const st = TR.stmts || [];
      const thruApprox = st.some(x => x.status === 'approximated' && /THRU/.test(x.note || ''));
      const gotoDep = st.some(x => x.status === 'unsupported' || /DEPENDING/.test(x.note || ''));
      return numberedOk && thruOk && dependingOk && conservative && noKwPara && thruApprox && gotoDep;
    })());

    // ── 21.39 Robustness: empty / garbage / CRLF / no-extension never throw ──
    T('V2 ROBUST 21.39: empty, binary garbage, CRLF, unknown extension — no throw, explicit warnings', (() => {
      // empty COBOL → parsed, explicit warning, no throw
      const Ce = parseCOBOL('E.CBL', '', {});
      const emptyOk = Ce.programId === null && (Ce.warns || []).some(w => /PROGRAM-ID not found/.test(w));
      // binary-ish garbage → parsed, no throw
      let garb = '';
      for (let i = 0; i < 200; i++) garb += String.fromCharCode(32 + ((i * 37 + 7) % 95));
      const Cg = parseCOBOL('G.CBL', garb, {});
      const garbageOk = !!Cg && Array.isArray(Cg.warns);
      // CRLF line endings → paragraphs recognized
      const Cr = parseCOBOL('CR.CBL', 'IDENTIFICATION DIVISION.\r\nPROGRAM-ID. CR9.\r\nPROCEDURE DIVISION.\r\nP1.\r\n    STOP RUN.', {});
      const crlfOk = Cr.paragraphs.some(p => p.name === 'P1') && (Cr.dead || []).length === 0;
      // unknown extension → TXT (no parse branch), no crash downstream
      const langOk = detectLang('DATA.BIN', 'whatever') === 'TXT';
      // garbage JCL → warnings, no throw
      const Jg = parseJCL('///### garbage $$$\nrandom text\n', {});
      const jclOk = Jg.jobs.length === 0 && (Jg.warnings || []).length >= 1;
      return emptyOk && garbageOk && crlfOk && langOk && jclOk;
    })());

    // ── 21.40 Impact depth limit is SIGNALLED (partial ≠ exhaustive) ──
    T('V2 IMPACT 21.40: chain deeper than 12 → truncated flag true + Impact panel shows the warning', (() => {
      // build a 15-program static CALL chain: P1 CALLs P2 … P14 CALLs P15
      const filesC = [];
      for (let i = 1; i <= 15; i++){
        const nxt = i < 15 ? ("    CALL 'P" + (i + 1) + "'.\n") : '';
        const CTi = ['IDENTIFICATION DIVISION.', 'PROGRAM-ID. P' + i + '.', 'PROCEDURE DIVISION.',
          'P1.', nxt, '    STOP RUN.'].join('\n');
        filesC.push({ name: 'P' + i + '.CBL', lang: 'CBL', text: CTi, parsed: { cobol: parseCOBOL('P' + i + '.CBL', CTi, {}) } });
      }
      const bakC = { files: state.files, loaded: state.loaded, _model: state._model, entity: state.entity, group: state.group, sub: state.sub };
      try {
        state.files = filesC; state.loaded = true; state._model = null;
        const m = getModel();
        const res = impact(m, 'prog|P1');
        const truncatedSomewhere = !!res.truncated && (res.truncated.fwd || res.truncated.rev);
        state.entity = 'prog|P1'; state.group = 'analyze'; state.sub = 'impact';
        renderContent();
        const h = document.getElementById('content').innerHTML;
        const panelWarns = h.indexOf('Depth limit') >= 0 && h.indexOf('PARTIAL') >= 0;
        return truncatedSomewhere && panelWarns;
      } finally { state.files = bakC.files; state.loaded = bakC.loaded; state._model = bakC._model; state.entity = bakC.entity; state.group = bakC.group; state.sub = bakC.sub; }
    })());
  } catch (e){
    out.push({ name: 'V2 suite crashed: ' + e.message, pass: false });
  } finally {
    state.files = bak.files; state.loaded = bak.loaded; state.log = bak.log;
    state.entity = bak.entity; state.srcIdx = bak.srcIdx; state.srcFile = bak.srcFile;
    state.group = bak.group; state.sub = bak.sub; state._model = null;
  }
  return out;
}

// ══════════════════ 2. GESTION DES FICHIERS ══════════════════
function cobRegistry(){
  // copybook registry: base name → {text, file}
  const reg = {};
  state.files.forEach(x => { if (x.lang === 'CPY') reg[base(x.name)] = { text: x.text, file: x.name }; });
  return reg;
}

function jclMembers(excludeName){
  // available INCLUDE members = JCL files of the project, indexed by member name (without extension)
  const members = {};
  state.files.forEach(x => { if (x.lang === 'JCL' && x.name !== excludeName) members[base(x.name)] = x.text; });
  return members;
}

function parseFile(f){
  f.parsed = {};
  const t = f.text;
  if (f.lang === 'JCL'){
    const res = parseJCL(t, jclMembers(f.name));
    // no JOB nor PROC → pseudo-job named after the file ; PROC-only file → no pseudo-job
    if (!res.jobs.length && !Object.keys(res.procs).length)
      res.jobs.push({ name: base(f.name), steps: [], procsUsed: [], params: {} });
    res.jobs.forEach(jb => { jb.srcFile = f.name; });
    f.parsed = { engine: 'v3', jobs: res.jobs, procs: res.procs, warnings: res.warnings };
  } else if (f.lang === 'CBL' || f.lang === 'CPY'){
    const C = parseCOBOL(f.name, t, cobRegistry());
    f.parsed = { engine: 'v3', cobol: C, warnings: C.warns,
      programId: f.lang === 'CBL' ? C.programId : null,
      copies: C.copyUsed.map(c => ({ name: c.name, resolved: !!c.resolved })),
      sqlCount: C.sql.length, cicsCount: C.cics.length, performs: C.performs.length, gotos: C.gotos.length, deadCount: (C.dead||[]).length };
  } else if (f.lang === 'REXX'){
    const R = parseREXX(f.name, t);
    f.parsed = { engine: 'v3', rexx: R, warnings: R.warns,
      programId: R.execName, calls: R.calls.length, dsns: R.dsns.length };
  } else if (f.lang === 'SCHED'){
    const S = parseSched(t);
    f.parsed = { engine: 'v3', sched: S, warnings: S.warnings,
      depCount: S.deps.reduce((n, d) => n + d.after.length, 0) };
  } else if (f.lang === 'JOBLOG'){
    const LG = parseJobLog(t);
    f.parsed = { engine: 'v3', joblog: LG, warnings: LG.warnings,
      jobs: LG.logs.map(l => l.job), stepCount: LG.logs.reduce((a, l) => a + l.steps.length, 0) };
  }
  state._model = null; // the graph must be rebuilt
}

function buildGraph(){
  const g = { jobs:[], programs:[], copybooks:[], datasets:[], edges:[] };
  const seen = new Set();
  const addEdge = (from,to) => {
    from = String(from).toUpperCase(); to = String(to).toUpperCase();
    const k = from+'→'+to;
    if (from !== to && !seen.has(k)){ seen.add(k); g.edges.push({from,to}); }
  };
  if (state.files.length) linkCatalogedProcs();
  state.files.forEach(f=>{
    if (f.lang === 'JCL'){
      // engine v2: one file can contain several jobs — one entry per job
      // (PROC-only files do not become pseudo-jobs)
      const jobs = f.parsed.jobs || [];
      jobs.forEach(jb=>{
        const steps = (jb.steps||[]).map(s => ({
          name: s.name, pgm: s.target, kind: s.kind,
          proc: s.proc || null, via: s.via || null, condition: s.condition || null,
          sortInfo: s.sortInfo || null, rexxExec: s.rexxExec || null,
          cond: s.cond || null, rd: s.rd || null,
          rcObs: s.rcObs != null ? s.rcObs : null, abendObs: s.abendObs || null,
          flushedObs: !!s.flushedObs, condEval: s.condEval || null,
          dds: s.dds || []
        }));
        const dsns = [...new Set((jb.steps||[]).flatMap(s => (s.dds||[]))
          .filter(d => d.name && !d.temp && !d.backref).map(d => String(d.name).toUpperCase()))];
        g.jobs.push({ name: (jb.name || base(f.name)), file: f.name, lines: f.lines,
          parsed: { steps, dsns, warnings: (f.parsed && f.parsed.warnings) || [] } });
      });
    }
    else if (f.lang === 'CBL' || f.lang === 'REXX') g.programs.push(f);
    else if (f.lang === 'CPY') g.copybooks.push(f);
  });
  g.jobs.forEach(j=>{
    const jid = base(j.name);
    j.parsed.steps.forEach(s => { if (s.pgm) addEdge(jid, s.pgm); });
    j.parsed.dsns.forEach(d => { if(!g.datasets.includes(d)) g.datasets.push(d); addEdge(jid, d); });
  });
  g.programs.forEach(p=>{
    const pid = p.parsed.programId;
    (p.parsed.copies||[]).forEach(cu=>{
      const c = cu.name;
      g.copybooks.forEach(cb=>{
        const cbn = base(cb.name);
        if (cu.resolved && (cbn === c || c.indexOf(cbn) === 0)) addEdge(pid, cbn);
      });
    });
  });
  return g;
}

function typeOf(label, g){
  if (g.jobs.some(j=>base(j.name)===label)) return 'JCL JOB';
  if (g.programs.some(p=>p.parsed.programId===label)) return 'COBOL';
  if (g.copybooks.some(c=>base(c.name)===label)) return 'COPYBOOK';
  if (g.datasets.includes(label)) return 'DATASET';
  return 'UNKNOWN';
}

// Human-readable description of a step, computed from its real DDs (engine v2)
function stepDesc(s){
  if (!s.pgm) return 'EXEC — no PGM/PROC resolved (see Debug log)';
  const parts = [ s.kind === 'PROC' ? `EXEC PROC=${esc(s.pgm)}` : `EXEC PGM=${esc(s.pgm)}` ];
  const ins   = (s.dds||[]).filter(d => d.usage === 'input'  && d.name && !d.temp).map(d => esc(d.name));
  const outs  = (s.dds||[]).filter(d => d.usage === 'output' && d.name && !d.temp)
                 .map(d => esc(d.name) + (d.gdg != null ? ` (GDG ${d.gdg > 0 ? '+' : ''}${d.gdg})` : ''));
  const temps = (s.dds||[]).filter(d => d.temp).map(d => esc(d.name));
  if (ins.length)   parts.push(`reads ${ins.join(', ')}`);
  if (outs.length)  parts.push(`writes ${outs.join(', ')}`);
  if (temps.length) parts.push(`temp ${temps.join(', ')}`);
  if (s.proc) parts.push(`<span style="color:var(--purple)">from PROC ${esc(s.proc)}${s.via ? ' (via ' + esc(s.via) + ')' : ''}</span>`);
  const ovs = (s.dds||[]).filter(d => d.overriddenBy).map(d => esc(d.overriddenBy) + (d.name ? ' → ' + esc(d.name) : ' (DD DUMMY)'));
  if (ovs.length) parts.push(`<span style="color:var(--yellow)">override ${ovs.join(', ')}</span>`);
  if (s.condition){
    const c = s.condition, txt = c && c.text ? c.text : String(c);
    parts.push(`<span style="color:var(--yellow)">if ${c && c.neg ? 'NOT ' : ''}${esc(c && c.neg ? '(' + txt + ')' : txt)}</span>`);
  }
  if (s.sortInfo){
    const si = s.sortInfo;
    const f = si.type === 'copy' ? 'FIELDS=COPY'
      : (si.fields.length ? 'FIELDS=' + si.fields.map(x => `${x.pos}:${x.len} ${x.type} ${x.order}`).join(', ')
       : 'fields not decoded');
    parts.push(`<span style="color:var(--blue)">SORT ${esc(f)}${si.sum ? ' · SUM ' + esc(si.sum) : ''}</span>`);
    const ioc = si.include || si.omit;
    if (ioc) parts.push(`<span style="color:var(--blue)">${si.include ? 'INCLUDE' : 'OMIT'} ${ioc.decoded ? esc(ioc.conds.map((c, i) => (i ? ' ' + ((ioc.joins && ioc.joins[i-1]) || 'AND') + ' ' : '') + c.pos + (c.len != null ? ':' + c.len : '') + ' ' + c.type + ' ' + c.op + ' ' + (c.field2 ? '(' + c.value + ')' : c.value)).join('')) : 'COND=' + esc(ioc.raw) + ' (not decoded)'}</span>`);
    const rc = si.inrec || si.outrec;
    if (rc) parts.push(`<span style="color:var(--blue)">${si.inrec ? 'INREC' : 'OUTREC'} ${rc.kind} ${rc.decoded ? esc(rc.items.map(x => x.literal != null ? x.out + ':C&quot;' + x.literal + '&quot;' : (x.out != null ? x.out + ':' : '') + x.pos + ',' + x.len).join(', ')) : esc(rc.raw) + ' (not decoded)'}</span>`);
    const ofl = (si.outfil || []).flatMap(x => x.names || []);
    if (ofl.length) parts.push(`<span style="color:var(--blue)">OUTFIL → ${esc(ofl.join(', '))}</span>`);
  }
  if (s.rexxExec) parts.push(`<span style="color:var(--purple)">SYSTSIN EXEC '${esc(s.rexxExec)}' (REXX/CLIST)</span>`);
  if (s.cond){
    const cd = String(s.cond).replace(/\s/g, '');
    if (/EVEN\)?$/.test(cd)) parts.push(`<span style="color:var(--yellow)">COND ${esc(String(s.cond))} (runs even after a previous abend)</span>`);
    else if (/ONLY\)?$/.test(cd)) parts.push(`<span style="color:var(--yellow)">COND ${esc(String(s.cond))} (exceptional path — runs only after an abend)</span>`);
    else if (s.condEval) parts.push(`<span style="color:var(--yellow)">COND ${esc(String(s.cond))} evaluated from uploaded job log: ${s.condEval.skip ? 'BYPASSED' : 'EXECUTED'} (${esc(s.condEval.note)})</span>`);
    else parts.push(`<span style="color:var(--yellow)">COND ${esc(String(s.cond))} (not evaluated)</span>`);
  }
  // RC / ABEND / flush actually observed in an uploaded job log
  if (s.rcObs != null) parts.push(`<span style="color:var(--green)">RC ${String(s.rcObs).padStart(4, '0')} (job log)</span>`);
  if (s.abendObs) parts.push(`<span style="color:var(--red)">ABEND ${esc(s.abendObs)} (job log)</span>`);
  if (s.flushedObs) parts.push(`<span style="color:var(--yellow)">bypassed/flushed per job log</span>`);
  if (s.rd) parts.push(`<span style="color:var(--yellow)">RD=${esc(String(s.rd))} (restart)</span>`);
  return parts.join(' · ');
}

// ══════════════════ 2. GESTION DES FICHIERS ══════════════════

// ── Honest byte decoding: UTF-8 (+BOM), UTF-16, EBCDIC CP037 (subset) ──
// z/OS files often come down in EBCDIC: without decoding, analysis is
// impossible (mojibake). Documented CP037 subset: letters/digits/punctuation
// COBOL-JCL; any byte outside the table → '?' (counted, never guessed).
const CP037 = (() => {
  const T = new Array(256).fill(null);
  T[0x00] = '\u0000'; T[0x0D] = '\r'; T[0x05] = '\t'; T[0x25] = '\n';
  T[0x40] = ' ';
  for (let i = 0; i < 10; i++) T[0xF0 + i] = String(i);
  const UP = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', LO = 'abcdefghijklmnopqrstuvwxyz';
  for (let i = 0; i < 9; i++) T[0x81 + i] = LO[i];
  for (let i = 0; i < 9; i++) T[0x91 + i] = LO[9 + i];
  for (let i = 0; i < 8; i++) T[0xA2 + i] = LO[18 + i];
  for (let i = 0; i < 9; i++) T[0xC1 + i] = UP[i];
  for (let i = 0; i < 9; i++) T[0xD1 + i] = UP[9 + i];
  for (let i = 0; i < 8; i++) T[0xE2 + i] = UP[18 + i];
  const P = { 0x4A:'¢', 0x4B:'.', 0x4C:'<', 0x4D:'(', 0x4E:'+', 0x4F:'|', 0x50:'&',
    0x5A:'!', 0x5B:'$', 0x5C:'*', 0x5D:')', 0x5E:';', 0x5F:'¬', 0x60:'-', 0x61:'/',
    0x6B:',', 0x6C:'%', 0x6D:'_', 0x6E:'>', 0x6F:'?', 0x7A:':', 0x7B:'#', 0x7C:'@',
    0x7D:"'", 0x7E:'=', 0x7F:'"', 0xAD:'[', 0xBD:']', 0xC0:'{', 0xD0:'}' };
  for (const k of Object.keys(P)) T[+k] = P[k];
  return T;
})();
function ebcdicDecode(b){
  let out = '', unmapped = 0;
  for (let i = 0; i < b.length; i++){
    const ch = CP037[b[i]];
    if (ch === null){ unmapped++; out += '?'; } else out += ch;
  }
  return { text: out, unmapped };
}
// Transparent heuristic: an EBCDIC file is dominated by bytes ≥ 0x81
// (letters/digits) and poor in printable ASCII bytes. A UTF-8/Latin-1 file
// is the reverse (accent included) — never converted by mistake. Documented ambiguity:
// EBCDIC punctuation (0x4A-0x7F) overlaps ASCII letters; the overall
// density decides, never an isolated byte.
function looksEbcdic(b){
  if (!b.length) return false;
  let high = 0, printable = 0, n = 0;
  for (let i = 0; i < b.length && n < 8192; i++, n++){
    const c = b[i];
    if (c >= 0x81) high++;
    else if ((c >= 0x20 && c <= 0x7E) || c === 0x09 || c === 0x0A || c === 0x0D) printable++;
  }
  return high > n * 0.3 && printable < n * 0.5;
}
function utf8Decode(b){
  let out = '';
  for (let i = 0; i < b.length; ){
    const c = b[i];
    if (c < 0x80){ out += String.fromCharCode(c); i++; continue; }
    if (c >= 0xC2 && c < 0xE0 && (b[i+1] & 0xC0) === 0x80){ out += String.fromCharCode(((c & 0x1F) << 6) | (b[i+1] & 0x3F)); i += 2; continue; }
    if (c >= 0xE0 && c < 0xF0 && (b[i+1] & 0xC0) === 0x80 && (b[i+2] & 0xC0) === 0x80){ out += String.fromCharCode(((c & 0x0F) << 12) | ((b[i+1] & 0x3F) << 6) | (b[i+2] & 0x3F)); i += 3; continue; }
    if (c >= 0xF0 && c < 0xF8 && (b[i+1] & 0xC0) === 0x80 && (b[i+2] & 0xC0) === 0x80 && (b[i+3] & 0xC0) === 0x80){ out += String.fromCodePoint(((c & 0x07) << 18) | ((b[i+1] & 0x3F) << 12) | ((b[i+2] & 0x3F) << 6) | (b[i+3] & 0x3F)); i += 4; continue; }
    out += '\uFFFD'; i++;
  }
  return out;
}
function utf16Decode(b, bigEndian){
  let out = '';
  for (let i = 2; i + 1 < b.length; i += 2)
    out += String.fromCharCode(bigEndian ? (b[i] << 8) | b[i+1] : (b[i+1] << 8) | b[i]);
  return out;
}
function decodeBytes(b){
  if (b.length >= 3 && b[0] === 0xEF && b[1] === 0xBB && b[2] === 0xBF)
    return { text: utf8Decode(b.subarray(3)), enc: 'utf-8 (BOM removed)' };
  if (b.length >= 2 && b[0] === 0xFF && b[1] === 0xFE)
    return { text: utf16Decode(b, false), enc: 'utf-16le (BOM)' };
  if (b.length >= 2 && b[0] === 0xFE && b[1] === 0xFF)
    return { text: utf16Decode(b, true), enc: 'utf-16be (BOM)' };
  if (looksEbcdic(b)){
    const r = ebcdicDecode(b);
    return { text: r.text, enc: 'EBCDIC CP037 (auto-detected' + (r.unmapped ? ', ' + r.unmapped + ' unmapped byte(s) shown as ?' : '') + ')' };
  }
  return { text: utf8Decode(b), enc: 'utf-8' };
}
async function readTextSmart(f){
  try {
    const buf = await f.arrayBuffer();
    return decodeBytes(new Uint8Array(buf));
  } catch(e){
    try { return { text: await f.text(), enc: 'utf-8 (fallback: arrayBuffer unavailable)' }; }
    catch(e2){ return { text: '', enc: 'unreadable' }; }
  }
}

// ── Impact diff between two versions of a system ──────────────────────────
// Compares the dependency MODELS (nodes + edges with evidence), never the
// file text. HONEST: no rename detection (a renamed dataset
// appears as removal + addition); two identical sets → zero
// delta; the evidence shown comes from the side where the edge appears.
function deltaDiff(filesA, filesB){
  const mA = buildModel(filesA), mB = buildModel(filesB);
  const ek = e => e.f + '\u0001' + e.t + '\u0001' + e.k;
  const eMap = m => { const h = new Map(); m.edges.forEach(e => h.set(ek(e), e)); return h; };
  const eA = eMap(mA), eB = eMap(mB);
  const edgesAdded = [], edgesRemoved = [];
  eB.forEach((e, k) => { if (!eA.has(k)) edgesAdded.push(e); });
  eA.forEach((e, k) => { if (!eB.has(k)) edgesRemoved.push(e); });
  const nodesAdded = [], nodesRemoved = [];
  mB.nodes.forEach((n, id) => { if (!mA.nodes.has(id)) nodesAdded.push(n); });
  mA.nodes.forEach((n, id) => { if (!mB.nodes.has(id)) nodesRemoved.push(n); });
  return { nodesAdded, nodesRemoved, edgesAdded, edgesRemoved,
    warnCounts: { a: mA.warnings.length, b: mB.warnings.length } };
}

function computeDelta(){
  const d = state.delta;
  if (!d || !d.a || !d.b || !d.a.length || !d.b.length){ if (d) d.res = null; return; }
  d.res = deltaDiff(d.a, d.b);
}

async function deltaFiles(side, fl){
  const arr = [...fl];
  if (!arr.length) return;
  if (!state.delta) state.delta = { a: null, b: null, res: null };
  const parsed = [];
  for (const f of arr){
    const rd = await readTextSmart(f);
    const t = rd.text;
    const nf = { name: f.name, lang: detectLang(f.name, t), text: t, lines: t.split('\n').length, sample: false, encoding: rd.enc };
    parseFile(nf);
    parsed.push(nf);
  }
  state.delta[side] = parsed;
  computeDelta();
  document.getElementById('statusText').textContent = 'Version diff ready';
  track('delta_files'); // telemetry: only the FACT of comparing — never names nor content
  renderContent();
}

// Version A = files already loaded in the analysis (cloned then re-parsed)
function deltaUseLoaded(){
  if (!state.files.length) return;
  if (!state.delta) state.delta = { a: null, b: null, res: null };
  state.delta.a = state.files.map(f => ({ name: f.name, lang: f.lang, text: f.text, lines: f.lines, sample: f.sample, encoding: f.encoding }));
  state.delta.a.forEach(f => parseFile(f));
  computeDelta();
  renderContent();
}

function deltaClear(side){
  if (!state.delta) return;
  state.delta[side] = null;
  computeDelta();
  renderContent();
}

async function handleFiles(fl){
  const arr = [...fl];
  if (!arr.length) return;
  for (const f of arr){
    const rd = await readTextSmart(f);
    let text = rd.text;
    if (isReforgeProject(f.name, text)){ await importProject(text); continue; }
    const lang = detectLang(f.name, text);
    const nf = { name:f.name, lang, text, lines:text.split('\n').length, sample:false, encoding: rd.enc };
    parseFile(nf);
    // replaces a same-named file
    const i = state.files.findIndex(x=>x.name===nf.name);
    if (i>=0) state.files[i] = nf; else state.files.push(nf);
  }
  renderLeft();
  saveSession();
  track('upload_files'); // telemetry: only the FACT of dropping files is counted — never names nor content
  if (state.loaded) renderContent();
}

function removeFile(i){
  state.files.splice(i,1);
  state._model = null;
  if (!state.files.length){ resetAll(); return; }
  if (state.srcFile && !state.files.some(f=>f.name===state.srcFile)) state.srcFile = state.files[0].name;
  renderLeft(); renderContent(); saveSession();
}

function clearAllFiles(){ resetAll(); }

function buildLog(){
  const L = []; const add = (cls,text)=>L.push({cls,text});
  add('info', `[parse] ${state.files.length} file(s) received — COBOL engine v3 (structure, variables, I/O, SQL), JCL engine v2 (statements, PROC, backrefs)`);
  state.files.forEach(f=>{
    const why = f.lang==='JCL' ? 'JCL statements (engine v2)' : f.lang==='CBL' ? 'PROGRAM-ID found' : f.lang==='CPY' ? 'record layout' : f.lang==='REXX' ? 'REXX exec (/* REXX */ or .REX/.EXEC)' : 'unknown format';
    add('ok', `[ok] ${f.name} → ${f.lang} (${why})${f.encoding && f.encoding !== 'utf-8' ? ' — decoded from ' + f.encoding : ''}`);
    (f.parsed.warnings||[]).forEach(w=>add('warn', `[v3] ${f.name}: ${w}`));
    if (f.lang==='REXX' && f.parsed.rexx){
      const R = f.parsed.rexx;
      add('info', `[v3] ${R.execName || f.name}: REXX exec — ${R.calls.length} CALL(s), ${R.dsns.length} dataset reference(s)`);
    }
    if (f.lang==='JCL' && f.parsed.procs && Object.keys(f.parsed.procs).length)
      add('info', `[v3] ${f.name}: PROC definition(s) available: ${Object.keys(f.parsed.procs).join(', ')}`);
    if (f.lang==='JCL' && f.parsed.jobs) f.parsed.jobs.forEach(jb=>{
      if (jb.steps.length)
        add('info', `[v3] ${jb.name}: ${jb.steps.length} step(s) resolved${(jb.procsUsed||[]).length ? ' · PROCs: ' + [...new Set(jb.procsUsed)].join(', ') : ''}`);
    });
    if (f.lang==='CBL' && f.parsed.cobol){
      const C = f.parsed.cobol;
      add('info', `[v3] ${C.programId || f.name}: ${C.paragraphs.length} paragraph(s), ${C.vars.length} data item(s), ${C.selects.length} SELECT, ${C.calls.length} CALL, ${C.sql.length} SQL block(s), ${C.copyUsed.length} COPY reference(s)`);
    }
  });
  const m = getModel();
  const byT = t=>[...m.nodes.values()].filter(n=>n.type===t).length;
  m.warnings.forEach(w=>add('warn', `[graph] ${w}`));
  add('info', `[done] ${byT('job')} job(s) · ${byT('prog')} program(s) · ${byT('cpy')} copybook(s) · ${byT('ds')} dataset(s) · ${byT('tbl')} DB2 table(s) — ${m.edges.length} relation(s), each with evidence and a confidence level`);
  state.log = L;
}

function svgMap(filter=''){
  const m = getModel();
  const all = [...m.nodes.values()];
  const cols = [
    {x:40,  w:160, type:'JOB',      c:'var(--cyan)',    items:all.filter(n=>n.type==='job').map(n=>({id:n.id, label:n.name}))},
    {x:230, w:160, type:'PROGRAM',  c:'var(--accent)',  items:all.filter(n=>n.type==='prog'||n.type==='xpgm').map(n=>({id:n.id, label:n.name + (n.type==='xpgm'?' *':'')}))},
    {x:420, w:160, type:'COPYBOOK', c:'var(--yellow)',  items:all.filter(n=>n.type==='cpy').map(n=>({id:n.id, label:n.name}))},
    {x:610, w:170, type:'DATASET',  c:'var(--green)',   items:all.filter(n=>n.type==='ds').map(n=>({id:n.id, label:n.name + (n.data.temp?' (temp)':'')}))},
    {x:810, w:170, type:'DB2 TABLE',c:'var(--red)',     items:all.filter(n=>n.type==='tbl').map(n=>({id:n.id, label:n.name}))},
    {x:1010, w:170, type:'CICS',    c:'var(--yellow)',  items:all.filter(n=>n.type==='fct'||n.type==='map'||n.type==='q')
      .map(n=>({id:n.id, label:n.name + (n.type==='fct'?' (FCT)':n.type==='q'?' (queue)':' (map)')}))},
  ];
  const nodes = []; const idx = {};
  cols.forEach(col=>col.items.forEach((it,i)=>{
    idx[it.id] = nodes.length;
    nodes.push({ label: it.label, type:col.type, c:col.c, x:col.x, y:18+i*70, w:col.w });
  }));
  const maxN = Math.max(1, ...cols.map(c=>c.items.length));
  const height = 18 + (maxN-1)*70 + 44 + 16;
  const width = 1010 + 170 + 40;
  const fl = (filter||'').toLowerCase();
  const idLabel = id => { const n = nodes[idx[id]]; return n ? n.label : ''; };
  // ORIGINAL indices (not those of the filtered array) — otherwise the CBPAY/PAYROLL filter
  // hid matching entities (real bug reported by a user)
  const vis = new Set(nodes.map((n,i)=>n.label.toLowerCase().includes(fl)?i:-1).filter(i=>i>=0));
  // top-level projection: step→X becomes job→X (steps are not drawn)
  const proj = new Set();
  for (const e of m.edges){
    let f = e.f, t = e.t;
    if (f.startsWith('step|')){
      if (t.startsWith('step|')) continue; // contains : interne
      f = 'job|' + f.split('|')[1].split('.')[0];
    }
    proj.add(f + '>' + t);
  }
  const edges = [...proj].map(k=>{ const [f,t] = k.split('>'); return {f,t}; })
    .filter(e=>idx[e.f]!=null && idx[e.t]!=null && vis.has(idx[e.f]) && vis.has(idx[e.t]))
    .map(e=>{
      const A = nodes[idx[e.f]], B = nodes[idx[e.t]];
      return `<path class="edge" marker-end="url(#arrow)" d="M ${A.x+A.w} ${A.y+22} C ${A.x+A.w+45} ${A.y+22}, ${B.x-45} ${B.y+22}, ${B.x} ${B.y+22}"/>`;
    }).join('');
  const nn = nodes.map((n,i)=>vis.has(i)?`
    <g class="node" transform="translate(${n.x},${n.y})">
      <rect width="${n.w}" height="44" fill="var(--bg3)" stroke="${n.c}"/>
      <text x="10" y="19">${esc(n.label.length>18?n.label.slice(0,17)+'…':n.label)}</text>
      <text class="ntype" x="10" y="34">${n.type}</text>
    </g>`:'').join('');
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" style="display:block">
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--border2)"/></marker></defs>
    ${edges}${nn}</svg><p class="note" style="margin-top:6px">* = external program (not uploaded). Jobs link to programs and datasets through their steps; every relation shown was detected — nothing inferred.</p>`;
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function hl(text){
  const re = /\b(IDENTIFICATION DIVISION|PROCEDURE DIVISION|WORKING-STORAGE|FILE SECTION|PROGRAM-ID|END-PERFORM|END-EXEC|END-IF|GO TO|STOP RUN|PERFORM|COMPUTE|ROUNDED|UNTIL|EXEC SQL|SELECT|ASSIGN|DISPLAY|MOVE|COPY|READ|OPEN|CLOSE|PIC|ADD|END|JOB|EXEC|PGM|DSN|DD)\b/g;
  return esc(text).replace(re, m=>`<span class="k">${m}</span>`);
}
function firstLines(text, n){
  const l = text.split('\n');
  return (l.length>n ? l.slice(0,n).join('\n') + `\n… (${l.length} lines total)` : l.join('\n'));
}

// ── AI engine (opt-in): deterministic-first pipeline, grounded, never simulated ──
// 1. CONTEXT: deterministic extract — entity, evidence (file+line+note),
//    direct upstream/downstream neighbors with confidence, unknown areas/warnings. Facts only.
// 2. GUARDRAIL: the prompt requires answering ONLY from the context, citing
//    the evidence, stating "unknown" otherwise — never invent names/dependencies.
// 3. KEY/ENDPOINT: local sessionStorage, never in the prompt nor the telemetry.
// 4. CALL: only if configured; otherwise offline deterministic mode.
// 5. DISPLAY: any AI response is labeled "AI-proposed", never merged
//    with the deterministic output.
function aiCfg(){
  try { return { url: (sessionStorage.getItem('reforge_ai_url') || '').trim(),
    model: (sessionStorage.getItem('reforge_ai_model') || '').trim(), key: getKey() || '' }; }
  catch(e){ return { url: '', model: '', key: '' }; }
}
function aiReady(){ const c = aiCfg(); return !!(c.url && c.key); }
function aiSaveCfg(){
  try {
    const u = document.getElementById('aiUrlInput'), mo = document.getElementById('aiModelInput');
    if (u && u.value.trim()) sessionStorage.setItem('reforge_ai_url', u.value.trim()); else sessionStorage.removeItem('reforge_ai_url');
    if (mo && mo.value.trim()) sessionStorage.setItem('reforge_ai_model', mo.value.trim()); else sessionStorage.removeItem('reforge_ai_model');
  } catch(e){}
  renderContent();
}
function buildAiContext(m, id){
  const n = m && m.nodes && m.nodes.get ? m.nodes.get(id) : null;
  if (!n) return null;
  const imp = impact(m, id);
  const evOf = e => (e.ev || []).slice(0, 3).map(x => (x.file || '?') + (x.ln != null ? ' L' + x.ln : '') + ' — ' + x.note);
  return {
    entity: { id: n.id, type: n.type, name: n.name, data: n.data || {} },
    upstream: (imp.up.direct || []).slice(0, 8).map(r => ({ id: r.id, conf: r.conf, evidence: evOf(r.edge) })),
    downstream: (imp.down.direct || []).slice(0, 8).map(r => ({ id: r.id, conf: r.conf, evidence: evOf(r.edge) })),
    modelCoverage: { nodes: m.nodes.size, edges: m.edges.length,
      unknowns: (m.warnings || []).slice(0, 12) }
  };
}
function buildAiPrompt(ctx){
  return {
    system: 'You are a mainframe (JCL/COBOL) code analyst. Answer ONLY from the provided context. Cite the evidence lines you use (file + line + note). If something is not in the context, state explicitly that it is unknown — never invent program names, datasets, tables, JCL steps or dependencies. Respect the confidence labels (certain/probable/unknown). Your output is a PROPOSAL for a human analyst, not ground truth.',
    user: 'Analyze this entity extracted by a deterministic analysis engine (facts + evidence only; nothing else is known):\n\n' + JSON.stringify(ctx, null, 1)
  };
}
async function aiExplain(id){
  const c = aiCfg();
  if (!c.url || !c.key) return { source: 'deterministic', reason: 'AI endpoint/key not configured — offline deterministic mode' };
  const m = getModel();
  const ctx = buildAiContext(m, id || state.entity);
  if (!ctx) return { source: 'deterministic', reason: 'entity not found' };
  const p = buildAiPrompt(ctx);
  let res;
  try {
    res = await window.fetch(c.url, { method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + c.key },
      body: JSON.stringify({ model: c.model || 'default', temperature: 0,
        messages: [{ role: 'system', content: p.system }, { role: 'user', content: p.user }] }) });
  } catch(e){ return { source: 'deterministic', reason: 'API unreachable: ' + e.message }; }
  if (!res || !res.ok) return { source: 'deterministic', reason: 'API HTTP ' + (res ? res.status : 'error') };
  let j = null;
  try { j = await res.json(); } catch(e){}
  const txt = j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
  if (!txt) return { source: 'deterministic', reason: 'unexpected API response shape' };
  return { source: 'ai', model: c.model || 'default', text: txt, context: ctx };
}
function aiBannerHtml(source, extra){
  return source === 'ai'
    ? `<p class="note" style="color:var(--yellow)">✦ <b>AI-PROPOSED</b> — generated by ${esc(extra || 'the configured model')} from cited evidence. Verify before use: this is a proposal, never ground truth. Deterministic facts remain in the other views.</p>`
    : `<p class="note" style="color:var(--green)">⚙ Deterministic mode (offline) — ${esc(extra || 'AI not configured')}. No AI output is shown because none is produced.</p>`;
}

// ── Ask the graph: deterministic Q&A, fully offline, no LLM ──
// The question is parsed by keyword patterns; the target entity is matched
// LITERALLY against model node names (nothing guessed); every answer line is
// derived from one real edge with its confidence and file:line evidence.
// Unknown entity, ambiguous match or unsupported question → explicit honest
// refusal. This is NOT a free-form chat: the supported question types are
// listed in the refusal message.
function aiFindEntity(q){
  const m = getModel();
  const ql = String(q || '').toLowerCase();
  const hits = [];
  m.nodes.forEach(n => {
    const nm = String(n.name || '').toLowerCase();
    if (nm.length >= 3 && ql.includes(nm)) hits.push(n);
  });
  return hits;
}
function aiAsk(q){
  if (!state.loaded) return { ok: false, reason: 'no analysis loaded — run the analysis first' };
  const m = getModel();
  const ql = String(q || '').toLowerCase().trim();
  if (!ql) return { ok: false, reason: 'empty question' };
  const hits = aiFindEntity(q);
  if (!hits.length)
    return { ok: false, reason: 'no entity of this analysis matches the question — names are matched literally from the loaded files, nothing is guessed' };
  let n = hits[0];
  if (hits.length > 1){
    const exact = hits.find(x => ql.includes(String(x.id).toLowerCase()));
    if (!exact)
      return { ok: false, ambiguous: hits.map(x => x.id), reason: 'several entities match — specify which one (a name or type|name)' };
    n = exact;
  }
  const isIo   = /(who|what|which)\b/.test(ql) && /(read|write|writes|reads|written|updated?|updated by)/.test(ql);
  const isHist = /(what (has )?chang|diff|history|evolution|since (version|v\d|the )?)/.test(ql);
  const isImp  = /(impact|break|if i (modify|change|delete|touch))/.test(ql);
  const isLin  = /(lineage|origin|where does .* come from|where is .* from|trace)/.test(ql);
  const isUse  = /(who|what) (calls|uses|runs)|\b(calls|uses) \b/.test(ql);
  const intent = isIo ? 'io' : isHist ? 'history' : isImp ? 'impact' : isLin ? 'lineage' : isUse ? 'uses' : null;
  if (!intent)
    return { ok: false, reason: 'unsupported question — I can answer, offline and from the graph only: who reads/writes a dataset · who calls/uses an entity · impact of modifying an entity · lineage of a dataset · what changed between versions' };
  const fmtEv = e => (e.ev && e.ev[0]) ? ((e.ev[0].file || '?') + (e.ev[0].ln != null ? ':' + e.ev[0].ln : '')) : null;
  if (intent === 'history'){
    const H = state.history;
    if (H.length < 2)
      return { ok: true, intent, entity: n.id, lines: [{ text: 'Only ' + H.length + ' snapshot(s) recorded — no evolution to report yet.', c: 'certain' }] };
    const a = H[H.length - 2], b = H[H.length - 1];
    const d = graphDiff(a, b);
    const lines = [];
    d.nodesAdded.forEach(x => lines.push({ text: '+ entity ' + x.id, c: 'certain' }));
    d.nodesRemoved.forEach(x => lines.push({ text: '− entity ' + x.id, c: 'certain' }));
    d.edgesAdded.forEach(k => lines.push({ text: '+ relation ' + k.split('|').slice(0, -1).join(' —') + '→ (' + k.split('|').pop() + ')', c: 'certain' }));
    d.edgesRemoved.forEach(k => lines.push({ text: '− relation ' + k.split('|').slice(0, -1).join(' —') + '→ (' + k.split('|').pop() + ')', c: 'certain' }));
    if (d.filesChanged.length) lines.push({ text: 'files changed: ' + d.filesChanged.join(', '), c: 'certain' });
    if (!lines.length) lines.push({ text: 'No model change between ' + a.label + ' and ' + b.label + '.', c: 'certain' });
    return { ok: true, intent, entity: n.id, lines, note: 'last two snapshots compared (' + a.label + ' → ' + b.label + ')' };
  }
  const outE = m.fwd[n.id] || [], inE = m.rev[n.id] || [];
  const lines = [];
  if (intent === 'io'){
    const io = [...outE, ...inE].filter(e => e.k === 'read' || e.k === 'write');
    io.forEach(e => {
      const isOut = outE.includes(e);
      const other = isOut ? e.t : e.f;
      lines.push({ text: (isOut ? (e.k === 'write' ? 'writes to ' : 'reads from ') : (e.k === 'write' ? 'is written by ' : 'is read by ')) + other, c: e.c, ev: fmtEv(e) });
    });
    if (!lines.length) lines.push({ text: 'No direct I/O relation found for this entity in the graph.', c: 'unknown' });
  } else if (intent === 'uses'){
    inE.forEach(e => lines.push({ text: 'used by ' + e.f + ' (' + e.k + ')', c: e.c, ev: fmtEv(e) }));
    if (!lines.length) lines.push({ text: 'No incoming usage relation found — nothing in this analysis references it.', c: 'unknown' });
  } else { // impact / lineage — one hop each direction, honestly stated
    inE.forEach(e => lines.push({ text: 'upstream: ' + e.f + ' (' + e.k + ')', c: e.c, ev: fmtEv(e) }));
    outE.forEach(e => lines.push({ text: 'downstream: ' + e.t + ' (' + e.k + ')', c: e.c, ev: fmtEv(e) }));
    if (!lines.length) lines.push({ text: 'No relation found for this entity — it is isolated in the current analysis.', c: 'unknown' });
    if (intent === 'impact') lines.push({ text: 'One hop only — transitive impact is not expanded here; use the Impact view for the full walk.', c: 'certain' });
  }
  return { ok: true, intent, entity: n.id, lines };
}
function aiAskRun(){
  const inp = document.getElementById('aiQInput');
  const out = document.getElementById('aiQOut');
  if (!inp || !out) return;
  const q = inp.value || '';
  const r = aiAsk(q);
  const confColor = { certain: 'var(--green)', probable: 'var(--yellow)', unknown: 'var(--text3)' };
  let body;
  if (!r.ok){
    const amb = r.ambiguous ? `<p>${r.ambiguous.map(a => `<span class="mono pill" style="border:1px solid var(--text3)">${esc(a)}</span>`).join(' ')}</p>` : '';
    body = `<p class="note" style="color:var(--yellow)">⚠ ${esc(r.reason)}</p>${amb}`;
  } else {
    const lines = r.lines.map(l =>
      `<div class="log"><span style="color:${confColor[l.c] || confColor.unknown};font-weight:bold">${esc(l.c)}</span> ${esc(l.text)}${l.ev ? ` <span class="note">(${esc(l.ev)})</span>` : ''}</div>`).join('');
    body = `<p class="note" style="color:var(--green)">⚙ Deterministic answer — derived only from graph edges of <span class="mono">${esc(r.entity)}</span>${r.note ? ' · ' + esc(r.note) : ''}</p>${lines}`;
  }
  out.innerHTML = body;
  track('ai_ask');
}
async function aiRun(){

// ══════════════════ 5c. PERSISTANCE LOCALE (IndexedDB) + PROJET ══════════════════
// Files and analysis are stored in the browser (IndexedDB),
// never sent. In-memory fallback if storage is blocked (private mode).
// Export/import: portable .json file containing only the source texts
// (re-parsed at import — robust to engine evolutions).

const SESSION_VER = 3;
const _idbName = 'reforge-db', _idbStore = 'session';
let _idb = null, _memSession = null;

function idbOpen(){
  return new Promise((res, rej) => {
    if (_idb) return res(_idb);
    try {
      const req = indexedDB.open(_idbName, 1);
      req.onupgradeneeded = () => { try { req.result.createObjectStore(_idbStore); } catch(e){} };
      req.onsuccess = () => { _idb = req.result; res(_idb); };
      req.onerror = () => rej(req.error || new Error('IndexedDB unavailable'));
    } catch(e){ rej(e); }
  });
}

async function saveSession(){
  const data = { v: SESSION_VER, ts: Date.now(), files: state.files, log: state.log, loaded: state.loaded, history: state.history };
  try {
    const db = await idbOpen();
    await new Promise((res, rej) => {
      const tx = db.transaction(_idbStore, 'readwrite');
      tx.objectStore(_idbStore).put(data, 'current');
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
    // ask the browser not to evict the data under disk pressure
    if (navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch(e){} }
  } catch(e){
    _memSession = data; // private mode / blocked storage → session memory (not persisted)
    if (e && (e.name === 'QuotaExceededError' || /quota/i.test(String((e && e.message) || ''))))
      document.getElementById('statusText').textContent = '⚠ Local storage FULL — this session is kept in memory only and will NOT survive a reload. Export the project (.json) to keep it.';
  }
}

async function loadSession(){
  try {
    const db = await idbOpen();
    return await new Promise((res, rej) => {
      const rq = db.transaction(_idbStore, 'readonly').objectStore(_idbStore).get('current');
      rq.onsuccess = () => res(rq.result || null);
      rq.onerror = () => rej(rq.error);
    });
  } catch(e){ return _memSession; }
}

async function clearSession(){
  _memSession = null;
  try {
    const db = await idbOpen();
    await new Promise((res, rej) => {
      const tx = db.transaction(_idbStore, 'readwrite');
      tx.objectStore(_idbStore).delete('current');
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  } catch(e){}
}

// ── Export of analysis RESULTS (≠ project export: here we output what
// the analysis FOUND — nodes, relations, evidence, points of attention).
// A critical tool must let the data leave fast: JSON (machine),
// CSV (spreadsheet), Markdown (readable report). 100% local, no upload. ──
function resultsPayload(){
  const m = getModel();
  const byT = t => [...m.nodes.values()].filter(n=>n.type===t);
  return {
    app: 'reforge', v: SESSION_VER, exported: new Date().toISOString(),
    overview: {
      jobs: byT('job').length, steps: byT('step').length, programs: byT('prog').length,
      copybooks: byT('cpy').length, datasets: byT('ds').length, db2_tables: byT('tbl').length,
      cics_files: byT('fct').length, cics_maps: byT('map').length, cics_queues: byT('q').length,
      relations: m.edges.length,
      certain: m.edges.filter(e=>e.c==='certain').length,
      probable: m.edges.filter(e=>e.c==='probable').length,
      unknown: m.edges.filter(e=>e.c==='unknown').length
    },
    nodes: [...m.nodes.values()].map(n => ({ id: n.id, type: n.type, name: n.name, data: n.data || {} })),
    edges: m.edges.map(e => ({ from: e.f, to: e.t, relation: e.k, confidence: e.c,
      evidence: (e.ev||[]).map(x => ({ file: x.file || null, line: x.ln || null, note: x.note || '' })) })),
    warnings: m.warnings || [],
    files: state.files.map(f => ({ name: f.name, lang: f.lang, lines: (f.text || '').split('\n').length, parsed: !!f.parsed }))
  };
}

// CSV cell: doubled quotes + protection against spreadsheet
// formula injection (a DSN "=cmd(...)" must never execute in Excel).
function csvCell(v){
  v = String(v == null ? '' : v);
  if (/^[=+\-@]/.test(v)) v = "'" + v;
  return '"' + v.replace(/"/g,'""') + '"';
}
function resultsCSV(){
  const rows = [['From','To','Relation','Confidence','Evidence']];
  getModel().edges.forEach(e => {
    const ev = (e.ev||[]).map(x => (x.file||'?') + (x.ln ? ':' + x.ln : '') + (x.note ? ' — ' + x.note : '')).join(' | ');
    rows.push([e.f, e.t, e.k, e.c, ev]);
  });
  return rows.map(r => r.map(csvCell).join(',')).join('\r\n') + '\r\n';
}

function resultsMD(){
  const m = getModel();
  const byT = t => [...m.nodes.values()].filter(n=>n.type===t);
  const nm = id => { const n = m.nodes.get(id); return n ? n.name : id; };
  const evs = e => (e.ev||[]).map(x => (x.file||'?') + (x.ln ? ':' + x.ln : '') + (x.note ? ' — ' + x.note : '')).join(' ; ').replace(/\|/g,'/');
  const L = [];
  L.push('# Reforge analysis report');
  L.push('');
  L.push('_Generated ' + new Date().toISOString() + '. Every relation carries its evidence (file:line) and a confidence level: certain / probable / unknown. Nothing is invented._');
  L.push('');
  L.push('## Overview');
  L.push('- Jobs: ' + byT('job').length + ' · steps: ' + byT('step').length + ' · programs: ' + byT('prog').length + ' · copybooks: ' + byT('cpy').length);
  L.push('- Datasets: ' + byT('ds').length + ' · DB2 tables: ' + byT('tbl').length + ' · CICS files/maps/queues: ' + (byT('fct').length + byT('map').length + byT('q').length));
  L.push('- Relations: ' + m.edges.length + ' (certain: ' + m.edges.filter(e=>e.c==='certain').length + ', probable: ' + m.edges.filter(e=>e.c==='probable').length + ', unknown: ' + m.edges.filter(e=>e.c==='unknown').length + ')');
  L.push('');
  L.push('## Jobs & steps');
  byT('job').forEach(j => {
    L.push('### ' + j.name);
    m.edges.filter(e => e.f === j.id && e.k === 'contains').forEach(e => {
      const s = m.nodes.get(e.t); if (!s) return;
      const exec = m.edges.find(x => x.f === s.id && x.k === 'exec');
      const dss = m.edges.filter(x => x.f === s.id && ['read','write','update','delete','unknown'].includes(x.k));
      L.push('- **' + s.name + '** → ' + (exec ? nm(exec.t) : 'no program detected')
        + (dss.length ? ' ; data: ' + dss.map(x => x.k + ' ' + nm(x.t) + ' (' + x.c + ')').join(', ') : ''));
    });
  });
  L.push('');
  L.push('## Programs');
  byT('prog').forEach(p => {
    const uses = m.edges.filter(e => e.f === p.id && e.k === 'uses');
    const sql = m.edges.filter(e => e.f === p.id && String(e.k).startsWith('sql-'));
    const calls = m.edges.filter(e => e.f === p.id && e.k === 'call');
    const paras = m.edges.filter(e => e.f === p.id && e.k === 'contains' && e.t.startsWith('para|'));
    const dcount = paras.filter(e => { const pn = m.nodes.get(e.t); return pn && pn.data && pn.data.dead; }).length;
    L.push('- **' + p.name + '** : ' + paras.length + ' paragraph(s), ' + uses.length + ' copybook(s), ' + sql.length + ' SQL table access(es), ' + calls.length + ' call(s)' + (dcount ? ' — ⚠ ' + dcount + ' unreachable paragraph(s)' : ''));
  });
  L.push('');
  L.push('## Datasets');
  byT('ds').forEach(d => {
    const rel = m.edges.filter(e => e.t === d.id && ['read','write','update','delete','unknown'].includes(e.k));
    L.push('- **' + d.name + '**' + (d.data && d.data.temp ? ' (temporary)' : '') + ' : ' + (rel.map(x => x.k + ' by ' + nm(x.f) + ' (' + x.c + ')').join(', ') || 'no usage detected'));
  });
  L.push('');
  const fcts = byT('fct'), maps = byT('map'), qs = byT('q');
  if (fcts.length || maps.length || qs.length){
    L.push('## CICS resources');
    fcts.forEach(d => L.push('- CICS file **' + d.name + '** (FCT entry, dataset unknown) : ' + m.edges.filter(e=>e.t===d.id).map(x => x.k + ' by ' + nm(x.f)).join(', ')));
    maps.forEach(d => L.push('- CICS map **' + d.name + '** : used by ' + m.edges.filter(e=>e.t===d.id).map(x => nm(x.f)).join(', ')));
    qs.forEach(d => L.push('- CICS queue **' + d.name + '**: ' + m.edges.filter(e=>e.t===d.id).map(x => x.k + ' by ' + nm(x.f)).join(', ')));
    L.push('');
  }
  L.push('## Points of attention');
  if (!(m.warnings||[]).length) L.push('- None detected.');
  else (m.warnings||[]).forEach(w => L.push('- ' + w));
  L.push('');
  L.push('## All relations (' + m.edges.length + ')');
  L.push('| From | To | Relation | Confidence | Evidence |');
  L.push('|---|---|---|---|---|');
  m.edges.forEach(e => L.push('| ' + nm(e.f) + ' | ' + nm(e.t) + ' | ' + e.k + ' | ' + e.c + ' | ' + (evs(e) || '-') + ' |'));
  L.push('');
  return L.join('\n');
}

// Express read for non-specialists: generated from the detected relations
// only (no hardcoded sentences). This is the "5 minutes" card that a
// non-expert manager can read before asking his questions.
function summaryStoryHTML(){
  const m = getModel();
  const byT = t => [...m.nodes.values()].filter(n=>n.type===t);
  const nm = id => { const n = m.nodes.get(id); return n ? n.name : id; };
  const escList = a => a.length ? a.map(x => '<b class="mono">' + esc(nm(x)) + '</b>').join(', ') : '<i>none</i>';
  const jobLines = byT('job').slice(0, 4).map(j => {
    const steps = m.edges.filter(e => e.f === j.id && e.k === 'contains').map(e => m.nodes.get(e.t)).filter(Boolean);
    const chain = steps.map(s => {
      const exec = m.edges.find(x => x.f === s.id && x.k === 'exec');
      return esc(String(s.name).split('.').slice(1).join('.') || s.name) + ' → ' + (exec ? esc(nm(exec.t)) : '<i>no program</i>');
    }).join(' · ') || '<i>no step detected</i>';
    return '<li><span class="mono" style="color:var(--text)">' + esc(j.name) + '</span> : ' + chain + '</li>';
  }).join('');
  const dsLines = byT('ds').slice(0, 8).map(d => {
    const reads = m.edges.filter(e => e.t === d.id && e.k === 'read').map(e => e.f);
    const wr = m.edges.filter(e => e.t === d.id && ['write','update'].includes(e.k)).map(e => e.f + ' (' + e.c + ')');
    return '<li><span class="mono">' + esc(d.name) + (d.data && d.data.temp ? ' <i>(temp)</i>' : '') + '</span> — read: ' + (reads.length ? escList(reads) : '<i>nobody detected</i>') + ' · written: ' + (wr.length ? escList(wr) : '<i>nobody detected</i>') + '</li>';
  }).join('');
  const cpy = byT('cpy')[0];
  let scen = '<i>No copybook in this project.</i>';
  if (cpy){
    const imp = impact(m, cpy.id);
    const progs = imp.up.direct.filter(x => x.id.startsWith('prog|')).map(x => nm(x.id) + ' (' + x.conf + ')');
    const jobs = imp.up.indirect.filter(x => x.id.startsWith('job|')).map(x => nm(x.id));
    scen = 'changing <span class="mono">' + esc(cpy.name) + '</span> affects ' + escList(progs)
      + (jobs.length ? ' — and job(s) ' + escList(jobs) : '')
      + '. <b>Question for the developer:</b> "if this layout changes, which programs and jobs need regression tests, and which tests do you plan?"';
  }
  const warns = (m.warnings || []).slice(0, 6);
  const warnLines = warns.length ? warns.map(w => '<li>' + esc(w) + '</li>').join('') : '<li><span class="ok">✓ No warning detected — every relation is confirmed.</span></li>';
  return `<div class="card" style="max-width:760px"><h3>⏱ First 5 minutes — plain-language read</h3>
    <p class="note" style="font-size:13px;line-height:1.6;color:var(--text2)">What a non-specialist can see immediately — generated from the detected relations only, evidence and confidence included.</p>
    <p class="note" style="line-height:1.9"><b>1. The jobs:</b></p><ul class="note" style="line-height:1.8">${jobLines || '<li><i>none</i></li>'}</ul>
    <p class="note" style="line-height:1.9"><b>2. The data:</b></p><ul class="note" style="line-height:1.8">${dsLines || '<li><i>none</i></li>'}</ul>
    <p class="note" style="line-height:1.9"><b>3. Change scenario:</b> ${scen}</p>
    <p class="note" style="line-height:1.9"><b>4. Points to ask about:</b></p><ul class="note" style="line-height:1.8">${warnLines}</ul>
  </div>`;
}

function downloadResults(fmt){

  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  track('export_results_' + fmt);
}

function isReforgeProject(name, text){
  return /\.json$/i.test(name) && /"app"\s*:\s*"reforge"/.test((text || '').slice(0, 500));
}

async function importProject(text){
  let data;
  try { data = JSON.parse(text); } catch(e){ return false; }
  if (!data || data.app !== 'reforge' || !Array.isArray(data.files)) return false;
  state.files = [];
  for (const f of data.files){
    const t = f.text || '';
    const nf = { name: f.name, lang: detectLang(f.name, t), text: t, lines: t.split('\n').length, sample: !!f.sample };
    parseFile(nf);
    state.files.push(nf);
  }
  state.loaded = true;
  state.entity = null; state.srcFile = null; state.pySel = null;
  state.group = 'explore'; state.sub = 'map';
  document.getElementById('statusText').textContent = 'Project imported';
  buildLog();
  saveSession();
  renderLeft(); renderNav(); renderContent();
  track('import_project');
  return true;
}

// ── Lightweight telemetry (GA usage counters, never file names) ──
function track(name){
  // ⛔ Reversible telemetry: even if gtag.js is already loaded, the persistent
  // opt-out (localStorage 'reforge_telemetry' = '0') blocks EVERY event.
  try { if (telemetryOn() && typeof window.gtag === 'function') window.gtag('event', name); } catch(e){}
}

        : '<p class="note">No EXEC step found in this job.</p>'}
        ${j.parsed.dsns.length ? `<p class="note">DD datasets: ${j.parsed.dsns.map(esc).join(' · ')}</p>` : ''}
      </div>`).join('');
    const progCards = Object.entries(m.internal).map(([pname,inn])=>`

<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reforge — Redesign Concept</title>
<style>
  :root{
    --bg:#080b14; --bg2:#0d1120; --bg3:#141828; --bg4:#1a2035;
    --border:#1e2540; --border2:#28304e;
    --text:#e2e6f3; --text2:#8892b0; --text3:#4a5270;
    --accent:#4f8fff; --accent2:#2563eb; --purple:#8b5cf6; --cyan:#22d3ee;
    --green:#34d399; --yellow:#fbbf24; --red:#f87171;
    --grad:linear-gradient(135deg,#4f8fff,#8b5cf6);
  }
  body.light{
    --bg:#f0f2f9; --bg2:#fff; --bg3:#e8eaf5; --bg4:#dde0f0;
    --border:#d0d5ea; --border2:#b8bdda;
    --text:#0e1120; --text2:#3d456a; --text3:#8890aa;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
    background:var(--bg); color:var(--text);
    height:100vh; display:flex; flex-direction:column; overflow:hidden;
    font-size:14px; -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:ui-monospace,'Cascadia Code',Menlo,Consolas,monospace}

  /* ── HEADER ── */
  header{
    display:flex; align-items:center; gap:12px; padding:0 20px; height:54px;
    background:var(--bg2); border-bottom:1px solid var(--border);
    flex-shrink:0; position:relative; z-index:10;
  }
  header::after{content:''; position:absolute; bottom:0; left:0; right:0; height:1px; background:var(--grad); opacity:.5}
  .logo{font-family:ui-monospace,Menlo,monospace; font-size:17px; font-weight:700; background:var(--grad); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text}
  .logo span{opacity:.55; font-weight:400}
  .header-tag{font-family:ui-monospace,Menlo,monospace; font-size:11px; color:var(--text2); border:1px solid var(--border2); border-radius:4px; padding:2px 8px}
  .badge-concept{font-family:ui-monospace,Menlo,monospace; font-size:10px; color:var(--purple); border:1px dashed var(--purple); border-radius:4px; padding:2px 8px; letter-spacing:1px}
  .header-spacer{flex:1}
  .status{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text2)}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 6px var(--green)}
  .header-link{color:var(--text2); font-size:12px; text-decoration:none}
  .header-link:hover{color:var(--accent)}
  .theme-btn{background:var(--bg3); color:var(--text); border:1px solid var(--border2); border-radius:6px; padding:5px 10px; cursor:pointer; font-size:13px}

  /* ── WORKSPACE ── */
  .workspace{flex:1; display:grid; grid-template-columns:270px 1fr; min-height:0}

  /* Left panel */
  .left{background:var(--bg2); border-right:1px solid var(--border); padding:14px; display:flex; flex-direction:column; gap:12px; overflow-y:auto}
  .panel-h{font-family:ui-monospace,Menlo,monospace; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--text3)}
  .dropzone{
    border:1.5px dashed var(--border2); border-radius:10px; padding:18px 12px;
    text-align:center; color:var(--text2); transition:.15s; cursor:pointer; font-size:13px;
  }
  .dropzone:hover,.dropzone.hover{border-color:var(--accent); color:var(--text); background:rgba(79,143,255,.05)}
  .dropzone .icon{font-size:22px; display:block; margin-bottom:6px}
  .browse{color:var(--accent); text-decoration:underline}
  .sample-btn{
    width:100%; padding:10px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600;
    color:#fff; background:var(--grad); border:none; transition:.15s;
  }
  .sample-btn:hover{filter:brightness(1.12)}
  .analyze-btn{
    width:100%; padding:9px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600;
    background:var(--bg3); color:var(--text); border:1px solid var(--border2); transition:.15s;
  }
  .analyze-btn:hover:not(:disabled){border-color:var(--accent)}
  .analyze-btn:disabled{opacity:.4; cursor:not-allowed}
  .file-list{display:flex; flex-direction:column; gap:6px}
  .file{display:flex; align-items:center; gap:8px; background:var(--bg3); border:1px solid var(--border); border-radius:7px; padding:7px 9px; font-size:12px}
  .file .ficon{flex-shrink:0}
  .file .fname{font-family:ui-monospace,Menlo,monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0}
  .lang{font-family:ui-monospace,Menlo,monospace; font-size:9px; font-weight:700; border-radius:3px; padding:2px 5px; flex-shrink:0}
  .lang-jcl{color:var(--cyan); border:1px solid var(--cyan)}
  .lang-cbl{color:var(--accent); border:1px solid var(--accent)}
  .lang-cpy{color:var(--yellow); border:1px solid var(--yellow)}
  .lang-txt{color:var(--text2); border:1px solid var(--border2)}
  .rm{background:none; border:none; color:var(--text3); cursor:pointer; font-size:15px; line-height:1; padding:0 4px; border-radius:4px; flex-shrink:0}
  .rm:hover{color:var(--red); background:rgba(248,113,113,.12)}
  .clear-btn{background:none; border:none; color:var(--text3); font-size:11px; cursor:pointer; text-align:left; padding:0; text-decoration:underline}
  .clear-btn:hover{color:var(--red)}
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .stat{background:var(--bg3); border:1px solid var(--border); border-radius:8px; padding:8px 10px}
  .stat b{display:block; font-size:18px; font-family:ui-monospace,Menlo,monospace}
  .stat span{font-size:11px; color:var(--text2)}

  /* Right panel */
  .right{display:flex; flex-direction:column; min-width:0; min-height:0}
  .groups{display:flex; gap:6px; padding:10px 16px 0; border-bottom:1px solid var(--border); background:var(--bg2)}
  .group{
    padding:8px 16px; font-size:13px; font-weight:600; color:var(--text2); cursor:pointer;
    border:1px solid transparent; border-bottom:none; border-radius:8px 8px 0 0; position:relative; top:1px;
    display:flex; align-items:center; gap:7px;
  }
  .group:hover{color:var(--text)}
  .group.active{color:var(--text); background:var(--bg); border-color:var(--border)}
  .group.active .g-icon{opacity:1}
  .g-icon{font-size:13px; opacity:.7}
  .subtabs{display:flex; gap:2px; padding:9px 16px; background:var(--bg); border-bottom:1px solid var(--border); flex-wrap:wrap}
  .subtab{padding:6px 13px; font-size:12.5px; color:var(--text2); cursor:pointer; border-radius:6px; border:1px solid transparent}
  .subtab:hover{color:var(--text); background:var(--bg3)}
  .subtab.active{color:var(--accent); background:rgba(79,143,255,.08); border-color:rgba(79,143,255,.3); font-weight:600}
  .subtab.hot{color:var(--purple)}
  .content{flex:1; overflow:auto; padding:18px}

  /* Empty state */
  .empty{height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:var(--text2)}
  .empty .e-icon{font-size:34px; margin-bottom:10px; opacity:.6}
  .empty .e-title{font-size:16px; font-weight:600; color:var(--text); margin-bottom:6px}
  .empty .e-sub{font-size:13px; max-width:380px; line-height:1.5}
  .empty .e-hint{margin-top:16px; font-size:12px; color:var(--text3)}

  /* Generic cards */
  .card{background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:14px}
  .card h3{font-size:13px; margin-bottom:8px; color:var(--text)}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  table.tbl{width:100%; border-collapse:collapse; font-size:12.5px}
  table.tbl th{text-align:left; font-family:ui-monospace,Menlo,monospace; font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:var(--text3); padding:6px 8px; border-bottom:1px solid var(--border2)}
  table.tbl td{padding:7px 8px; border-bottom:1px solid var(--border); color:var(--text2)}
  table.tbl td:first-child{color:var(--text); font-family:ui-monospace,Menlo,monospace; font-size:12px}
  .pill{font-family:ui-monospace,Menlo,monospace; font-size:10px; border-radius:4px; padding:2px 7px}
  .pill-io{color:var(--text2); border:1px solid var(--border2)}

  /* Map */
  .toolbar{display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap}
  .toolbar input{background:var(--bg3); border:1px solid var(--border2); color:var(--text); border-radius:6px; padding:6px 10px; font-size:12.5px; width:200px}
  .legend{display:flex; gap:12px; font-size:11px; color:var(--text2); margin-left:auto}
  .legend i{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px}
  .svgwrap{background:var(--bg2); border:1px solid var(--border); border-radius:10px; overflow:hidden}
  .node rect{stroke-width:1.5}
  .node text{font-family:ui-monospace,Menlo,monospace; font-size:11px; fill:var(--text)}
  .node .ntype{font-size:8.5px; letter-spacing:1px; fill:var(--text2)}
  .edge{stroke:var(--border2); stroke-width:1.2; fill:none}

  /* Flow steps */
  .step-body{margin-bottom:14px}
  .step-head{font-family:ui-monospace,Menlo,monospace; font-size:13px; font-weight:700; color:var(--accent)}
  .step-sub{font-size:12px; color:var(--text2); margin-top:3px; line-height:1.5}

  /* Code viewer */
  .codeblock{background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:14px; overflow:auto; font-family:ui-monospace,Menlo,monospace; font-size:12px; line-height:1.6; white-space:pre}
  .k{color:var(--purple)} .c{color:var(--text3)} .s{color:var(--green)} .n{color:var(--yellow)}
  .code-cols{display:grid; grid-template-columns:1fr 1fr; gap:14px; min-width:0}
  .code-cols .codeblock{min-height:220px}
  .note{font-size:11.5px; color:var(--text2); margin-top:8px}
  .note b{color:var(--yellow)}
  .key-panel{display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:10px; padding:30px 20px; color:var(--text2); border:1.5px dashed var(--border2); border-radius:10px}
  .key-panel .kp-icon{font-size:28px}
  .key-panel p{font-size:12.5px; max-width:320px; line-height:1.6}
  .key-input{background:var(--bg3); border:1px solid var(--border2); color:var(--text); border-radius:6px; padding:8px 12px; font-size:12.5px; width:min(280px,100%); font-family:ui-monospace,Menlo,monospace}
  .key-input:focus{outline:none; border-color:var(--accent)}
  .key-btn{background:var(--grad); color:#fff; border:none; border-radius:6px; padding:8px 14px; font-size:12px; font-weight:600; cursor:pointer}
  .key-btn:hover{filter:brightness(1.12)}
  .key-btn-subtle{background:var(--bg3); color:var(--text2); border:1px solid var(--border2); border-radius:6px; padding:8px 14px; font-size:12px; cursor:pointer}

  /* Impact */
  .impact-left{display:flex; flex-direction:column; gap:4px}
  .entity{padding:8px 10px; border-radius:7px; font-family:ui-monospace,Menlo,monospace; font-size:12px; cursor:pointer; color:var(--text2); border:1px solid transparent}
  .entity:hover{background:var(--bg3)}
  .entity.sel{background:rgba(79,143,255,.08); color:var(--accent); border-color:rgba(79,143,255,.3)}
  .impact-arrow{color:var(--text3); font-size:12px; padding:5px 0}
  .entity-row{padding:7px 10px; border-radius:7px; font-family:ui-monospace,Menlo,monospace; font-size:12px; color:var(--text)}

  /* Log */
  .log{font-family:ui-monospace,Menlo,monospace; font-size:11.5px; line-height:1.8; color:var(--text2)}
  .log .ok{color:var(--green)} .log .warn{color:var(--yellow)} .log .info{color:var(--accent)}

  ::-webkit-scrollbar{width:9px;height:9px} ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:5px} ::-webkit-scrollbar-track{background:transparent}
</style>
<!-- Télémétrie Google Analytics : désactivée par défaut. Opt-in via Debug → bouton Telemetry. Aucun chargement externe avant consentement explicite. -->

<body>

<!-- reforge.html — maquette redesign (compagnon de index.html, la landing). Héberger dans le même repo GitHub Pages. -->

<header>
  <div class="logo">REFORGE<span>.io</span></div>
  <div class="header-tag">Legacy Analyzer</div>
  <div class="badge-concept">REDESIGN CONCEPT</div>
  <div class="header-spacer"></div>
  <div class="status"><div class="dot"></div><span id="statusText">Ready</span></div>
  <a class="header-link" href="mailto:adrien@vyniad.be">adrien@vyniad.be</a>
  <button class="theme-btn" id="themeBtn">☀</button>
</header>

<div class="workspace">
  <aside class="left">
    <div class="panel-h">⬆ Source</div>
    <div class="dropzone" id="dz">
      <input type="file" id="fileInput" multiple style="display:none">
      <span class="icon">📁</span>
      Drop your legacy files here<br>
      JCL · COBOL · CPY — or a Reforge project (.json)<br>
      or <span class="browse">browse files</span>
    </div>
    <button class="sample-btn" id="sampleBtn">⚡ Try with a sample system</button>
    <div class="file-list" id="fileList"></div>
    <button class="clear-btn" id="clearAll" onclick="clearAllFiles()" style="display:none">Clear all files</button>
    <div class="stat-grid" id="stats"></div>
    <button class="analyze-btn" id="analyzeBtn" disabled>▶ Analyze</button>
    <button class="analyze-btn" id="exportBtn" style="display:none;margin-top:8px">⬇ Export project (.json)</button>
  </aside>

  <main class="right">
    <nav class="groups" id="groups"></nav>
    <nav class="subtabs" id="subtabs"></nav>
    <section class="content" id="content"></section>
  </main>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  PROTOTYPE FONCTIONNEL : drop réel + détection + parsing
//  (mini-analyseur embarqué pour démontrer le UX)
// ═══════════════════════════════════════════════════════════

// ── Navigation : 4 groupes au lieu de 13 onglets plats ──
const NAV = [
  { id:'explore',   icon:'🗺', label:'Explore',   subs:[ {id:'map',label:'System Map'}, {id:'flow',label:'Flow'}, {id:'programs',label:'Programs'}, {id:'data',label:'Data'} ] },
  { id:'analyze',   icon:'🔬', label:'Analyze',  subs:[ {id:'impact',label:'Impact'}, {id:'lineage',label:'Data Lineage'}, {id:'db2',label:'DB2 / SQL'}, {id:'summary',label:'Summary'} ] },
  { id:'modernize', icon:'⚡', label:'Modernize', subs:[ {id:'python',label:'COBOL → Python',hot:true}, {id:'ai',label:'AI Explain',hot:true} ] },
  { id:'tech',      icon:'🛠', label:'Tech',      subs:[ {id:'source',label:'Source'}, {id:'copybooks',label:'Copybooks'}, {id:'debug',label:'Debug'} ] },
];

const state = { files:[], loaded:false, log:[], group:'explore', sub:'map', entity:null, srcFile:null, pySel:null, srcIdx:null, _model:null, _testResults:null };

// ══════════════════ 1. DÉTECTION & PARSING (réel) ══════════════════

function base(n){ return n.replace(/\.[^.]+$/,'').toUpperCase(); }

function detectLang(name, text){
  const ext = (name.split('.').pop()||'').toUpperCase();
  const t = text.toUpperCase();
  if (ext === 'JCL') return 'JCL';
  if (ext === 'CPY' || ext === 'COPY') return 'CPY';
  if (/\bIDENTIFICATION DIVISION\b/.test(t) || /\bPROGRAM-ID\b/.test(t)) return 'CBL';
  if (/^\s*\/\//m.test(t) && /\b(EXEC|PROC|JOB|DD)\b/.test(t)) return 'JCL';
  if (/\bPIC(TURE)?\s+[S9VX]/i.test(text) && !/\bPROCEDURE DIVISION\b/.test(t)) return 'CPY';
  if (/\b(DIVISION|SECTION)\b/.test(t)) return 'CBL';
  if (ext === 'CBL' || ext === 'COB' || ext === 'CB2') return 'CBL';
  return 'TXT';
}

// ── JCL ENGINE v2 ─────────────────────────────────────────────────────────
// Real tokenizer → statement parser → model builder. Handles:
// JOB/EXEC/DD/PROC/PEND/SET/IF-ELSE-ENDIF/INCLUDE/JCLLIB, in-stream PROC
// expansion, symbolic parameters (SET, PROC defaults, EXEC symbols),
// EXEC overrides (PROCSTEP.DD.PARAM), DISP input/output classification,
// GDG (±n), temp datasets (&&), in-stream data (DD *), continuations,
// columns 73-80. Never throws: anything unrecognized lands in warnings[].

const JCL_OPS = new Set([
  'JOB', 'EXEC', 'DD', 'PROC', 'PEND', 'SET', 'IF', 'ELSE', 'ENDIF',
  'OUTPUT', 'INCLUDE', 'JCLLIB', 'COMMAND', 'XMIT', 'CNTL', 'ENDCNTL', 'EXPORT',
]);
const EXEC_STD_PARAMS = new Set([
  'PGM', 'PROC', 'PARM', 'COND', 'TIME', 'REGION', 'ADDRSPC', 'DYNAMNBR',
  'CLASS', 'MSGCLASS', 'MSGLEVEL', 'NOTIFY', 'USER', 'PASSWORD', 'TYPRUN', 'ACCT',
]);

function tokenizeStatements(text, warnings){
  const statements = [];
  const lines = text.split(/\r?\n/);
  let inStreamData = false;
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].slice(0, 72).trimEnd();
    const ln = i + 1;
    if (!line.trim()) continue;
    if (inStreamData) {
      if (line.startsWith('/*') || line.startsWith('//')) inStreamData = false;
      else continue;
    }
    if (line.startsWith('/*')) continue;
    if (line.startsWith('//*')) continue;
    if (!line.startsWith('//')) { warnings.push(`L${ln}: non-JCL line ignored`); continue; }
    const rest = line.slice(2);
    if (rest.trim() === '') continue;
    const firstTok = rest.trim().split(/\s+/)[0];
    const looksLikeContinuation =
      firstTok.includes('=') ||
      firstTok.startsWith("'") ||
      (statements.length > 0 && statements[statements.length - 1].operands.trim().endsWith(','));
    if (looksLikeContinuation && !JCL_OPS.has(firstTok.toUpperCase())) {
      const prev = statements[statements.length - 1];
      if (prev && (prev.op === 'EXEC' || prev.op === 'DD' || prev.op === 'PROC' || prev.op === 'SET')) {
        prev.operands += ' ' + rest.trim();
        continue;
      }
      warnings.push(`L${ln}: orphan continuation ignored`);
      continue;
    }
    const t = rest.trim().match(/^(\S+)(?:\s+(.*))?$/);
    if (!t) continue;
    let name = null, op = null, operands = t[2] || '';
    if (JCL_OPS.has(t[1].toUpperCase())) {
      op = t[1].toUpperCase();
    } else {
      name = t[1];
      const t2 = operands.match(/^(\S+)\s*(.*)$/);
      if (t2 && JCL_OPS.has(t2[1].toUpperCase())) {
        op = t2[1].toUpperCase();
        operands = t2[2] || '';
      } else {
        const prev = statements[statements.length - 1];
        if (prev) { prev.operands += ' ' + rest.trim(); continue; }
        warnings.push(`L${ln}: unrecognized statement ignored ("${t[1]}")`);
        continue;
      }
    }
    const st = { name, op, operands: operands.trim(), line: ln };
    if (op === 'DD' && /^(\*|DATA\b)/.test(operands.trim())) inStreamData = true;
    statements.push(st);
  }
  return statements;
}

function parseParams(operands){
  const parts = [];
  let depth = 0, quote = false, cur = '';
  for (const ch of operands) {
    if (quote) { cur += ch; if (ch === "'") quote = false; continue; }
    if (ch === "'") { quote = true; cur += ch; continue; }
    if (ch === '(') depth++;
    if (ch === ')') depth--;
    if (ch === ',' && depth === 0) { parts.push(cur.trim()); cur = ''; continue; }
    cur += ch;
  }
  if (cur.trim()) parts.push(cur.trim());
  const out = {};
  for (const p of parts) {
    if (!p) continue;
    const eq = p.indexOf('=');
    if (eq > 0) out[p.slice(0, eq).toUpperCase()] = p.slice(eq + 1).replace(/^'|'$/g, '');
    else out[p.toUpperCase()] = true;
  }
  return out;
}

function substitute(value, symbols){
  if (typeof value !== 'string') return value;
  const s = value.replace(/&([A-Z@$#][A-Z0-9@$#]*)/gi, (m, v) => {
    const up = v.toUpperCase();
    if (symbols[up] !== undefined && symbols[up] !== true) return symbols[up];
    return m;
  });
  return s.replace(/\.\./g, '.');
}

function classifyUsage(p){
  // pas de DISP → on n'invente pas un usage : 'unknown' + avertissement en aval
  if (p.DISP === undefined || typeof p.DISP !== 'string') return 'unknown';
  const disp = p.DISP.toUpperCase();
  const first = disp.startsWith('(') ? disp.slice(1) : disp;
  const head = first.split(/[,(]/)[0].trim();
  if (head === '') return 'output';   // DISP=(,CATLG): omitted status = NEW
  if (head === 'NEW' || head === 'MOD') return 'output';
  if (head === 'SHR' || head === 'OLD') return 'input';
  return 'unknown';
}

function buildDD(st, p, symbols){
  const dd = { ddname: st.name, line: st.line };
  if (p.DSN !== undefined) {
    const dsn = substitute(p.DSN, symbols);
    if (dsn.startsWith('&&')) {
      dd.name = dsn.toUpperCase(); dd.temp = true; dd.usage = 'output';
    } else if (dsn.startsWith('*.')) {
      // référence arrière : DSN=*.STEP01.SORTOUT (temp passé d'un step à l'autre)
      dd.name = dsn.toUpperCase(); dd.backref = true; dd.usage = classifyUsage(p);
    } else {
      const g = dsn.match(/^(.*)\(([-+]?\d+)\)$/);
      if (g) { dd.name = g[1].toUpperCase(); dd.gdg = parseInt(g[2], 10); }
      else dd.name = dsn.toUpperCase();
      dd.usage = classifyUsage(p);
    }
  } else if (p.SYSOUT !== undefined) { dd.sysout = String(p.SYSOUT); dd.usage = 'output'; }
  else if (p.DUMMY !== undefined) { dd.dummy = true; }
  if (p.DISP !== undefined && typeof p.DISP === 'string') dd.disp = p.DISP.toUpperCase();
  if (p.SPACE !== undefined) dd.space = String(p.SPACE);
  return dd;
}

function linkProcs(result){
  for (const job of result.jobs) {
    const expanded = [];
    for (const step of job.steps) {
      if (step.kind !== 'PROC' || !step.target) { expanded.push(step); continue; }
      const proc = result.procs[step.target];
      if (!proc) {
        step.resolved = false;
        expanded.push(step);
        result.warnings.push(`${job.name}: PROC ${step.target} not found (external cataloged proc?)`);
        job.procsUsed.push(step.target);
        continue;
      }
      step.resolved = true;
      job.procsUsed.push(proc.name);
      const symbols = { ...proc.defaults, ...step.symbols };
      for (const ps of proc.steps) {
        const copy = JSON.parse(JSON.stringify(ps));
        copy.proc = proc.name;
        copy.via = step.name;
        for (const dd of copy.dds) {
          if (dd.name) {
            dd.name = substitute(dd.name, symbols);
            if (dd.name.includes('&')) copy.hasUnresolvedSymbols = true;
          }
        }
        for (const [ov, val] of Object.entries(step.overrides)) {
          const parts = ov.split('.');
          const ddname = parts.length >= 3 ? parts[1].toUpperCase() : parts[0].toUpperCase();
          const param = (parts.length >= 3 ? parts.slice(2) : parts.slice(1)).join('.').toUpperCase();
          const dd = copy.dds.find(d => (d.ddname || '').toUpperCase() === ddname);
          if (dd) dd['ov_' + param] = val;
        }
        expanded.push(copy);
      }
    }
    job.steps = expanded;
  }
}

// INCLUDE MEMBER=X : si le membre est uploadé (fichier JCL du projet), ses
// instructions sont splicées dans le flux — sinon warning précis, jamais deviné.
function resolveIncludes(stmts, members, stack, warns){
  const out = [];
  for (const st of stmts){
    if (st.op !== 'INCLUDE'){ out.push(st); continue; }
    const p = parseParams(st.operands);
    let member = null;
    if (typeof p.MEMBER === 'string' && p.MEMBER) member = p.MEMBER.trim().toUpperCase();
    else {
      const raw = st.operands.trim();
      const dn = raw.match(/\(([^()]+)\)\s*$/); // INCLUDE DSN=X.Y(NAME) ou MEMBER=X.Y(NAME)
      member = dn ? dn[1].toUpperCase() : raw.split(/\s+/)[0].toUpperCase();
    }
    if (!member){ warns.push(`L${st.line}: INCLUDE without member name — ignored`); continue; }
    if (stack.includes(member)){ warns.push(`L${st.line}: INCLUDE ${member} circular — skipped`); continue; }
    if (stack.length >= 5){ warns.push(`L${st.line}: INCLUDE nesting deeper than 5 — stopped`); continue; }
    const text = members[member];
    if (text == null){
      warns.push(`L${st.line}: INCLUDE member ${member} not uploaded — statements not available`);
      out.push(st);
      continue;
    }
    out.push(...resolveIncludes(tokenizeStatements(text, warns), members, stack.concat(member), warns));
  }
  return out;
}

function parseJCL(text, members){
  const warnings = [];
  const stmts = resolveIncludes(tokenizeStatements(text, warnings), members || {}, [], warnings);
  const result = { jobs: [], procs: {}, warnings };
  let job = null;
  let procDef = null;
  let procStack = [];
  let condStack = [];
  let globalSymbols = {};
  for (const st of stmts) {
    switch (st.op) {
      case 'JOB':
        job = { name: st.name, line: st.line, params: parseParams(st.operands), steps: [], procsUsed: [] };
        result.jobs.push(job);
        procDef = null; procStack = []; condStack = [];
        break;
      case 'SET':
        Object.assign(globalSymbols, parseParams(st.operands));
        break;
      case 'PROC':
        if (st.name) {
          // PROC imbriqués in-stream : pile de définitions, PEND restaure le parent
          procStack.push(procDef);
          procDef = { name: st.name.toUpperCase(), defaults: parseParams(st.operands), steps: [] };
          result.procs[procDef.name] = procDef;
        } else if (job) {
          // PROC sans nom (JOB statement) : defaults symboliques pour ce job
          Object.assign(globalSymbols, parseParams(st.operands));
        }
        break;
      case 'PEND':
        procDef = procStack.pop() || null;
        break;
      case 'EXEC': {
        const p = parseParams(st.operands);
        let kind = null, target = null;
        if (p.PGM !== undefined) { kind = 'PGM'; target = p.PGM; }
        else if (p.PROC !== undefined) { kind = 'PROC'; target = p.PROC; }
        else {
          const pos = Object.entries(p).find(([k, v]) => v === true && !EXEC_STD_PARAMS.has(k));
          if (pos) { kind = 'PROC'; target = pos[0]; }
          else warnings.push(`L${st.line}: EXEC without PGM or PROC`);
        }
        const step = {
          name: st.name, line: st.line, kind,
          condition: condStack.length ? { ...condStack[condStack.length - 1] } : null,
          dds: [], overrides: {}, symbols: {},
        };
        if (target) step.target = substitute(String(target), globalSymbols).toUpperCase();
        for (const [k, v] of Object.entries(p)) {
          if (k === 'PGM' || k === 'PROC') continue;
          if (k.includes('.')) step.overrides[k.toUpperCase()] = v;
          else if (!EXEC_STD_PARAMS.has(k)) step.symbols[k] = v;
        }
        if (procDef) procDef.steps.push(step);
        else if (job) job.steps.push(step);
        else warnings.push(`L${st.line}: EXEC outside of job ignored`);
        break;
      }
      case 'DD': {
        const owner = procDef ? procDef.steps : (job ? job.steps : []);
        const step = owner[owner.length - 1];
        if (!step) { warnings.push(`L${st.line}: DD outside of step ignored`); break; }
        step.dds.push(buildDD(st, parseParams(st.operands), globalSymbols));
        break;
      }
      case 'IF':
        condStack.push({ text: st.operands.trim().replace(/\s+THEN\s*$/i,''), neg: false });
        break;
      case 'ELSE':
        if (condStack.length) condStack[condStack.length - 1].neg = true;
        break;
      case 'ENDIF':
        condStack.pop();
        break;
      case 'INCLUDE':
        // déjà traité par resolveIncludes : membre splicé si uploadé, warning précis sinon
        break;
      case 'JCLLIB':
        result.jcllib = st.operands.trim();
        break;
      case 'OUTPUT': case 'COMMAND': case 'XMIT': case 'CNTL': case 'ENDCNTL': case 'EXPORT':
        warnings.push(`L${st.line}: ${st.op} statement ignored (not needed for mapping)`);
        break;
      default:
        warnings.push(`L${st.line}: unknown operation ${st.op}`);
    }
  }
  linkProcs(result);
  return result;
}

// ── Liaison globale : PROCs « catalogés » et PROCs imbriqués ──────────────
// Le navigateur ne peut pas atteindre votre PROCLIB, mais si vous déposez vos
// fichiers PROC à côté de vos JCL, ils sont résolus comme des procs catalogés.
// Idempotent : appelé à chaque buildGraph, ne fait rien une fois tout résolu.
function linkCatalogedProcs(){
  const registry = {};
  state.files.forEach(f=>{ if (f.lang === 'JCL' && f.parsed.procs) Object.assign(registry, f.parsed.procs); });
  let changed = true, guard = 0;
  while (changed && guard < 25){
    changed = false; guard++;
    state.files.forEach(f=>{
      if (f.lang !== 'JCL' || !f.parsed.jobs) return;
      f.parsed.jobs.forEach(jb=>{
        for (let i = 0; i < jb.steps.length; i++){
          const s = jb.steps[i];
          if (s.kind !== 'PROC' || !s.target || s.resolved) continue;
          if ((s.chain || []).includes(s.target)) continue; // récursion déjà signalée
          const proc = registry[s.target];
          if (!proc) continue;
          if ((s.chain || []).length >= 10 || jb.steps.length > 200) continue; // garde-fou
          s.resolved = true;
          jb.procsUsed = jb.procsUsed || [];
          jb.procsUsed.push(proc.name);
          const symbols = { ...proc.defaults, ...s.symbols };
          const copies = [];
          for (const ps of proc.steps){
            const copy = JSON.parse(JSON.stringify(ps));
            copy.proc = proc.name;
            copy.via = s.name;
            copy.chain = [...(s.chain || []), proc.name];
            for (const dd of copy.dds){
              if (dd.name){
                dd.name = substitute(dd.name, symbols);
                if (dd.name.includes('&')) copy.hasUnresolvedSymbols = true;
              }
            }
            for (const [ov, val] of Object.entries(s.overrides || {})){
              const parts = ov.split('.');
              const ddname = parts.length >= 3 ? parts[1].toUpperCase() : parts[0].toUpperCase();
              const param = (parts.length >= 3 ? parts.slice(2) : parts.slice(1)).join('.').toUpperCase();
              const dd = copy.dds.find(d => (d.ddname || '').toUpperCase() === ddname);
              if (dd) dd['ov_' + param] = val;
            }
            copies.push(copy);
          }
          jb.steps.splice(i, 1, ...copies);
          i += copies.length - 1;
          changed = true;
          // retire le warning obsolète « PROC … not found »
          if (f.parsed.warnings) f.parsed.warnings = f.parsed.warnings.filter(w => !w.includes(`PROC ${s.target} not found`));
        }
      });
    });
  }
  // signaler les appels récursifs restants
  state.files.forEach(f=>{
    if (f.lang !== 'JCL' || !f.parsed.jobs || !f.parsed.warnings) return;
    f.parsed.jobs.forEach(jb=>jb.steps.forEach(s=>{
      if (s.kind === 'PROC' && s.target && (s.chain || []).includes(s.target)
          && !f.parsed.warnings.some(w => w.includes(`recursive PROC ${s.target}`)))
        f.parsed.warnings.push(`recursive PROC call to ${s.target} detected — not expanded`);
    }));
  });
}

// ══════════════════ 1b. COBOL ENGINE v3 ══════════════════
// Vrai parseur COBOL : format fixe/libre, divisions/sections/paragraphes,
// SELECT ASSIGN, niveaux de données (PIC/OCCURS/REDEFINES/VALUE), COPY
// imbriqués (+REPLACING), PERFORM/THRU, CALL (littéral + dynamique résolu),
// GO TO (y compris dans IF), READ/WRITE/REWRITE/OPEN, blocs EXEC SQL.
// Tout ce qui n'est pas reconnu produit un avertissement — aucune
// dépendance n'est jamais inventée.

function tkWords(s){ return s.replace(/,+$/,'').trim().split(/\s+/).filter(Boolean); }

function cobDetectFixed(raw){
  const lines = raw.split(/\r?\n/);
  let seq = 0, ind = 0, col8 = 0, nonEmpty = 0;
  for (const l of lines){
    if (!l.trim()) continue;
    nonEmpty++;
    if (/^[0-9]{3,6}(\s|$)/.test(l)) seq++;
    if (l.length > 7 && /^[0-9 ]{6}[*\-\/Dd]/.test(l.slice(0,7))) ind++;
    const first = l.search(/\S/);
    if (first >= 7) col8++;
  }
  if (!nonEmpty) return false;
  return (seq / nonEmpty >= 0.5) || (ind / nonEmpty >= 0.5) || (col8 / nonEmpty >= 0.6);
}

function cobLogicalItems(text, warns){
  const lines = text.split(/\r?\n/);
  // détection UNE fois pour tout le fichier : en format libre, une entrée
  // indentée "    05  X PIC 9." ne doit pas être confondue avec une zone de
  // séquence fixe — sinon le niveau de données serait avalé.
  const fixed = cobDetectFixed(text);
  const items = [];
  let inSql = false, sqlBuf = [], sqlStart = 0;
  let inCics = false, cicsBuf = [], cicsStart = 0;
  let litOpen = false; // littérale encore ouverte en fin de ligne (continuation '-')
  for (let i = 0; i < lines.length; i++){
    const orig = lines[i];
    let l = orig;
    let ind = '';
    if (fixed){
      // format fixe : zone de séquence (col 1-6) + indicatif (col 7), troncature à 72
      ind = l.length > 6 ? l[6] : ' ';
      if (ind === '*' || ind === '/') continue; // ligne de commentaire
      if (ind === '-') l = '       ' + l.slice(7); // continuation : zone A ignorée
      else l = l.slice(7);
      if (l.length > 72) l = l.slice(0, 72);
      if (orig.length > 72 && warns) warns.push(`line ${i+1}: statement beyond column 72 truncated (fixed format)`);
    } else if (l.length > 80){
      if (warns) warns.push(`line ${i+1}: very long line — free format assumed, not truncated`);
    }
    // commentaire flottant *> (COBOL 2002+) — supprimé hors littérale
    {
      let q = false;
      for (let ci = 0; ci < l.length - 1; ci++){
        const ch = l[ci];
        if (ch === "'") q = !q;
        else if (!q && ch === '*' && l[ci+1] === '>'){ l = l.slice(0, ci).trim(); break; }
      }
    }
    if (!l.trim()) continue;
    if (inSql){
      sqlBuf.push(l);
      if (/\bEND-EXEC\b/i.test(l)){
        items.push({ t: 'sql', text: sqlBuf.join(' '), ln: sqlStart });
        inSql = false; sqlBuf = [];
      }
      continue;
    }
    if (/^\s*EXEC\s+SQL\b/i.test(l)){
      if (/\bEND-EXEC\b/i.test(l)){
        items.push({ t: 'sql', text: l, ln: i+1 });
      } else {
        inSql = true; sqlBuf = [l]; sqlStart = i+1;
      }
      continue;
    }
    // EXEC CICS ... END-EXEC : bloc dédié, même mécanique que SQL
    if (inCics){
      cicsBuf.push(l);
      if (/\bEND-EXEC\b/i.test(l)){
        items.push({ t: 'cics', text: cicsBuf.join(' '), ln: cicsStart });
        inCics = false; cicsBuf = [];
      }
      continue;
    }
    if (/^\s*EXEC\s+CICS\b/i.test(l)){
      if (/\bEND-EXEC\b/i.test(l)){
        items.push({ t: 'cics', text: l, ln: i+1 });
      } else {
        inCics = true; cicsBuf = [l]; cicsStart = i+1;
      }
      continue;
    }
    // continuation de littérale (col 7 '-') : la chaîne reprend au guillemet
    // SANS espace inséré — sinon 'ABC' continuée par 'DEF' serait corrompue
    if (fixed && ind === '-' && litOpen && items.length && items[items.length-1].t === 'line'){
      const last = items[items.length-1];
      const cm = l.trim().match(/^'(.*)$/);
      if (cm) last.text = last.text.replace(/\s+$/,'') + cm[1];
      else last.text += ' ' + l.trim();
    } else {
      items.push({ t: 'line', text: l, ln: i+1 });
    }
    {
      const lc = items.length && items[items.length-1].t === 'line' ? items[items.length-1].text : '';
      litOpen = (lc.match(/'/g) || []).length % 2 === 1;
    }
  }
  if (inSql && warns) warns.push(`line ${sqlStart}: EXEC SQL block without END-EXEC`);
  if (inCics && warns) warns.push(`line ${cicsStart}: EXEC CICS block without END-EXEC`);
  return { items, fixedHint: lines.some(l => /^[0-9]{3,6}(\s|$)/.test(l)) };
}

function cobSentences(items){
  const out = [];
  let buf = [], start = null;
  const endsWithPeriod = s => /\.\s*$/.test(s);
  for (const it of items){
    if (it.t === 'sql'){ out.push({ t:'sql', text: it.text, ln: it.ln }); continue; }
    if (it.t === 'cics'){ out.push({ t:'cics', text: it.text, ln: it.ln }); continue; }
    if (start === null) start = it.ln;
    // continuation : une ligne ne finissant pas par un verbe/keyword connu à moitié est jointe à la suivante
    buf.push(it.text.trim());
    const joined = buf.join(' ');
    if (endsWithPeriod(joined)){
      out.push({ t:'sentence', text: joined, ln: start });
      buf = []; start = null;
    }
  }
  if (buf.length){
    const joined = buf.join(' ');
    if (/\.\s*$/.test(joined)) out.push({ t:'sentence', text: joined, ln: start });
    else out.push({ t:'sentence', text: joined + '.', ln: start, incomplete: true });
  }
  return out;
}

function parseReplacing(s){
  // COPY X REPLACING ==A== BY ==B==  |  A BY B  |  LEADING/TRAILING ==A== BY ==B==
  const pairs = [];
  const re = /(LEADING|TRAILING)?\s*(?:==([^=]+)==|\b([A-Z0-9][A-Z0-9\-]*)\b)\s+BY\s+(?:==([^=]+)==|\b([A-Z0-9][A-Z0-9\-]*)\b)/gi;
  let m;
  while ((m = re.exec(s))){
    const from = (m[2] !== undefined ? m[2] : (m[3] || '')).toUpperCase().trim();
    const to = (m[4] !== undefined ? m[4] : (m[5] || '')).toUpperCase().trim();
    if (from) pairs.push({ from, to, mode: (m[1] || '').toUpperCase() });
  }
  return pairs;
}
function applyReplacing(t, pairs){
  for (const p of pairs){
    const a = p.from.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    try {
      if (p.mode === 'LEADING') t = t.replace(new RegExp('\\b' + a, 'gi'), p.to);
      else if (p.mode === 'TRAILING') t = t.replace(new RegExp(a + '\\b', 'gi'), p.to);
      else t = t.replace(new RegExp('\\b' + a + '\\b', 'gi'), p.to);
    } catch(e){ /* pattern invalide → texte original conservé */ }
  }
  return t;
}

function expandCopies(sents, registry, ctx, stack){
  const out = [];
  for (const sn of sents){
    if (sn.t !== 'sentence'){ out.push(sn); continue; }
    const cm = sn.text.match(/^COPY\s+([A-Z0-9\-]+)\s*(.*?)\.\s*$/i);
    if (!cm){ out.push(sn); continue; }
    const bname = cm[1].toUpperCase();
    const book = registry[bname] || registry[bname.replace(/^-/,'')];
    if (!book){
      ctx.warns.push(`line ${sn.ln}: COPY ${bname} not uploaded — layout unknown`);
      ctx.copyUsed.push({ name: bname, resolved: false, ln: sn.ln, file: ctx.file });
      out.push(sn); // garder la phrase COPY pour trace
      continue;
    }
    if (stack.includes(bname)){
      ctx.warns.push(`line ${sn.ln}: COPY ${bname} circular reference — skipped`);
      continue;
    }
    if (stack.length >= 10){
      ctx.warns.push(`line ${sn.ln}: COPY nesting deeper than 10 — stopped`);
      continue;
    }
    ctx.copyUsed.push({ name: bname, resolved: true, ln: sn.ln, file: ctx.file });
    let btext = book.text;
    const pairs = parseReplacing(cm[2]);
    if (pairs.length) btext = applyReplacing(btext, pairs);
    const sub = expandCopies(cobSentences(cobLogicalItems(btext, ctx.warns).items).filter(s=>s.t==='sentence'), registry, ctx, stack.concat(bname));
    out.push({ t:'sentence', text: sn.text, ln: sn.ln, copy: bname });
    sub.forEach(s => { if (s.t==='sentence' && s.copy !== undefined) out.push(s); else out.push(s); });
  }
  return out;
}

const SQLKW = new Set(['SELECT','INSERT','UPDATE','DELETE','FROM','WHERE','SET','INTO','VALUES','JOIN','INNER','LEFT','RIGHT','OUTER','ON','AND','OR','NOT','IN','BETWEEN','LIKE','ORDER','GROUP','BY','AS','DISTINCT','UNION','ALL','CURSOR','FOR','FETCH','DECLARE','OPEN','CLOSE','WITH','HAVING','EXISTS','CASE','WHEN','THEN','END','TABLE','CREATE','DROP','ALTER','INDEX','VIEW','COUNT','SUM','AVG','MIN','MAX','CURRENT','TIMESTAMP','DATE','SCHEMA','COMMIT','ROLLBACK','WHENEVER','NOT','FOUND','SQLSTATE','SQLCODE','WITH','HOLD','SQLEXCEPTION','SQLWARNING']);

function sqlTables(st){
  // st = texte d'un bloc EXEC SQL (sans le préfixe) → tables référencées
  const text = st.replace(/^\s*EXEC\s+SQL/i,'').replace(/\bEND-EXEC\b\.?\s*$/i,'');
  const upper = text.toUpperCase();
  const tabs = new Set();
  // noms de CTE (WITH X AS (...)) : ce ne sont pas des tables — exclus des résultats
  const ctes = new Set();
  const cteRe = /(?:\bWITH\b|,)\s*([A-Z0-9\-]+)\s+AS\s*\(/g;
  let cm2;
  while ((cm2 = cteRe.exec(upper))) ctes.add(cm2[1]);
  const pushList = (s) => {
    s.split(',').forEach(x => {
      const t = x.trim();
      if (!t) return;
      const q = t.match(/^"([^"]+)"/); // identifiant entre guillemets ("MY TABLE")
      if (q){ tabs.add(q[1].trim().toUpperCase()); return; }
      const w = t.split(/\s+/)[0];
      const clean = w.replace(/[(),;]/g,'');
      if (clean && !SQLKW.has(clean) && !ctes.has(clean) && !clean.startsWith(':') && !/^&/.test(clean)) tabs.add(clean);
    });
  };
  // FROM t1, t2 alias / JOIN t / INTO t / UPDATE t
  const anchors = ['FROM','INTO','UPDATE','JOIN','TABLE'];
  const re = /\b(FROM|INTO|UPDATE|JOIN|TABLE)\b/g;
  let m;
  while ((m = re.exec(upper))){
    const after = upper.slice(m.index + m[0].length).trim();
    // s'arrêter au premier keyword SQL suivant
    let seg = after;
    const kwRe = /\b(SELECT|WHERE|SET|ON|JOIN|INNER|LEFT|RIGHT|OUTER|VALUES|FOR|WITH|AS|END-EXEC)\b/;
    const km = seg.match(kwRe);
    if (km) seg = seg.slice(0, km.index);
    pushList(seg);
  }
  return [...tabs];
}

function sqlParse(C, s){
  const raw = s.text.replace(/^\s*EXEC\s+SQL/i,'').replace(/\bEND-EXEC\b\.?\s*$/i,'');
  const U = raw.toUpperCase();
  const first = tkWords(U)[0];
  // instructions sans accès aux données : pas d'arête, pas de bruit
  if (['INCLUDE','WHENEVER','COMMIT','ROLLBACK','CONNECT','SET','FETCH','OPEN','CLOSE'].includes(first)){
    C.sql.push({ op: 'other', tables: [], ln: s.ln, text: raw.trim().slice(0, 200) });
    return;
  }
  if (first === 'PREPARE' || first === 'EXECUTE'){
    // SQL dynamique : le texte de la requête est inconnu → 0 table, aucun faux positif
    C.sql.push({ op: 'dynamic', tables: [], ln: s.ln, text: raw.trim().slice(0, 200) });
    C.warns.push(`line ${s.ln}: dynamic SQL (${first}) — statement text unknown, tables NOT extracted (no false positive)`);
    return;
  }
  let op = null;
  if (first === 'DECLARE'){
    const cm = U.match(/\bCURSOR\s+FOR\s+(SELECT|INSERT|UPDATE|DELETE|MERGE)\b/);
    if (!cm){
      // DECLARE X TABLE / déclarations de variables hôtes : pas un accès aux données
      C.sql.push({ op: 'other', tables: [], ln: s.ln, text: raw.trim().slice(0, 200) });
      return;
    }
    op = cm[1];
  } else if (['SELECT','INSERT','UPDATE','DELETE','MERGE'].includes(first)) op = first;
  // normalisation des opérations : SELECT→read, INSERT/DELETE→write, UPDATE/MERGE→update
  if (op === 'SELECT') op = 'read';
  else if (op === 'INSERT' || op === 'DELETE') op = 'write';
  else if (op === 'UPDATE' || op === 'MERGE') op = 'update';
  if (op === null && /\bSELECT\b/.test(U)) op = 'read';
  const tabs = sqlTables(s.text);
  C.sql.push({ op: op || 'unknown', tables: tabs, ln: s.ln, text: raw.trim().slice(0, 200) });
  if (!op)
    C.warns.push(`line ${s.ln}: EXEC SQL statement type not recognized (${first || '?'}) — tables still extracted, no typed edge created`);
}

// ═══ EXEC CICS : fichiers (FCT), maps, queues, XCTL/LINK — jamais inventé ═══
// Chaque commande est enregistrée avec sa référence littérale. FILE(WS-VAR)
// (valeur inconnue au parse) et les commandes sans accès aux données (RETURN,
// HANDLE, ASSIGN...) restent silencieuses : aucune arête, aucun faux positif.
function cicsParse(C, s){
  const raw = s.text.replace(/^\s*EXEC\s+CICS/i,'').replace(/\bEND-EXEC\b\.?\s*$/i,'').trim();
  const U = raw.toUpperCase();
  const w = tkWords(U);
  const cmd = w[0];
  const e = { cmd, op: null, file: null, queue: null, qtype: null, map: null, program: null,
    ln: s.ln, silent: false, text: raw.slice(0, 200) };
  const lit = re => { const m2 = U.match(re); return m2 ? m2[1] : null; };
  if (['READ','WRITE','REWRITE','UPDATE','DELETE'].includes(cmd)){
    e.op = cmd === 'READ' ? 'read' : cmd === 'WRITE' ? 'write' : (cmd === 'REWRITE' || cmd === 'UPDATE') ? 'update' : 'delete';
    e.file = lit(/\b(?:FILE|DATASET)\s*\(\s*'([^']*)'\s*\)/);
    if (e.file) C.cicsFiles[e.file] = [...(C.cicsFiles[e.file]||[]), { op: e.op, ln: s.ln, cics: cmd, cicsFile: e.file }];
    else e.silent = true; // FILE(variable) : valeur inconnue → aucune arête, rien inventé
  } else if (cmd === 'READQ' || cmd === 'WRITEQ' || cmd === 'DELETEQ'){
    e.op = cmd === 'READQ' ? 'read' : cmd === 'WRITEQ' ? 'write' : 'delete';
    e.qtype = (w[1] === 'TS' || w[1] === 'TD') ? w[1] : null;
    e.queue = lit(/\bQUEUE\s*\(\s*'([^']*)'\s*\)/);
    if (!e.queue) e.silent = true;
  } else if (cmd === 'SEND' || cmd === 'RECEIVE'){
    e.map = lit(/\bMAP\s*\(\s*'([^']*)'\s*\)/);
    if (!e.map) e.silent = true; // SEND TEXT / RECEIVE sans MAP : pas une ressource nommée
  } else if (['XCTL','LINK','CALL','TRANSFER'].includes(cmd)){
    e.program = lit(/\bPROGRAM\s*\(\s*'([^']*)'\s*\)/);
    if (!e.program) e.silent = true; // PROGRAM(variable) : cible inconnue → aucune arête
  } else {
    e.silent = true; // RETURN/HANDLE/AID/ASSIGN/GETMAIN... : pas d'accès aux données, aucun bruit
  }
  C.cics.push(e);
}

const IDENT = /^[A-Z0-9][A-Z0-9\-]*$/;

function levelEntry(C, w, ln, sec, fd){
  // 01  NAME  PIC 9(4)V99 [OCCURS n] [REDEFINES X] [VALUE lit].
  const lvl = w[0];
  const name = (w[1]||'').toUpperCase();
  const rest = w.slice(2).join(' ');
  const picm = rest.match(/\bPIC(?:TURE)?\s+(?:IS\s+)?([A-Z0-9SVX\.\(\)\+\-,\$*\-\/]+(?:\s+[A-Z0-9SVX\.\(\)\+\-,\$*\-\/]+)*)/i);
  const pic = picm ? picm[1].replace(/\s+/g,'') : null;
  const occm = rest.match(/\bOCCURS\s+(\d+)\s*(?:TIMES)?/i);
  const redm = rest.match(/\bREDEFINES\s+([A-Z0-9\-]+)/i);
  const valm = rest.match(/\bVALUE\s+(?:IS\s+)?['"]?([^'"\s.]+)/i);
  const v = { level: parseInt(lvl,10), name: name || 'FILLER', pic, occurs: occm?parseInt(occm[1],10):null, redefines: redm?redm[1].toUpperCase():null, value: valm?valm[1]:null, fd: fd || null, sec, ln, is88: lvl === '88' };
  C.vars.push(v);
  if (lvl === '88' && valm) (C.varLits[name] = C.varLits[name] || []).push(valm[1].toUpperCase());
  if (!pic && lvl !== '88' && !redm && name && name !== 'FILLER' && !/\bPIC\b|\bOCCURS\b/i.test(rest) && !w.slice(1).some(x=>/^(COMP|BINARY|PACKED|USAGE|SYNC|JUST|JUSTIFIED|BLANK|GLOBAL|EXTERNAL)$/i.test(x)))
    ; // groupe sans PIC : légitime (01 RECORD. / 05 SUB-GROUP.)
}

function procSentence(C, t, s, para, opAdd){
  const ln = s.ln;
  // Le point final de la phrase est retiré : GO TO CAP-PARA. doit donner
  // la cible "CAP-PARA" (valide IDENT) et non "CAP-PARA."
  const U = t.toUpperCase().replace(/\.\s*$/, '');
  // Littérales neutralisées pour la détection de verbes : un verbe écrit
  // DANS une chaîne (MOVE 'READ X' TO Y) ne doit jamais créer de relation.
  const UQ = U.replace(/'[^']*'/g, "''");
  // I/O : scannés dans TOUTE la phrase — les phrases multi-verbes sont
  // courantes en COBOL (READ X AT END MOVE 'Y' TO EOF ... END-PERFORM.)
  let m;
  const rre = /\bREAD\s+([A-Z0-9\-]+)/g;
  while ((m = rre.exec(UQ))) opAdd(m[1], 'read', ln);
  const wre = /\bWRITE\s+([A-Z0-9\-]+)/g;
  while ((m = wre.exec(UQ))) opAdd(m[1], 'write', ln);
  const rwre = /\bREWRITE\s+([A-Z0-9\-]+)/g;
  while ((m = rwre.exec(UQ))) opAdd(m[1], 'update', ln);
  const dre = /\bDELETE\s+([A-Z0-9\-]+)/g;
  while ((m = dre.exec(UQ))) opAdd(m[1], 'delete', ln);
  const ore = /\bOPEN\s+(INPUT|OUTPUT|I-O|EXTEND)\s+([A-Z0-9\-]+)/g;
  while ((m = ore.exec(UQ))) opAdd(m[2], m[1] === 'INPUT' ? 'read' : m[1] === 'OUTPUT' ? 'write' : 'update', ln);
  // MOVE 'lit' TO var → valeur possible pour un CALL dynamique (première valeur vue)
  const mre = /MOVE\s+'([^']*)'\s+TO\s+([A-Z0-9\-]+)/gi;
  while ((m = mre.exec(t))){
    const nm = m[2].toUpperCase();
    if (C.varLits[nm] === undefined) C.varLits[nm] = [m[1].toUpperCase()];
  }
  // PERFORM : toutes les occurrences dans la phrase — une phrase sans point
  // peut enchaîner READ ... PERFORM X ... GO TO Y (code réel). Formes inline
  // (PERFORM UNTIL / WITH TEST / VARYING / n TIMES) → aucune arête inventée.
  const PKW = /^(UNTIL|VARYING|WITH|TEST|TIMES)$/;
  const pre = /(?:^|[^A-Z0-9\-])(?:PERFORM|PERFORMS)\s+([A-Z0-9\-]+)(?:\s+(?:THRU|THROUGH)\s+([A-Z0-9\-]+))?/g;
  while ((m = pre.exec(UQ))){
    const to = m[1];
    if (PKW.test(to) || /^[0-9]+$/.test(to)) continue;
    C.performs.push({ from: para, to, thru: m[2] || null, ln });
  }
  // GO TO / GOTO : toutes les occurrences. GO TO A B C DEPENDING ON X →
  // une arête par cible (branchement dynamique, confiance 'probable').
  // GO TO au milieu d'une phrase (IF ... GO TO X) → embedded.
  const ggre = /(?:^|[^A-Z0-9\-])(?:GO\s+TO|GOTO)\s+/g;
  while ((m = ggre.exec(UQ))){
    const rest = UQ.slice(m.index + m[0].length).trim().split(/\s+/);
    const w2 = rest[0];
    if (!w2 || !IDENT.test(w2) || /^DEPENDING$/i.test(w2)) continue;
    const embedded = m.index > 0;
    const di = rest.findIndex(x => /^DEPENDING/i.test(x));
    if (di > 0){
      rest.slice(0, di).filter(x => IDENT.test(x))
        .forEach(t2 => C.gotos.push({ from: para, to: t2, ln, depending: true, embedded, src: rest.slice(0, di).join(' ') }));
    } else {
      C.gotos.push({ from: para, to: w2, ln, embedded });
    }
  }
  // CALL : littéral direct ('PGM') → certain ; variable (CALL WS-PGM) →
  // résolution dynamique via varLits dans resolveCalls
  const cre = /(?:^|[^A-Z0-9\-])CALL\s+'([^']+)'/g;
  while ((m = cre.exec(U))) C.calls.push({ target: m[1].toUpperCase(), viaVar: null, resolved: true, ln });
  const cvre = /(?:^|[^A-Z0-9\-])CALL\s+([A-Z0-9\-]+)/g;
  while ((m = cvre.exec(UQ))) C.calls.push({ target: null, viaVar: m[1].toUpperCase(), resolved: false, ln });
}

function resolveOps(C){
  // record 01 ↔ fichier FD : association par CONTEXTE (le FD courant au moment
  // de la déclaration), pas par homonymie. WRITE/REWRITE opèrent sur le NOM DE
  // RECORD, READ/OPEN/DELETE sur le nom de FICHIER — les deux doivent aboutir
  // au même fichier SELECT/FD. Tout I/O non rattaché est signalé, jamais deviné.
  const recToFile = {};
  C.selects.forEach(sl => { recToFile[sl.file] = sl.file; });
  for (const v of C.vars){
    if (v.fd) recToFile[v.name] = v.fd;
  }
  C.fileOps = C.fileOps || {};
  const merged = {};
  for (const [rec, ops] of Object.entries(C.fileOps)){
    const file = recToFile[rec] || null;
    if (!file){
      C.warns.push(`line ${ops[0].ln}: I/O on "${rec}" not attached to any SELECT/FD — relation NOT created (nothing invented)`);
      continue;
    }
    merged[file] = merged[file] || [];
    ops.forEach(o => { if (!merged[file].some(x => x.op === o.op)) merged[file].push(o); });
  }
  // EXEC CICS FILE('X') : X peut être le nom COBOL du fichier, son DDNAME
  // (SELECT ASSIGN) ou un record — sinon entrée FCT : dataset inconnu, la
  // référence reste un nœud 'fct' dans le modèle, aucune relation inventée.
  const cicsToFile = Object.assign({}, recToFile);
  C.selects.forEach(sl => { cicsToFile[sl.dd] = sl.file; });
  for (const [cf, ops] of Object.entries(C.cicsFiles || {})){
    const file = cicsToFile[cf] || null;
    if (!file) continue;
    merged[file] = merged[file] || [];
    ops.forEach(o => { if (!merged[file].some(x => x.op === o.op)) merged[file].push(o); });
  }
  C.fileOps = merged;
  C.recToFile = recToFile;
  C.cicsToFile = cicsToFile;
}

function resolveCalls(C){
  C.calls.forEach(c => {
    if (!c.resolved && c.viaVar){
      const lits = C.varLits[c.viaVar];
      if (lits && lits.length){
        c.target = lits[0];
        c.resolved = 'var';
      }
    }
  });
}

function parseCOBOL(file, text, registry){
  const C = { file, programId: null, divisions: [], sections: [], paragraphs: [], vars: [], selects: [],
    fds: [], performs: [], gotos: [], calls: [], sql: [], cics: [], cicsFiles: {}, fileOps: {}, varLits: {}, copyUsed: [], warns: [] };
  const li = cobLogicalItems(text, C.warns);
  C.fixed = cobDetectFixed(text);
  const sents0 = cobSentences(li.items);
  const ctx = { file, warns: C.warns, copyUsed: C.copyUsed };
  const sents = expandCopies(sents0, registry, ctx, []);

  let div = null, sec = null, para = null, curFd = null;
  const opAdd = (rec, op, ln) => {
    (C.fileOps[rec] = C.fileOps[rec] || []).push({ op, ln });
  };
  let pendingId = null;

  for (const s of sents){
    if (s.t === 'sql'){
      if (div === 'PROCEDURE' || div === null) sqlParse(C, s);
      else C.warns.push(`line ${s.ln}: EXEC SQL outside PROCEDURE DIVISION — ignored`);
      continue;
    }
    if (s.t === 'cics'){
      if (div === 'PROCEDURE' || div === null) cicsParse(C, s);
      else C.warns.push(`line ${s.ln}: EXEC CICS outside PROCEDURE DIVISION — ignored`);
      continue;
    }
    const t = s.text;
    const w = tkWords(t.toUpperCase().replace(/\.$/,''));
    if (!w.length) continue;
    const v = w[0];

    // divisions
    if (/DIVISION\.$/.test(t.toUpperCase()) && ['IDENTIFICATION','ENVIRONMENT','DATA','PROCEDURE'].includes(v)){
      div = v === 'ID' ? 'IDENTIFICATION' : v;
      C.divisions.push({ name: div, ln: s.ln });
      sec = null; para = null; curFd = null;
      continue;
    }
    // PROGRAM-ID (peut être suivi du nom sur la phrase suivante si point isolé)
    // PROGRAM-ID — le point peut suivre directement le mot-clé ("PROGRAM-ID. X.")
    if (/^PROGRAM-ID\b/i.test(t)){
      const m = t.match(/PROGRAM-ID[.]?\s+([A-Z0-9\-]+)/i);
      if (m && !/^DIVISION/i.test(m[1])) C.programId = m[1].toUpperCase();
      else if (!m) pendingId = true;
      continue;
    }
    if (pendingId && IDENT.test(v) && !C.programId){
      C.programId = v;
      pendingId = false;
      continue;
    }
    // sections (noms connus uniquement)
    const SECTIONS = ['CONFIGURATION','INPUT-OUTPUT','FILE-CONTROL','FILE','WORKING-STORAGE','LINKAGE','LOCAL-STORAGE','COMMUNICATION','REPORT','SCREEN'];
    if (w[1] === 'SECTION' && SECTIONS.includes(v)){
      sec = v + '-SECTION';
      C.sections.push({ name: sec, div, ln: s.ln });
      para = null; curFd = null;
      continue;
    }
    // section de PROCEDURE DIVISION (P100 SECTION.) : nœud au même titre qu'un paragraphe
    if (div === 'PROCEDURE' && w[1] === 'SECTION' && IDENT.test(v) && !SECTIONS.includes(v)){
      C.paragraphs.push({ name: v, ln: s.ln, section: true });
      para = v;
      continue;
    }
    // SELECT ... ASSIGN TO DDNAME
    if (v === 'SELECT'){
      const m = t.match(/SELECT\s+(?:OPTIONAL\s+)?([A-Z0-9\-]+)\s+ASSIGN\s+TO\s+([A-Z0-9\-]+)/i);
      if (m) C.selects.push({ file: m[1].toUpperCase(), dd: m[2].toUpperCase(), ln: s.ln });
      else {
        const m2 = t.match(/SELECT\s+(?:OPTIONAL\s+)?([A-Z0-9\-]+)/i);
        if (m2){ C.selects.push({ file: m2[1].toUpperCase(), dd: m2[1].toUpperCase(), ln: s.ln });
          C.warns.push(`line ${s.ln}: SELECT without ASSIGN — DDNAME assumed = file name`); }
        else C.warns.push(`line ${s.ln}: malformed SELECT — ignored`);
      }
      continue;
    }
    // FD
    if (v === 'FD'){
      const m = t.match(/FD\s+([A-Z0-9\-]+)/i);
      if (m){ C.fds.push(m[1].toUpperCase()); curFd = m[1].toUpperCase(); }
      continue;
    }
    // entrée de niveau (DATA DIVISION, division inconnue, ou section de données
    // rencontrée sans DIVISION explicite — lenient mais jamais inventé)
    if (/^[0-9]{1,2}$/.test(v) && (div === 'DATA' || div === null ||
        ['FILE-SECTION','WORKING-STORAGE-SECTION','LINKAGE-SECTION','LOCAL-STORAGE-SECTION','COMMUNICATION-SECTION','REPORT-SECTION','SCREEN-SECTION'].includes(sec))){
      levelEntry(C, w, s.ln, sec, sec === 'FILE-SECTION' ? curFd : null);
      continue;
    }
    // paragraphe : nom seul suivi d'un point (PROCEDURE)
    if (div === 'PROCEDURE' && w.length === 1 && IDENT.test(v) && !/^(SECTION|DIVISION|END|EXIT|STOP|GO|PERFORM|MOVE|IF|ELSE|CALL|READ|WRITE|OPEN|CLOSE|DISPLAY|COMPUTE|ADD|SUBTRACT|MULTIPLY|DIVIDE|SET|INITIALIZE|ACCEPT|EVALUATE|END-EVALUATE|WHEN|END-IF|UNTIL|VARYING|CONTINUE|RETURN)$/.test(v)){
      C.paragraphs.push({ name: v, ln: s.ln });
      para = v;
      continue;
    }
    if (div === 'PROCEDURE' || div === null) procSentence(C, t, s, para, opAdd);
  }
  if (!C.programId) C.warns.push('PROGRAM-ID not found');
  // cibles PERFORM / GO TO introuvables : signalées, aucune arête inventée
  const knownParas = new Set(C.paragraphs.map(p=>p.name));
  C.performs.forEach(p => {
    if (p.to && !knownParas.has(p.to)) C.warns.push(`line ${p.ln}: PERFORM ${p.to} — paragraph/section not found → no edge created`);
    if (p.thru && !knownParas.has(p.thru)) C.warns.push(`line ${p.ln}: PERFORM ... THRU ${p.thru} — target not found`);
  });
  C.gotos.forEach(g => {
    if (g.to && !knownParas.has(g.to)) C.warns.push(`line ${g.ln}: GO TO ${g.to} — target not found → no edge created`);
  });
  resolveOps(C);
  resolveCalls(C);
  return C;
}

// ══════════════════ 1c. MODÈLE & GRAPHE (typé, preuves, confiance) ══════════════════
// Nœuds 'type|nom' (job, step, prog, cpy, ds, tbl, xpgm) ; arêtes {f,t,k,c,ev}
// avec kinds exec/contains/read/write/update/unknown/uses/call/sql-*, conf
// certain/probable/unknown et preuves [{file,ln,note}]. ID typés → pas de
// collision entre un dataset et un programme homonymes.

// Le nom d'un job n'est désambiguïsé (name[file]) que s'il existe dans PLUSIEURS
// fichiers uploadés — sinon le nom brut est conservé. Le résultat est
// précalculé une fois : toutes les boucles (JCL, COBOL, backrefs) obtiennent
// exactement le même identifiant pour un job donné.

const CONF_RANK = { certain: 3, probable: 2, unknown: 1 };
function buildModel(files){
  linkCatalogedProcs();
  const nodes = new Map();
  const edges = [];
  const fwd = {}, rev = {};
  const addNode = (type, name, data) => {
    const id = type + '|' + name;
    if (!nodes.has(id)) nodes.set(id, { id, type, name, data: data || {} });
    return nodes.get(id);
  };
  const eIdx = new Map();
  const addEdge = (f, t, k, c, ev) => {
    // déduplication O(1) : même (from,to,kind) → fusion preuves, confiance la plus forte garde la main
    const key = f + '\u0001' + t + '\u0001' + k;
    const ex = eIdx.get(key);
    if (ex){
      if ((CONF_RANK[c] || 0) > (CONF_RANK[ex.c] || 0)) ex.c = c;
      (ev || []).forEach(x => { if (!ex.ev.some(y => y.note === x.note)) ex.ev.push(x); });
      return ex;
    }
    const e = { f, t, k, c: c || 'certain', ev: ev || [] };
    edges.push(e);
    eIdx.set(key, e);
    (fwd[f] = fwd[f] || []).push(e);
    (rev[t] = rev[t] || []).push(e);
    return e;
  };
  const m = { nodes, edges, fwd, rev, warnings: [], internal: {}, unknownCalls: [] };
  // pré-pass : nom effectif de chaque job, stable pour toutes les boucles
  const nameFiles = new Map();
  files.forEach(f => { if (f.lang === 'JCL') (f.parsed.jobs || []).forEach(jb => {
    const nm = jb.name || base(f.name);
    if (!nameFiles.has(nm)) nameFiles.set(nm, new Set());
    nameFiles.get(nm).add(f.name);
  }); });
  const jnameOf = (jb, f) => {
    const nm = jb.name || base(f.name);
    const fs = nameFiles.get(nm);
    return (fs && fs.size > 1) ? nm + '[' + f.name + ']' : nm;
  };

  // ── JCL ── (structure moteur JCL v2 : step.target/kind/line,
  //            dd.ddname/name/usage input|output|unknown/temp/backref/gdg/line)
  const OP_MAP = { input:'read', output:'write', unknown:'unknown' };
  const resolveDD = (jb, d) => {
    // dataset effectif d'un DD — suit un backref *.STEP.DD (1 hop) ou *.PROCSTEP.STEP.DD (3 parties)
    if (!d.name) return null;
    if (!d.backref) return { name: d.name, temp: !!d.temp, gdg: d.gdg, via: null };
    const parts = String(d.name).split('.');
    if (parts.length >= 4){
      // *.PROCSTEP.STEP.DD — le step appelant a été expandu : copies identifiées par 'via'
      const inner = (jb.steps || []).find(s => s.via === parts[1] && s.name === parts[2]);
      const src = inner && (inner.dds || []).find(x => (x.ddname || '').toUpperCase() === String(parts[3] || '').toUpperCase());
      if (src && src.name && !src.backref) return { name: src.name, temp: !!src.temp, gdg: src.gdg, via: d.name };
      return null;
    }
    const srcStep = parts[1], srcDD = parts[2];
    const st = (jb.steps || []).find(s => s.name === srcStep);
    const src = st && (st.dds || []).find(x => (x.ddname || '').toUpperCase() === String(srcDD || '').toUpperCase());
    if (src && src.name && !src.backref) return { name: src.name, temp: !!src.temp, gdg: src.gdg, via: d.name };
    return null;
  };
  files.forEach(f => {
    if (f.lang !== 'JCL') return;
    (f.parsed.jobs || []).forEach(jb => {
      const jname = jnameOf(jb, f);
      addNode('job', jname, { file: f.name });
      (jb.steps || []).forEach(st => {
        const sid = 'step|' + jname + '.' + st.name;
        addNode('step', jname + '.' + st.name, { job: jname, pgm: st.target, kind: st.kind });
        addEdge('job|' + jname, sid, 'contains', 'certain', [{ file: f.name, ln: st.line, note: 'EXEC ' + (st.target || '?') }]);
        // EXEC PGM → prog (uploadé) ou xpgm (externe) ; PROC non résolue → avertissement, jamais d'arête inventée
        if (st.kind === 'PGM' && st.target){
          const isCbl = files.some(x => x.lang === 'CBL' && x.parsed.cobol && x.parsed.cobol.programId === st.target);
          const pid = (isCbl ? 'prog|' : 'xpgm|') + st.target;
          addNode(isCbl ? 'prog' : 'xpgm', st.target, { file: isCbl ? files.find(x => x.lang==='CBL' && x.parsed.cobol && x.parsed.cobol.programId===st.target).name : null });
          addEdge(sid, pid, 'exec', 'certain', [{ file: f.name, ln: st.line, note: 'EXEC PGM=' + st.target }]);
        } else if (st.kind === 'PROC'){
          if (st.resolved === false) m.warnings.push('PROC ' + st.target + ' in ' + jname + '.' + st.name + ' not uploaded — cannot be expanded');
          else if (st.target) addEdge(sid, 'xpgm|' + st.target, 'exec', 'unknown', [{ file: f.name, ln: st.line, note: 'EXEC PROC=' + st.target }]);
        }
        (st.dds || []).forEach(d => {
          if (!d.name || d.backref) return; // backrefs résolus plus bas ; SYSOUT/DUMMY sans DSN ignorés
          const op = OP_MAP[d.usage] || 'unknown';
          const dsNode = addNode('ds', d.name, { temp: !!d.temp || String(d.name).startsWith('&&'), gdg: d.gdg != null ? d.gdg : null });
          addEdge(sid, dsNode.id, op, op === 'unknown' ? 'unknown' : 'probable',
            [{ file: f.name, ln: d.line, note: 'DD ' + d.ddname + ' DSN=' + d.name + (d.disp ? ' DISP=' + d.disp + ' — direction from DISP only, not confirmed by program I/O' : ' (no DISP)') }]);
          if (op === 'unknown') m.warnings.push('dataset ' + d.name + ': usage unclear (no DISP, no matching program) — flagged, not guessed');
        });
      });
    });
  });

  // ── COBOL ──
  files.forEach(f => {
    if (f.lang !== 'CBL' && f.lang !== 'CPY') return;
    const C = f.parsed.cobol;
    if (!C) return;
    if (f.lang === 'CBL' && C.programId){
      const pid = 'prog|' + C.programId;
      addNode('prog', C.programId, { file: f.name });
      // copybooks
      C.copyUsed.forEach(cu => {
        const cnode = addNode('cpy', cu.name, { file: cu.file || null });
        const resolved = cu.resolved;
        addEdge(pid, cnode.id, 'uses', resolved ? 'certain' : 'unknown', [{ file: f.name, ln: cu.ln, note: 'COPY ' + cu.name + (resolved ? '' : ' (not uploaded)') }]);
      });
      // CALLs
      C.calls.forEach(c => {
        if (!c.target) return;
        const isCbl = files.some(x => x.lang === 'CBL' && x.parsed.cobol && x.parsed.cobol.programId === c.target);
        const tid = (isCbl ? 'prog|' : 'xpgm|') + c.target;
        addNode(isCbl ? 'prog' : 'xpgm', c.target, { file: isCbl ? files.find(x => x.lang==='CBL' && x.parsed.cobol && x.parsed.cobol.programId===c.target).name : null });
        const conf = c.resolved === true ? 'certain' : c.resolved === 'var' ? 'probable' : 'unknown';
        addEdge(pid, tid, 'call', conf, [{ file: f.name, ln: c.ln, note: 'CALL ' + (c.viaVar ? c.viaVar + ' (dynamic)' : c.target) }]);
        if (conf === 'unknown') m.unknownCalls.push(c);
      });
      // DDNAME ↔ SELECT : lien certain si un verbe I/O existe (backrefs résolus)
      C.selects.forEach(sl => {
        C.fileOps[sl.file] && C.fileOps[sl.file].forEach(op => {
          // retrouver les steps qui référencent ce DDNAME (dans les jobs)
          files.forEach(jf => {
            if (jf.lang !== 'JCL') return;
            (jf.parsed.jobs || []).forEach(jb => {
              (jb.steps || []).forEach(st => {
                if (String(st.target || '').toUpperCase() !== C.programId) return; // le step doit exécuter CE programme (les DDNAME sont locaux à un step)
                (st.dds || []).forEach(d => {
                  if ((d.ddname || '').toUpperCase() !== sl.dd) return;
                  const r = resolveDD(jb, d);
                  if (!r) return;
                  const dsNode = addNode('ds', r.name, { temp: r.temp, gdg: r.gdg });
                  const ev = [
                    { file: jf.name, ln: d.line, note: 'JCL: DD ' + d.ddname + ' DSN=' + (r.via ? r.via + ' → ' + r.name : r.name) },
                    { file: f.name, ln: sl.ln, note: 'COBOL: SELECT ' + sl.file + ' ASSIGN TO ' + sl.dd },
                    { file: f.name, ln: op.ln, note: op.cics ? 'COBOL: EXEC CICS ' + op.cics + ' FILE(' + (op.cicsFile || sl.file) + ')' : 'COBOL: ' + op.op.toUpperCase() + ' ' + sl.file }
                  ];
                  addEdge('step|' + jnameOf(jb, jf) + '.' + st.name, dsNode.id, op.op, 'certain', ev);
                });
              });
            });
          });
        });
      });
      // SQL → tables (opération reconnue uniquement ; type inconnu déjà signalé par le parseur)
      C.sql.forEach(x => {
        if (!['read','write','update'].includes(x.op)) return;
        x.tables.forEach(tb => {
          const tn = addNode('tbl', tb, {});
          addEdge(pid, tn.id, 'sql-' + x.op, 'certain', [{ file: f.name, ln: x.ln, note: 'EXEC SQL ' + x.op.toUpperCase() + ' — ' + tb }]);
        });
      });
      // EXEC CICS : programmes liés (XCTL/LINK), maps, queues, fichiers FCT
      // non rattachés. La référence est certaine (elle est écrite dans le
      // code) ; ce qui est inconnu (dataset derrière une FCT) reste inconnu.
      C.cics.forEach(e => {
        if (e.program){
          const tgt = files.find(x => x.lang === 'CBL' && x.parsed.cobol && x.parsed.cobol.programId === e.program);
          const tid = (tgt ? 'prog|' : 'xpgm|') + e.program;
          addNode(tgt ? 'prog' : 'xpgm', e.program, { file: tgt ? tgt.name : null });
          addEdge(pid, tid, 'call', 'certain', [{ file: f.name, ln: e.ln, note: 'EXEC CICS ' + e.cmd + ' PROGRAM(' + e.program + ')' }]);
        }
        if (e.map){
          const mnode = addNode('map', e.map, {});
          addEdge(pid, mnode.id, 'uses', 'certain', [{ file: f.name, ln: e.ln, note: 'EXEC CICS ' + e.cmd + ' MAP(' + e.map + ')' }]);
        }
        if (e.queue){
          const qnode = addNode('q', e.queue, { qtype: e.qtype });
          addEdge(pid, qnode.id, e.op, 'certain', [{ file: f.name, ln: e.ln, note: 'EXEC CICS ' + e.cmd + (e.qtype ? ' ' + e.qtype : '') + ' QUEUE(' + e.queue + ')' }]);
        }
        if (e.op && e.file && !(C.cicsToFile && C.cicsToFile[e.file])){
          const fnode = addNode('fct', e.file, {});
          addEdge(pid, fnode.id, e.op, 'certain', [{ file: f.name, ln: e.ln, note: 'EXEC CICS ' + e.cmd + ' FILE(' + e.file + ') — FCT entry, dataset unknown' }]);
        }
      });
      // flux interne pour le panneau flow
      const inn = { paragraphs: C.paragraphs, edges: [] };
      C.performs.forEach(p => inn.edges.push({ from: p.from, to: p.to, k: 'perform', ln: p.ln }));
      C.gotos.forEach(g => inn.edges.push({ from: g.from, to: g.to, k: 'goto', ln: g.ln }));
      m.internal[C.programId] = inn;
      // paragraphes/sections = nœuds du graphe (impact navigable : job → step → prog → para)
      const paraIds = new Set(C.paragraphs.map(p=>p.name));
      C.paragraphs.forEach(p => {
        const pnode = addNode('para', C.programId + '.' + p.name, { program: C.programId, ln: p.ln, section: !!p.section });
        addEdge(pid, pnode.id, 'contains', 'certain', [{ file: f.name, ln: p.ln, note: p.section ? 'section header' : 'paragraph' }]);
      });
      const pEdge = (from, to, k, conf, note, ln2) => {
        if (!from || !paraIds.has(from) || !paraIds.has(to) || from === to) return;
        addEdge('para|' + C.programId + '.' + from, 'para|' + C.programId + '.' + to, k, conf, [{ file: f.name, ln: ln2, note }]);
      };
      C.performs.forEach(pr => {
        pEdge(pr.from, pr.to, 'perform', 'certain', 'PERFORM ' + pr.to + (pr.thru ? ' THRU ' + pr.thru : ''), pr.ln);
        if (pr.thru) pEdge(pr.from, pr.thru, 'perform', 'certain', 'PERFORM ' + pr.to + ' THRU ' + pr.thru, pr.ln);
      });
      C.gotos.forEach(g => {
        pEdge(g.from, g.to, 'goto', g.depending ? 'probable' : 'certain', g.depending ? 'GO TO (DEPENDING ON — branch)' : 'GO TO', g.ln);
      });
    }
    if (f.lang === 'CPY'){
      addNode('cpy', base(f.name), { file: f.name });
    }
  });

  // backrefs : *.STEP.DD → dataset réel du step source (usage JCL seul, sans preuve COBOL → probable)
  files.forEach(f => {
    if (f.lang !== 'JCL') return;
    (f.parsed.jobs || []).forEach(jb => {
      const jname = jnameOf(jb, f);
      (jb.steps || []).forEach(st => {
        const sid = 'step|' + jname + '.' + st.name;
        (st.dds || []).forEach(d => {
          if (!d.backref) return;
          const r = resolveDD(jb, d);
          const op = OP_MAP[d.usage] || 'unknown';
          if (r){
            const dsNode = addNode('ds', r.name, { temp: r.temp, gdg: r.gdg });
            addEdge(sid, dsNode.id, op, op === 'unknown' ? 'unknown' : 'probable', [
              { file: f.name, ln: d.line, note: 'DD ' + d.ddname + ' DSN=' + d.name },
              { file: f.name, ln: d.line, note: 'resolves to ' + r.name }
            ]);
          } else {
            m.warnings.push('backref ' + d.name + ' in ' + jname + '.' + st.name + ' could not be resolved (source step/DD not found)');
          }
        });
      });
    });
  });

  return m;
}

function impact(model, id){
  // BFS amont/aval, profondeur ≤ 12, plus court chemin par nœud,
  // confiance = la plus faible le long du chemin.
  const up = { direct: [], indirect: [] };
  const down = { direct: [], indirect: [] };
  const adj = model.fwd, radj = model.rev;
  const walk = (graph, bucket, dir) => {
    const seen = new Map();
    const q = [{ id, depth: 0, path: [id], edge: null, conf: 'certain' }];
    while (q.length){
      const cur = q.shift();
      if (cur.depth >= 12) continue;
      const list = (dir === 'fwd' ? (adj[cur.id]||[]) : (radj[cur.id]||[]));
      for (const e of list){
        const next = dir === 'fwd' ? e.t : e.f;
        if (next === id) continue;
        const conf = e.c === 'certain' ? cur.conf : (cur.conf === 'certain' ? e.c : (cur.conf === 'probable' && e.c === 'certain' ? 'probable' : 'unknown'));
        const path = cur.path.concat([next]);
        if (seen.has(next)){
          const ex = seen.get(next);
          if (path.length >= ex.path.length) continue;
        }
        seen.set(next, { id: next, depth: cur.depth + 1, path, edge: e, conf });
        (cur.depth + 1 === 1 ? bucket.direct : bucket.indirect).push(seen.get(next));
        q.push({ id: next, depth: cur.depth + 1, path, edge: e, conf });
      }
    }
  };
  walk(adj, down, 'fwd');
  walk(radj, up, 'rev');
  return { up, down };
}

function getModel(){
  if (!state._model){
    // re-parse des COBOL dont un copybook manquant est arrivé ensuite
    let changed = true, guard = 0;
    while (changed && guard < 5){
      changed = false; guard++;
      const reg = cobRegistry();
      state.files.forEach(f => {
        // INCLUDE JCL : re-parse si un membre manquant est arrivé depuis
        if (f.lang === 'JCL' && (f.parsed.warnings||[]).some(w => {
          const mm = /INCLUDE member ([A-Z0-9@$.]+) not uploaded/.exec(w);
          return mm && jclMembers(f.name)[mm[1]] !== undefined;
        })){
          parseFile(f);
          changed = true;
        }
        if (f.lang !== 'CBL' || !f.parsed.cobol) return;
        if ((f.parsed.cobol.copyUsed||[]).some(c => !c.resolved && reg[c.name])){
          parseFile(f);
          changed = true;
        }
      });
    }
    state._model = buildModel(state.files);
  }
  return state._model;
}

function confBadge(c){
  const map = { certain:['var(--green)','certain'], probable:['var(--yellow)','probable'], unknown:['var(--text3)','unclear'] };
  const x = map[c] || map.unknown;
  return `<span class="pill" style="color:${x[0]};border:1px solid ${x[0]}">${x[1]}</span>`;
}
function opBadge(op){
  const map = { read:['var(--cyan)','READ'], write:['var(--green)','WRITE'], update:['var(--purple)','UPDATE'], delete:['var(--red)','DELETE'], unknown:['var(--text3)','UNKNOWN'] };
  const x = map[op] || map.unknown;
  return `<span class="pill" style="color:${x[0]};border:1px solid ${x[0]}">${x[1]}</span>`;
}
function evHTML(ev){
  if (!ev || !ev.length) return '';
  return `<div class="note" style="margin-top:4px;color:var(--text3)">${ev.map(e=>esc(e.file + ' L' + (e.ln||'?') + ': ' + e.note)).join(' · ')}</div>`;
}
const EDGE_VERB = { exec:'executes', contains:'contains step', read:'reads', write:'writes', update:'updates', unknown:'usage unclear', uses:'uses copybook', call:'calls', 'sql-read':'SELECTs', 'sql-write':'INSERTs/DELETEs', 'sql-update':'UPDATEs', perform:'PERFORMs', goto:'branches to (GO TO)', delete:'deletes records in' };
function impNodeId(i){ const ns = [...getModel().nodes.values()].filter(n => n.type !== 'step'); return ns[+i] ? ns[+i].id : null; }

// ══════════════════ SELF-TESTS (suite de tests intégrée) ══════════════════
function runSelfTests(){
  const out = [];
  const T = (name, cond) => out.push({ name, pass: !!cond });
  try {
    const PAYREC = ['01  PAY-RECORD.','    05  ACC-ID      PIC 9(8).','    COPY INNER.'].join('\n');
    const INNER  = '05  INNER-FLD PIC X(4).';
    const reg = { PAYREC:{text:PAYREC,file:'PAYREC.CPY'}, INNER:{text:INNER,file:'INNER.CPY'} };
    const F1 = ['000100 IDENTIFICATION DIVISION.','000200 PROGRAM-ID. CBPAY100.','000300 ENVIRONMENT DIVISION.','000400 INPUT-OUTPUT SECTION.','000500 FILE-CONTROL.','000600     SELECT TRANS-FILE ASSIGN TO TRANS.','000700 DATA DIVISION.','000800 FILE SECTION.','000900 FD  TRANS-FILE.','001000 01  TRANS-RECORD.','001100     COPY PAYREC.','001200 WORKING-STORAGE SECTION.','001300 01  WS-HOURS      PIC 9(4)V99.','001400 01  WS-PGM        PIC X(8).','001700 PROCEDURE DIVISION.','001800 MAIN-PARA.','001900     PERFORM INIT-PARA.','002000     MOVE \'SUBPGM\' TO WS-PGM.','002100     CALL WS-PGM.','002200     CALL \'CBPAY200\'.','002300     GO TO END-PARA.','002400 INIT-PARA.','002500     OPEN INPUT TRANS-FILE.','002600     READ TRANS-FILE.','002900 END-PARA.','003000     EXEC SQL','003100         SELECT ACC_ID FROM PAYROLL.ACCOUNTS A, PAYROLL.HIST','003200     END-EXEC','003400     EXEC SQL INSERT INTO PAYHIST VALUES (:X) END-EXEC'].join('\n');
    const C1 = parseCOBOL('CBPAY100.CBL', F1, reg);
    T('COBOL: fixed format detected', C1.fixed === true);
    T('COBOL: PROGRAM-ID', C1.programId === 'CBPAY100');
    T('COBOL: SELECT ASSIGN', C1.selects.length === 1 && C1.selects[0].dd === 'TRANS');
    T('COBOL: PIC clause', (C1.vars.find(v=>v.name==='WS-HOURS')||{}).pic === '9(4)V99');
    T('COBOL: COPY spliced into vars', !!C1.vars.find(v=>v.name==='ACC-ID'));
    T('COBOL: nested COPY resolved', !!C1.vars.find(v=>v.name==='INNER-FLD'));
    T('COBOL: PERFORM target', ((C1.performs.find(p=>p.to==='INIT-PARA')||{}).from) === 'MAIN-PARA');
    T('COBOL: dynamic CALL resolved from MOVE', (C1.calls.find(c=>c.viaVar==='WS-PGM')||{}).target === 'SUBPGM');
    T('COBOL: I/O verb on file', (C1.fileOps['TRANS-FILE']||[]).some(o=>o.op==='read'));
    const reads = C1.sql.filter(x=>x.op==='read').flatMap(x=>x.tables);
    T('SQL: FROM tables + alias list', reads.includes('PAYROLL.ACCOUNTS') && reads.includes('PAYROLL.HIST'));
    T('SQL: INSERT INTO table', C1.sql.filter(x=>x.op==='write').flatMap(x=>x.tables).includes('PAYHIST'));
    const F2 = ['IDENTIFICATION DIVISION.','PROGRAM-ID. FREEPGM.','WORKING-STORAGE SECTION.','COPY PAYREC REPLACING ==PAY-== BY ==FR-==.','COPY MISSING1.','PROCEDURE DIVISION.'].join('\n');
    const C2 = parseCOBOL('F2.CBL', F2, reg);
    T('COBOL: REPLACING applied', !!C2.vars.find(v=>v.name==='FR-RECORD'));
    T('COBOL: missing copybook warned, not invented', C2.warns.some(w=>w.includes('MISSING1')));
    const JCLT = ['//PAYRUN0  JOB  (ACCT),\'PAY\',CLASS=A','//STEP010  EXEC PGM=SORT','//SORTIN   DD DSN=PAYROLL.TRANS,DISP=SHR','//SORTOUT  DD DSN=&&SORTED,DISP=(,PASS)','//STEP020  EXEC PGM=CBPAY100','//TRANS    DD DSN=*.STEP010.SORTOUT,DISP=OLD','//OUTDS    DD DSN=PAYROLL.MASTER(+1),DISP=(,CATLG)','//STEP030  EXEC PGM=CBPAY200','//PAYMAST  DD DSN=PAYROLL.MASTER,DISP=OLD','//NODISP   DD DSN=NODISP.DATA'].join('\n');
    const mfiles = [
      { name:'PAYRUN0.JCL', lang:'JCL', text:JCLT },
      { name:'CBPAY100.CBL', lang:'CBL', text:F1 },
      { name:'PAYREC.CPY', lang:'CPY', text:PAYREC },
    ];
    mfiles.forEach(f => {
      if (f.lang === 'JCL'){
        const res = parseJCL(f.text);
        if (!res.jobs.length && !Object.keys(res.procs).length) res.jobs.push({ name: base(f.name), steps: [], procsUsed: [], params: {} });
        f.parsed = { jobs: res.jobs, procs: res.procs, warnings: res.warnings };
      } else {
        const C = parseCOBOL(f.name, f.text, reg);
        f.parsed = { cobol: C, warnings: C.warns, programId: C.programId,
          copies: C.copyUsed.map(c=>({name:c.name, resolved:!!c.resolved})),
          sqlCount: C.sql.length, performs: C.performs.length, gotos: C.gotos.length };
      }
    });
    const M = buildModel(mfiles);
    const E = M.edges;
    const has = (f,t,k) => E.some(e => e.f===f && e.t===t && e.k===k);
    T('GRAPH: exec step→prog', has('step|PAYRUN0.STEP020','prog|CBPAY100','exec'));
    T('GRAPH: SELECT+READ → certain read (backref)', (E.find(e=>e.f==='step|PAYRUN0.STEP020'&&e.t==='ds|&&SORTED'&&e.k==='read')||{}).c === 'certain');
    T('GRAPH: DISP-only → probable input', (E.find(e=>e.f==='step|PAYRUN0.STEP010'&&e.t==='ds|PAYROLL.TRANS'&&e.k==='read')||{}).c === 'probable');
    T('GRAPH: no DISP → unknown, flagged not guessed', has('step|PAYRUN0.STEP030','ds|NODISP.DATA','unknown'));
    T('GRAPH: program uses copybook', has('prog|CBPAY100','cpy|PAYREC','uses'));
    T('GRAPH: SQL table edge', has('prog|CBPAY100','tbl|PAYROLL.ACCOUNTS','sql-read'));
    const imp = impact(M, 'cpy|PAYREC');
    T('IMPACT: copybook → program direct', imp.up.direct.length === 1 && imp.up.direct[0].id === 'prog|CBPAY100');
    const jobHit = imp.up.indirect.find(x => x.id === 'job|PAYRUN0');
    T('IMPACT: copybook → job indirect via full path', !!jobHit && jobHit.path.length === 4);
    const imp2 = impact(M, 'prog|CBPAY100');
    T('IMPACT: program upstream direct = executing step', imp2.up.direct.some(x => x.id === 'step|PAYRUN0.STEP020'));
    T('GRAPH: no duplicate edges (conf dedup + evidence merge)', !E.some((e,i)=>E.slice(i+1).some(x=>x.f===e.f&&x.t===e.t&&x.k===e.k)));
  } catch (err){
    out.push({ name: 'self-test crashed: ' + err.message, pass: false });
  }
  return out;
}

// ══════════════════ SELF-TESTS V2 (suite indépendante : FD/01, continuations, SQL, JCL, XSS) ══════════════════
// Cas complexes absents des exemples de l'app — chaque cas reproduit un défaut
// réel corrigé en V2. L'état de l'utilisateur est sauvegardé puis restauré.
function runV2Tests(){
  const out = [];
  const T = (name, cond) => out.push({ name, pass: !!cond });
  const bak = { files: state.files, loaded: state.loaded, log: state.log, entity: state.entity,
    srcIdx: state.srcIdx, srcFile: state.srcFile, group: state.group, sub: state.sub };
  try {
    // ── 1. COBOL : FD ↔ 01, verbes I/O, commentaires, continuation de littérale ──
    const CV2 = [
      "000100 IDENTIFICATION DIVISION.",
      "000200 PROGRAM-ID. BANKUPD.",
      "000300 ENVIRONMENT DIVISION.",
      "000400 INPUT-OUTPUT SECTION.",
      "000500 FILE-CONTROL.",
      "000600     SELECT MASTER-FILE ASSIGN TO MASTDD.",
      "000700 DATA DIVISION.",
      "000800 FILE SECTION.",
      "000900 FD  MASTER-FILE.",
      "001000 01  MAST-REC.",
      "001100     05  MAST-ID  PIC X(8).",
      "001200 WORKING-STORAGE SECTION.",
      "001300 01  WS-BUF PIC X(80).",
      "001400 01  WS-LIT PIC X(10) VALUE 'ABC",
      "001500-    'DEF'.",
      "001600 PROCEDURE DIVISION.",
      "001700 INIT-S SECTION.",
      "001800     PERFORM READ-S.",
      "001900 READ-S.",
      "002000     READ MASTER-FILE AT END MOVE 'Y' TO EOF",
      "002100     MOVE 'OK' TO WS-BUF *> commentaire flottant",
      "002200     WRITE MAST-REC FROM WS-BUF",
      "002300     REWRITE MAST-REC",
      "002400     DELETE MASTER-FILE",
      "002500     WRITE GHOST-REC",
      "002600     PERFORM NOWHERE-PARA",
      "002700     GO TO INIT-S READ-S DEPENDING ON WS-SEL",
      "002800     STOP RUN."
    ].join("\n");
    const C2 = parseCOBOL('BANKUPD.CBL', CV2, {});
    T('V2 FD/01: WRITE sur le record → fichier FD', (C2.fileOps['MASTER-FILE']||[]).some(o=>o.op==='write'));
    T('V2 FD/01: REWRITE sur le record → update', (C2.fileOps['MASTER-FILE']||[]).some(o=>o.op==='update'));
    T('V2 FD/01: DELETE sur le fichier', (C2.fileOps['MASTER-FILE']||[]).some(o=>o.op==='delete'));
    T('V2 FD/01: READ fichier conservé', (C2.fileOps['MASTER-FILE']||[]).some(o=>o.op==='read'));
    T('V2 I/O non rattaché → averti, aucune relation inventée', C2.warns.some(w=>w.includes('GHOST-REC')) && !Object.keys(C2.fileOps).some(k=>k.includes('GHOST')));
    T('V2 commentaire flottant *> ignoré', !!C2.vars.find(v=>v.name==='WS-BUF') && C2.paragraphs.length===2);
    T('V2 littérale continuée (col 7 = -)', ((C2.vars.find(v=>v.name==='WS-LIT')||{}).value)==='ABCDEF');
    T('V2 section de PROCEDURE reconnue', C2.paragraphs.some(p=>p.name==='INIT-S'&&p.section===true));
    T('V2 GO TO ... DEPENDING multi-cibles', C2.gotos.filter(g=>g.depending).length===2 && C2.gotos.some(g=>g.to==='READ-S'&&g.depending));
    T('V2 PERFORM cible introuvable → warning', C2.warns.some(w=>w.includes('NOWHERE-PARA')));

    // ── 2. COPY REPLACING (formes mot et LEADING) ──
    const REG2 = { CPYL:{ text:"01  OLD-REC.\n    05  OLD-FIELD PIC X(3).", file:'CPYL.CPY' },
                   CPY2:{ text:"01  OLD-REC.\n    05  XOLD-FIELD PIC X(3).", file:'CPY2.CPY' } };
    const C3 = parseCOBOL('T3.CBL', "IDENTIFICATION DIVISION.\nPROGRAM-ID. T3.\nWORKING-STORAGE SECTION.\nCOPY CPYL REPLACING OLD BY NEW.\nPROCEDURE DIVISION.", REG2);
    T('V2 COPY REPLACING forme mot (OLD BY NEW)', !!C3.vars.find(v=>v.name==='NEW-REC') && !!C3.vars.find(v=>v.name==='NEW-FIELD'));
    const C4 = parseCOBOL('T4.CBL', "IDENTIFICATION DIVISION.\nPROGRAM-ID. T4.\nWORKING-STORAGE SECTION.\nCOPY CPY2 REPLACING TRAILING OLD BY NEW.\nPROCEDURE DIVISION.", REG2);
    T('V2 COPY REPLACING TRAILING (XOLD-FIELD → XNEW-FIELD)', !!C4.vars.find(v=>v.name==='XNEW-FIELD'));
    const C4b = parseCOBOL('T4B.CBL', "IDENTIFICATION DIVISION.\nPROGRAM-ID. T4B.\nWORKING-STORAGE SECTION.\nCOPY CPY2 REPLACING LEADING OLD BY NEW.\nPROCEDURE DIVISION.", REG2);
    T('V2 COPY REPLACING LEADING : aucun faux positif (XOLD-FIELD non préfixé inchangé)', !C4b.vars.find(v=>v.name==='XNEW-FIELD') && !!C4b.vars.find(v=>v.name==='XOLD-FIELD'));

    // ── 3. SQL : JOIN/sous-requête/CTE, MERGE, guillemets, SQL dynamique ──
    const C5 = parseCOBOL('T5.CBL', "IDENTIFICATION DIVISION.\nPROGRAM-ID. T5.\nPROCEDURE DIVISION.\n    EXEC SQL SELECT A.ID, B.ID FROM SCHEMA.T1 AS A INNER JOIN SCHEMA.T2 B ON A.ID = B.ID WHERE EXISTS (SELECT 1 FROM T3 WHERE T3.X = 1) END-EXEC.\n    EXEC SQL MERGE INTO PAYHIST T USING (SELECT ID FROM STAGE) S ON T.ID = S.ID WHEN MATCHED THEN UPDATE SET A = 1 END-EXEC.\n    EXEC SQL INSERT INTO \"MY TABLE\" (A) VALUES (1) END-EXEC.\n    EXEC SQL WITH CTE1 AS (SELECT ID FROM REALT) SELECT * FROM CTE1 JOIN T4B ON CTE1.ID = T4B.ID END-EXEC.\n    EXEC SQL PREPARE STM FROM :WS-SQL END-EXEC.\n    EXEC SQL INCLUDE SQLCA END-EXEC.\n    EXEC SQL WHENEVER NOT FOUND CONTINUE END-EXEC.\n    STOP RUN.", {});
    const s0 = C5.sql[0]||{}, s1 = C5.sql[1]||{}, s2 = C5.sql[2]||{}, s3 = C5.sql[3]||{}, s4 = C5.sql[4]||{}, s5 = C5.sql[5]||{};
    T('V2 SQL: JOIN + sous-requête EXISTS', s0.op==='read' && ['SCHEMA.T1','SCHEMA.T2','T3'].every(t=>s0.tables.includes(t)));
    T('V2 SQL: MERGE INTO → update + tables', s1.op==='update' && s1.tables.includes('PAYHIST') && s1.tables.includes('STAGE'));
    T('V2 SQL: identifiant entre guillemets', s2.op==='write' && s2.tables.includes('MY TABLE'));
    T('V2 SQL: CTE exclue, tables réelles détectées', s3.op==='read' && s3.tables.includes('REALT') && s3.tables.includes('T4B') && !s3.tables.includes('CTE1'));
    T('V2 SQL: PREPARE dynamique → 0 table + warning explicite', s4.op==='dynamic' && s4.tables.length===0 && C5.warns.some(w=>w.includes('dynamic SQL')));
    T('V2 SQL: INCLUDE SQLCA / WHENEVER silencieux', s5.op==='other' && !C5.warns.some(w=>w.includes('SQLCA')));

    // ── 4. JCL : PROC imbriqués, continuation, in-stream, IF/THEN, INCLUDE ──
    const JV2 = [
      "//JOBV2   JOB 1,'X'",
      "//OUTER   PROC X=1",
      "//OS1     EXEC PGM=PA",
      "//DD1     DD DSN=A.B,DISP=SHR",
      "//INNER   PROC Y=2",
      "//IS1     EXEC PGM=PB",
      "//         PEND",
      "//OS2     EXEC PGM=PC",
      "//         PEND",
      "//CALL1   EXEC PROC=OUTER",
      "//STEPX   EXEC PGM=PX",
      "//DD2     DD DSN=X.Y,",
      "//         DISP=SHR",
      "//STEP3   EXEC PGM=P3",
      "//SYSIN   DD *",
      "RANDOM TEXT EXEC LIKE CONTENT",
      "//IFSTEP  IF (RC=0) THEN",
      "//NEXT    EXEC PGM=P4",
      "//ENDSTEP ENDIF"
    ].join("\n");
    const J2 = parseJCL(JV2);
    T('V2 JCL: PROC imbriqués in-stream (OUTER/INNER)', !!J2.procs.OUTER && !!J2.procs.INNER && J2.procs.OUTER.steps.length===2 && J2.procs.INNER.steps.length===1);
    T('V2 JCL: PROC expandu au point d\'appel', J2.jobs[0].steps.length===5 && J2.jobs[0].steps[0].target==='PA' && J2.jobs[0].steps[0].via==='CALL1');
    T('V2 JCL: continuation de paramètres (DSN/DISP sur 2 lignes)', (()=>{ const dd=(J2.jobs[0].steps.find(s=>s.name==='STEPX')||{dds:[]}).dds.find(d=>d.ddname==='DD2'); return !!dd && dd.name==='X.Y' && dd.usage==='input'; })());
    T('V2 JCL: in-stream DD * non confondu avec du JCL', (()=>{ const st=J2.jobs[0].steps.find(s=>s.name==='STEP3')||{dds:[]}; return st.dds.some(d=>d.ddname==='SYSIN') && J2.jobs[0].steps.some(s=>s.name==='NEXT') && !J2.warnings.some(w=>w.includes('RANDOM')||w.includes('unrecognized')); })());
    T('V2 JCL: IF ... THEN — condition sans le mot THEN', (()=>{ const st=J2.jobs[0].steps.find(s=>s.name==='NEXT'); return !!st && !!st.condition && st.condition.text==='(RC=0)'; })());
    const MEM1 = "//S1 EXEC PGM=PM\n//DM DD DSN=INCL.DATA,DISP=SHR";
    const J3 = parseJCL("//JMAIN JOB 1\n//I1 INCLUDE MEMBER=MEM1\n//S9 EXEC PGM=PZ", { MEM1: MEM1 });
    T('V2 JCL: INCLUDE résolu quand le membre est uploadé', J3.jobs[0].steps.length===2 && J3.jobs[0].steps[0].target==='PM' && J3.jobs[0].steps[0].dds.some(d=>d.name==='INCL.DATA'));
    const J4 = parseJCL("//J2 JOB 1\n//I2 INCLUDE MEMBER=NOSUCH\n//SX EXEC PGM=PY", { MEM1: MEM1 });
    T('V2 JCL: INCLUDE manquant → warning précis, reste du job intact', J4.warnings.some(w=>w.includes('INCLUDE member NOSUCH not uploaded')) && J4.jobs[0].steps.length===1);

    // ── 5. Graphe : paragraphes comme nœuds, FD certain, backref 3 parties, impact ──
    state.files = [];
    const GJ = "//JG1 JOB 1\n//PRC1 PROC\n//PS1 EXEC PGM=PP1\n//PD1 DD DSN=SRC.DATA,DISP=SHR\n// PEND\n//C1 EXEC PROC=PRC1\n//S2 EXEC PGM=BANKUPD\n//MASTDD DD DSN=BK.MASTER,DISP=SHR\n//BK DD DSN=*.C1.PS1.PD1,DISP=OLD";
    const gfiles = [
      { name:'G.JCL', lang:'JCL', text:GJ },
      { name:'BANKUPD.CBL', lang:'CBL', text:CV2 },

    gfiles.forEach(f => {
      if (f.lang === 'JCL'){ const res = parseJCL(f.text); f.parsed = { jobs: res.jobs, procs: res.procs, warnings: res.warnings }; }
      else { const C = parseCOBOL(f.name, f.text, {}); f.parsed = { cobol: C, warnings: C.warns, programId: C.programId, copies: C.copyUsed.map(c=>({name:c.name,resolved:!!c.resolved})), sqlCount: C.sql.length, performs: C.performs.length, gotos: C.gotos.length }; }

    const M = buildModel(gfiles);
    const E = M.edges;
    const has = (f,t,k) => E.some(e=>e.f===f&&e.t===t&&e.k===k);
    T('V2 GRAPH: paragraphe = nœud (prog contains para)', has('prog|BANKUPD','para|BANKUPD.READ-S','contains'));

    T('V2 GRAPH: GO TO DEPENDING para→para probable (depuis READ-S, pas de boucle sur soi)', (E.find(e=>e.f==='para|BANKUPD.READ-S'&&e.t==='para|BANKUPD.INIT-S'&&e.k==='goto')||{}).c==='probable' && !E.some(e=>e.f===e.t&&e.k==='goto'));

    T('V2 GRAPH: backref 3 parties *.C1.PS1.PD1 résolu', has('step|JG1.S2','ds|SRC.DATA','read'));
    const impG = impact(M, 'job|JG1');
    T('V2 IMPACT: JOB → paragraphe (chemin job→step→prog→para)', impG.down.indirect.some(x=>x.id==='para|BANKUPD.READ-S' && x.path.length===4));

    T('V2 IMPACT: depuis un paragraphe — prog direct, job indirect', impP.up.direct.some(x=>x.id==='prog|BANKUPD') && impP.up.indirect.some(x=>x.id==='job|JG1'));

    // ── 6. EXEC CICS : fichiers FCT, maps, queues, XCTL/LINK, jamais inventé ──
    const CICSTXT = [
      "IDENTIFICATION DIVISION.",
      "PROGRAM-ID. TCS100.",
      "ENVIRONMENT DIVISION.",
      "INPUT-OUTPUT SECTION.",
      "FILE-CONTROL.",
      "    SELECT BATCH-FILE ASSIGN TO BATCHDD.",
      "DATA DIVISION.",
      "FILE SECTION.",
      "FD  BATCH-FILE.",
      "01  BATCH-REC.",
      "PROCEDURE DIVISION.",
      "P1.",
      "    EXEC CICS READ FILE('CUSTFCT') INTO(WS-REC) RIDFLD(WS-KEY)",
      "    END-EXEC.",
      "    EXEC CICS WRITE FILE('BATCHDD') FROM(BATCH-REC) END-EXEC.",
      "    EXEC CICS XCTL PROGRAM('TCS200') END-EXEC.",
      "    EXEC CICS LINK PROGRAM('HELLOPGM') END-EXEC.",
      "    EXEC CICS SEND MAP('MENMAP1') MAPSET('MENSET') END-EXEC.",
      "    EXEC CICS WRITEQ TS QUEUE('TSTQ') FROM(WS-DATA) END-EXEC.",
      "    EXEC CICS READ FILE(WS-FILE-VAR) END-EXEC.",
      "    EXEC CICS HANDLE CONDITION(ERRORPAR) END-EXEC.",
      "    STOP RUN."
    ].join("\n");
    const C9 = parseCOBOL('TCS100.CBL', CICSTXT, {});
    T('V2 CICS: 8 commandes EXEC CICS capturées (dont bloc multi-ligne)', C9.cics.length === 8);
    T('V2 CICS: READ FILE → entrée FCT, WRITE FILE(BATCHDD) rattaché au SELECT ASSIGN', (C9.cicsFiles['CUSTFCT']||[]).some(o=>o.op==='read') && (C9.fileOps['BATCH-FILE']||[]).some(o=>o.op==='write' && o.cics==='WRITE'));
    T('V2 CICS: FILE(variable) dynamique → aucune entrée, rien inventé', C9.cics.some(e=>e.cmd==='READ'&&e.file===null&&e.silent) && !C9.cicsFiles['WS-FILE-VAR'] && !C9.warns.some(w=>w.includes('WS-FILE-VAR')));
    T('V2 CICS: HANDLE CONDITION silencieux (aucun warning, aucune arête)', C9.cics.some(e=>e.cmd==='HANDLE'&&e.silent) && !C9.warns.some(w=>w.includes('HANDLE')));
    const bakC = { files: state.files, loaded: state.loaded, log: state.log };
    state.files = [{ name:'TCS100.CBL', lang:'CBL', text:CICSTXT }];
    state.files.forEach(x => parseFile(x));
    const MC = buildModel(state.files);
    const EC = MC.edges;
    const gC = (ff,tt,kk) => EC.find(e => e.f===ff && e.t===tt && (!kk || e.k===kk));
    T('V2 CICS GRAPH: prog → fct|CUSTFCT read certain (FCT, dataset inconnu)', (gC('prog|TCS100','fct|CUSTFCT','read')||{}).c==='certain');
    T('V2 CICS GRAPH: aucun dataset inventé, BATCHDD rattaché sans nœud FCT', !EC.some(e => e.t.startsWith('ds|') && e.t.includes('CUSTFCT')) && !MC.nodes.has('fct|BATCHDD'));
    T('V2 CICS GRAPH: XCTL/LINK → call vers programmes externes certain', (gC('prog|TCS100','xpgm|TCS200','call')||{}).c==='certain' && (gC('prog|TCS100','xpgm|HELLOPGM','call')||{}).c==='certain');
    T('V2 CICS GRAPH: SEND MAP → nœud map + uses certain', (gC('prog|TCS100','map|MENMAP1','uses')||{}).c==='certain' && !!MC.nodes.get('map|MENMAP1'));
    T('V2 CICS GRAPH: WRITEQ TS QUEUE → nœud q + write certain + qtype TS', (gC('prog|TCS100','q|TSTQ','write')||{}).c==='certain' && (MC.nodes.get('q|TSTQ').data||{}).qtype==='TS');
    state.files = bakC.files; state.loaded = bakC.loaded; state.log = bakC.log; state._model = null;

    // ── 7. Export des résultats & lecture express non-expert ──
    // La section a son propre mini-projet : un job 2 steps, 2 programmes, un copybook
    // uploadé (PAYREC) — la lecture express doit être générée depuis CE modèle réel.
    const SGJ = "//SGJOB JOB 1,'STORY'\n//ST1 EXEC PGM=SGPROG\n//SGIN DD DSN=SG.INPUT.DATA,DISP=SHR\n//SGOUT DD DSN=SG.OUTPUT.DATA,DISP=(,CATLG)\n//ST2 EXEC PGM=SGPROG2\n//SG2 DD DSN=SG.OUTPUT.DATA,DISP=OLD";
    const SGC = "IDENTIFICATION DIVISION.\nPROGRAM-ID. SGPROG.\nENVIRONMENT DIVISION.\nINPUT-OUTPUT SECTION.\nFILE-CONTROL.\n    SELECT SGF-FILE ASSIGN TO SGIN.\nDATA DIVISION.\nFILE SECTION.\nFD  SGF-FILE.\n01  SGF-REC.\n    COPY PAYREC.\nPROCEDURE DIVISION.\nMAIN.\n    OPEN INPUT SGF-FILE.\n    READ SGF-FILE.\n    EXEC SQL SELECT * FROM SG.TAB END-EXEC.";
    const SGC2 = "IDENTIFICATION DIVISION.\nPROGRAM-ID. SGPROG2.\nPROCEDURE DIVISION.\nMAIN.\n    EXEC SQL INSERT INTO SG.TAB2 VALUES (:X) END-EXEC.";
    const SGCPY = "01  PAY-RECORD.\n    05  ACC-ID  PIC 9(8).";
    state.files = [
      { name:'SGJOB.JCL', lang:'JCL', text:SGJ },
      { name:'SGPROG.CBL', lang:'CBL', text:SGC },
      { name:'SGPROG2.CBL', lang:'CBL', text:SGC2 },
      { name:'PAYREC.CPY', lang:'CPY', text:SGCPY },
    ];
    state.files.forEach(f => parseFile(f));
    state.loaded = true; state.log = []; state._model = null;
    buildLog();
    const MP = getModel();
    const pl = resultsPayload();
    T('V2 EXPORT: payload = modèle complet (nœuds, relations, preuves, warnings)', pl.edges.length === MP.edges.length && pl.nodes.length === MP.nodes.size && Array.isArray(pl.warnings) && pl.edges.every(e => Array.isArray(e.evidence)));
    const csv = resultsCSV();
    const csvLines = csv.trim().split(/\r\n/);
    T('V2 EXPORT: CSV = en-tête + une ligne par relation, cellules quotées', csvLines.length === MP.edges.length + 1 && csvLines[0] === '"From","To","Relation","Confidence","Evidence"');
    T('V2 EXPORT: CSV protégé contre l\'injection de formules tableur', csvCell('=cmd(1)') === '"\'=cmd(1)"');
    const md = resultsMD();
    T('V2 EXPORT: rapport Markdown = overview, jobs, datasets, points d\'attention, relations avec preuves', md.includes('# Reforge analysis report') && md.includes('## Points of attention') && md.includes('## Datasets') && md.includes('## All relations') && md.includes('(file:line)'));
    const story = summaryStoryHTML();
    T('V2 STORY: lecture 5 minutes générée depuis le modèle réel (jobs, data, scénario, questions)', story.includes('First 5 minutes') && story.includes('PAYREC') && story.includes('Points to ask about'));
    T('V2 STORY: scénario de changement honnête (programmes + confiance, jobs affectés)', /affects/.test(story) && /\(unknown\)|\(certain\)/.test(story));

    // ── 8. Sécurité : XSS — noms/contenus hostiles rendus échappés dans TOUS les panneaux ──
    const EVJ = [
      "//EVJ JOB 1,'<script>alert(1)<\/script>'",
      "//S1 EXEC PGM=EVPGM",
      "//DD1 DD DSN=EV\"><img src=x onerror=alert(1)>.DATA,DISP=SHR",
      "//IFB IF (RC=0) OR '<b>hi</b>' = 'x' THEN",
      "//S2 EXEC PGM=EV2",
      "//ENDIF"
    ].join("\n");
    const EVC = "IDENTIFICATION DIVISION.\nPROGRAM-ID. EVCOBOL.\nPROCEDURE DIVISION.\n    DISPLAY '<img src=x onerror=alert(2)>'\n    EXEC SQL SELECT * FROM EV\"><table>.TAB END-EXEC\n    STOP RUN.";
    const EVCI = "IDENTIFICATION DIVISION.\nPROGRAM-ID. EVCICS.\nPROCEDURE DIVISION.\n    EXEC CICS READ FILE('EV\"><img src=x onerror=alert(3)>') END-EXEC\n    STOP RUN.";
    state.files = [
      { name:'EV"><img src=x onerror=alert(1)>.JCL', lang:'JCL', text:EVJ },
      { name:'EV"><b>.CBL', lang:'CBL', text:EVC },
      { name:'EV"><i>.CBL', lang:'CBL', text:EVCI },
    ];
    state.files.forEach(f => parseFile(f));
    state.loaded = true; state.log = [];
    buildLog();
    let allHTML = '';
    Object.keys(PANELS).forEach(k => { try { allHTML += String(PANELS[k]()); } catch(e){ T('V2 XSS: panneau '+k+' rend sans crash', false); } });
    T('V2 XSS: aucune balise brute injectée (<img/<script/<b>/<table>)', !/<img src=x|<script>alert|<b>hi<\/b>|<table>/.test(allHTML));
    let badAttr = false;
    let am; const are = /on(?:click|change|input)="([^"]*)"/g;
    while ((am = are.exec(allHTML))) if (/[<>]/.test(am[1])) badAttr = true;
    T('V2 XSS: attributs onclick/onchange sans < ni > bruts', !badAttr);
    state.files = []; state.loaded = false; state.log = []; state._model = null;
  } catch (e){
    out.push({ name: 'V2 suite crashed: ' + e.message, pass: false });
  } finally {
    state.files = bak.files; state.loaded = bak.loaded; state.log = bak.log;
    state.entity = bak.entity; state.srcIdx = bak.srcIdx; state.srcFile = bak.srcFile;
    state.group = bak.group; state.sub = bak.sub; state._model = null;
  }
  return out;
}

function cobRegistry(){
  // registre des copybooks : nom de base → {text, file}
  const reg = {};
  state.files.forEach(x => { if (x.lang === 'CPY') reg[base(x.name)] = { text: x.text, file: x.name }; });
  return reg;
}

function jclMembers(excludeName){
  // membres INCLUDE disponibles = fichiers JCL du projet, indexés par nom de membre (sans extension)
  const members = {};
  state.files.forEach(x => { if (x.lang === 'JCL' && x.name !== excludeName) members[base(x.name)] = x.text; });
  return members;
}

function parseFile(f){
  f.parsed = {};
  const t = f.text;
  if (f.lang === 'JCL'){
    const res = parseJCL(t, jclMembers(f.name));
    // pas de JOB ni PROC → pseudo-job au nom du fichier ; fichier PROC-only → pas de pseudo-job
    if (!res.jobs.length && !Object.keys(res.procs).length)
      res.jobs.push({ name: base(f.name), steps: [], procsUsed: [], params: {} });
    res.jobs.forEach(jb => { jb.srcFile = f.name; });
    f.parsed = { engine: 'v3', jobs: res.jobs, procs: res.procs, warnings: res.warnings };
  } else if (f.lang === 'CBL' || f.lang === 'CPY'){
    const C = parseCOBOL(f.name, t, cobRegistry());
    f.parsed = { engine: 'v3', cobol: C, warnings: C.warns,
      programId: f.lang === 'CBL' ? C.programId : null,
      copies: C.copyUsed.map(c => ({ name: c.name, resolved: !!c.resolved })),
      sqlCount: C.sql.length, cicsCount: C.cics.length, performs: C.performs.length, gotos: C.gotos.length };
  }
  state._model = null; // le graphe doit être reconstruit
}

function buildGraph(){
  const g = { jobs:[], programs:[], copybooks:[], datasets:[], edges:[] };
  const seen = new Set();
  const addEdge = (from,to) => {
    from = String(from).toUpperCase(); to = String(to).toUpperCase();
    const k = from+'→'+to;
    if (from !== to && !seen.has(k)){ seen.add(k); g.edges.push({from,to}); }
  };
  if (state.files.length) linkCatalogedProcs();
  state.files.forEach(f=>{
    if (f.lang === 'JCL'){
      // engine v2 : un fichier peut contenir plusieurs jobs — une entrée par job
      // (les fichiers PROC-only ne deviennent pas des pseudo-jobs)
      const jobs = f.parsed.jobs || [];
      jobs.forEach(jb=>{
        const steps = (jb.steps||[]).map(s => ({
          name: s.name, pgm: s.target, kind: s.kind,
          proc: s.proc || null, via: s.via || null, condition: s.condition || null,
          dds: s.dds || []
        }));
        const dsns = [...new Set((jb.steps||[]).flatMap(s => (s.dds||[]))
          .filter(d => d.name && !d.temp && !d.backref).map(d => String(d.name).toUpperCase()))];
        g.jobs.push({ name: (jb.name || base(f.name)), file: f.name, lines: f.lines,
          parsed: { steps, dsns, warnings: (f.parsed && f.parsed.warnings) || [] } });
      });
    }
    else if (f.lang === 'CBL') g.programs.push(f);
    else if (f.lang === 'CPY') g.copybooks.push(f);
  });
  g.jobs.forEach(j=>{
    const jid = base(j.name);
    j.parsed.steps.forEach(s => { if (s.pgm) addEdge(jid, s.pgm); });
    j.parsed.dsns.forEach(d => { if(!g.datasets.includes(d)) g.datasets.push(d); addEdge(jid, d); });
  });
  g.programs.forEach(p=>{
    const pid = p.parsed.programId;
    (p.parsed.copies||[]).forEach(cu=>{
      const c = cu.name;
      g.copybooks.forEach(cb=>{
        const cbn = base(cb.name);
        if (cu.resolved && (cbn === c || c.indexOf(cbn) === 0)) addEdge(pid, cbn);
      });
    });
  });
  return g;
}

function typeOf(label, g){
  if (g.jobs.some(j=>base(j.name)===label)) return 'JCL JOB';
  if (g.programs.some(p=>p.parsed.programId===label)) return 'COBOL';
  if (g.copybooks.some(c=>base(c.name)===label)) return 'COPYBOOK';
  if (g.datasets.includes(label)) return 'DATASET';
  return 'UNKNOWN';
}

// Description lisible d'un step, calculée depuis ses DD réels (engine v2)
function stepDesc(s){
  if (!s.pgm) return 'EXEC — no PGM/PROC resolved (see Debug log)';
  const parts = [ s.kind === 'PROC' ? `EXEC PROC=${esc(s.pgm)}` : `EXEC PGM=${esc(s.pgm)}` ];
  const ins   = (s.dds||[]).filter(d => d.usage === 'input'  && d.name && !d.temp).map(d => esc(d.name));
  const outs  = (s.dds||[]).filter(d => d.usage === 'output' && d.name && !d.temp)
                 .map(d => esc(d.name) + (d.gdg != null ? ` (GDG ${d.gdg >= 0 ? '+' : ''}${d.gdg})` : ''));
  const temps = (s.dds||[]).filter(d => d.temp).map(d => esc(d.name));
  if (ins.length)   parts.push(`reads ${ins.join(', ')}`);
  if (outs.length)  parts.push(`writes ${outs.join(', ')}`);
  if (temps.length) parts.push(`temp ${temps.join(', ')}`);
  if (s.proc) parts.push(`<span style="color:var(--purple)">from PROC ${esc(s.proc)}${s.via ? ' (via ' + esc(s.via) + ')' : ''}</span>`);
  if (s.condition){
    const c = s.condition, txt = c && c.text ? c.text : String(c);
    parts.push(`<span style="color:var(--yellow)">if ${c && c.neg ? 'NOT ' : ''}${esc(c && c.neg ? '(' + txt + ')' : txt)}</span>`);
  }
  return parts.join(' · ');
}

async function handleFiles(fl){
  const arr = [...fl];
  if (!arr.length) return;
  for (const f of arr){
    let text = '';
    try { text = await f.text(); } catch(e){}
    if (isReforgeProject(f.name, text)){ await importProject(text); continue; }
    const lang = detectLang(f.name, text);
    const nf = { name:f.name, lang, text, lines:text.split('\n').length, sample:false };
    parseFile(nf);
    // remplace un fichier homonyme
    const i = state.files.findIndex(x=>x.name===nf.name);
    if (i>=0) state.files[i] = nf; else state.files.push(nf);
  }
  renderLeft();
  saveSession();
  if (state.loaded) renderContent();
}

function removeFile(i){
  state.files.splice(i,1);
  state._model = null;
  if (!state.files.length){ resetAll(); return; }
  if (state.srcFile && !state.files.some(f=>f.name===state.srcFile)) state.srcFile = state.files[0].name;
  renderLeft(); renderContent(); saveSession();
}

function clearAllFiles(){ resetAll(); }

function resetAll(){
  state.files = []; state.loaded = false; state.log = [];
  state.entity = null; state.srcFile = null; state.pySel = null;
  state.srcIdx = null; state._model = null;
  state.group = 'explore'; state.sub = 'map';
  document.getElementById('statusText').textContent = 'Ready';
  clearSession();
  renderLeft(); renderNav(); renderContent();
}

function analyze(){
  if (!state.files.length) return;
  buildLog();
  state.loaded = true;
  document.getElementById('statusText').textContent = 'Analysis complete';
  state.group = 'explore'; state.sub = 'map';
  saveSession(); track('analyze');
  renderLeft(); renderNav(); renderContent();
}

function buildLog(){
  const L = []; const add = (cls,text)=>L.push({cls,text});
  add('info', `[parse] ${state.files.length} file(s) received — COBOL engine v3 (structure, variables, I/O, SQL), JCL engine v2 (statements, PROC, backrefs)`);
  state.files.forEach(f=>{
    const why = f.lang==='JCL' ? 'JCL statements (engine v2)' : f.lang==='CBL' ? 'PROGRAM-ID found' : f.lang==='CPY' ? 'record layout' : 'unknown format';
    add('ok', `[ok] ${f.name} → ${f.lang} (${why})`);
    (f.parsed.warnings||[]).forEach(w=>add('warn', `[v3] ${f.name}: ${w}`));
    if (f.lang==='JCL' && f.parsed.procs && Object.keys(f.parsed.procs).length)
      add('info', `[v3] ${f.name}: PROC definition(s) available: ${Object.keys(f.parsed.procs).join(', ')}`);
    if (f.lang==='JCL' && f.parsed.jobs) f.parsed.jobs.forEach(jb=>{
      if (jb.steps.length)
        add('info', `[v3] ${jb.name}: ${jb.steps.length} step(s) resolved${(jb.procsUsed||[]).length ? ' · PROCs: ' + [...new Set(jb.procsUsed)].join(', ') : ''}`);
    });
    if (f.lang==='CBL' && f.parsed.cobol){
      const C = f.parsed.cobol;
      add('info', `[v3] ${C.programId || f.name}: ${C.paragraphs.length} paragraph(s), ${C.vars.length} data item(s), ${C.selects.length} SELECT, ${C.calls.length} CALL, ${C.sql.length} SQL block(s), ${C.copyUsed.length} COPY reference(s)`);
    }
  });
  const m = getModel();
  const byT = t=>[...m.nodes.values()].filter(n=>n.type===t).length;
  m.warnings.forEach(w=>add('warn', `[graph] ${w}`));
  add('info', `[done] ${byT('job')} job(s) · ${byT('prog')} program(s) · ${byT('cpy')} copybook(s) · ${byT('ds')} dataset(s) · ${byT('tbl')} DB2 table(s) — ${m.edges.length} relation(s), each with evidence and a confidence level`);
  state.log = L;
}

function svgMap(filter=''){
  const m = getModel();
  const all = [...m.nodes.values()];
  const cols = [
    {x:40,  w:160, type:'JOB',      c:'var(--cyan)',    items:all.filter(n=>n.type==='job').map(n=>({id:n.id, label:n.name}))},
    {x:230, w:160, type:'PROGRAM',  c:'var(--accent)',  items:all.filter(n=>n.type==='prog'||n.type==='xpgm').map(n=>({id:n.id, label:n.name + (n.type==='xpgm'?' *':'')}))},
    {x:420, w:160, type:'COPYBOOK', c:'var(--yellow)',  items:all.filter(n=>n.type==='cpy').map(n=>({id:n.id, label:n.name}))},
    {x:610, w:170, type:'DATASET',  c:'var(--green)',   items:all.filter(n=>n.type==='ds').map(n=>({id:n.id, label:n.name + (n.data.temp?' (temp)':'')}))},
    {x:810, w:170, type:'DB2 TABLE',c:'var(--red)',     items:all.filter(n=>n.type==='tbl').map(n=>({id:n.id, label:n.name}))},
    {x:1010, w:170, type:'CICS',    c:'var(--yellow)',  items:all.filter(n=>n.type==='fct'||n.type==='map'||n.type==='q')
      .map(n=>({id:n.id, label:n.name + (n.type==='fct'?' (FCT)':n.type==='q'?' (queue)':' (map)')}))},
  ];
  const nodes = []; const idx = {};
  cols.forEach(col=>col.items.forEach((it,i)=>{
    idx[it.id] = nodes.length;
    nodes.push({ label: it.label, type:col.type, c:col.c, x:col.x, y:18+i*70, w:col.w });
  }));
  const maxN = Math.max(1, ...cols.map(c=>c.items.length));
  const height = 18 + (maxN-1)*70 + 44 + 16;
  const width = 1010 + 170 + 40;
  const fl = (filter||'').toLowerCase();
  const idLabel = id => { const n = nodes[idx[id]]; return n ? n.label : ''; };
  const vis = new Set(nodes.filter(n=>n.label.toLowerCase().includes(fl)).map((n,i)=>i));
  // projection top-niveau : step→X devient job→X (les steps ne sont pas dessinés)
  const proj = new Set();
  for (const e of m.edges){
    let f = e.f, t = e.t;
    if (f.startsWith('step|')){
      if (t.startsWith('step|')) continue; // contains : interne
      f = 'job|' + f.split('|')[1].split('.')[0];
    }
    proj.add(f + '>' + t);
  }
  const edges = [...proj].map(k=>{ const [f,t] = k.split('>'); return {f,t}; })
    .filter(e=>idx[e.f]!=null && idx[e.t]!=null && vis.has(idx[e.f]) && vis.has(idx[e.t]))
    .map(e=>{
      const A = nodes[idx[e.f]], B = nodes[idx[e.t]];
      return `<path class="edge" marker-end="url(#arrow)" d="M ${A.x+A.w} ${A.y+22} C ${A.x+A.w+45} ${A.y+22}, ${B.x-45} ${B.y+22}, ${B.x} ${B.y+22}"/>`;
    }).join('');
  const nn = nodes.map((n,i)=>vis.has(i)?`
    <g class="node" transform="translate(${n.x},${n.y})">
      <rect width="${n.w}" height="44" fill="var(--bg3)" stroke="${n.c}"/>
      <text x="10" y="19">${esc(n.label.length>18?n.label.slice(0,17)+'…':n.label)}</text>
      <text class="ntype" x="10" y="34">${n.type}</text>
    </g>`:'').join('');
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" style="display:block">
    <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--border2)"/></marker></defs>
    ${edges}${nn}</svg><p class="note" style="margin-top:6px">* = external program (not uploaded). Jobs link to programs and datasets through their steps; every relation shown was detected — nothing inferred.</p>`;
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function hl(text){
  const re = /\b(IDENTIFICATION DIVISION|PROCEDURE DIVISION|WORKING-STORAGE|FILE SECTION|PROGRAM-ID|END-PERFORM|END-EXEC|END-IF|GO TO|STOP RUN|PERFORM|COMPUTE|ROUNDED|UNTIL|EXEC SQL|SELECT|ASSIGN|DISPLAY|MOVE|COPY|READ|OPEN|CLOSE|PIC|ADD|END|JOB|EXEC|PGM|DSN|DD)\b/g;
  return esc(text).replace(re, m=>`<span class="k">${m}</span>`);
}
function firstLines(text, n){
  const l = text.split('\n');
  return (l.length>n ? l.slice(0,n).join('\n') + `\n… (${l.length} lines total)` : l.join('\n'));
}

// ══════════════════ 5c. PERSISTANCE LOCALE (IndexedDB) + PROJET ══════════════════
// Les fichiers et l'analyse sont stockés dans le navigateur (IndexedDB),
// jamais envoyés. Fallback mémoire si le stockage est bloqué (mode privé).
// Export/import : fichier .json portable contenant uniquement les textes sources
// (re-parsés à l'import — robuste aux évolutions du moteur).

const SESSION_VER = 3;
const _idbName = 'reforge-db', _idbStore = 'session';
let _idb = null, _memSession = null;

function idbOpen(){
  return new Promise((res, rej) => {
    if (_idb) return res(_idb);
    try {
      const req = indexedDB.open(_idbName, 1);
      req.onupgradeneeded = () => { try { req.result.createObjectStore(_idbStore); } catch(e){} };
      req.onsuccess = () => { _idb = req.result; res(_idb); };
      req.onerror = () => rej(req.error || new Error('IndexedDB unavailable'));
    } catch(e){ rej(e); }
  });
}

async function saveSession(){
  const data = { v: SESSION_VER, ts: Date.now(), files: state.files, log: state.log, loaded: state.loaded };
  try {
    const db = await idbOpen();
    await new Promise((res, rej) => {
      const tx = db.transaction(_idbStore, 'readwrite');
      tx.objectStore(_idbStore).put(data, 'current');
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
    // demande au navigateur de ne pas évincer les données sous pression disque
    if (navigator.storage && navigator.storage.persist) { try { navigator.storage.persist(); } catch(e){} }
  } catch(e){ _memSession = data; } // mode privé / storage bloqué → mémoire de session
}

async function loadSession(){
  try {
    const db = await idbOpen();
    return await new Promise((res, rej) => {
      const rq = db.transaction(_idbStore, 'readonly').objectStore(_idbStore).get('current');
      rq.onsuccess = () => res(rq.result || null);
      rq.onerror = () => rej(rq.error);
    });
  } catch(e){ return _memSession; }
}

async function clearSession(){
  _memSession = null;
  try {
    const db = await idbOpen();
    await new Promise((res, rej) => {
      const tx = db.transaction(_idbStore, 'readwrite');
      tx.objectStore(_idbStore).delete('current');
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  } catch(e){}
}

// ── Export des RÉSULTATS d'analyse (≠ export projet : ici on sort ce que
// l'analyse a TROUVÉ — nœuds, relations, preuves, points d'attention).
// Un outil critique doit laisser les données sortir vite : JSON (machine),
// CSV (tableur), Markdown (rapport lisible). 100% local, aucun envoi. ──
function resultsPayload(){
  const m = getModel();
  const byT = t => [...m.nodes.values()].filter(n=>n.type===t);
  return {
    app: 'reforge', v: SESSION_VER, exported: new Date().toISOString(),
    overview: {
      jobs: byT('job').length, steps: byT('step').length, programs: byT('prog').length,
      copybooks: byT('cpy').length, datasets: byT('ds').length, db2_tables: byT('tbl').length,
      cics_files: byT('fct').length, cics_maps: byT('map').length, cics_queues: byT('q').length,
      relations: m.edges.length,
      certain: m.edges.filter(e=>e.c==='certain').length,
      probable: m.edges.filter(e=>e.c==='probable').length,
      unknown: m.edges.filter(e=>e.c==='unknown').length
    },
    nodes: [...m.nodes.values()].map(n => ({ id: n.id, type: n.type, name: n.name, data: n.data || {} })),
    edges: m.edges.map(e => ({ from: e.f, to: e.t, relation: e.k, confidence: e.c,
      evidence: (e.ev||[]).map(x => ({ file: x.file || null, line: x.ln || null, note: x.note || '' })) })),
    warnings: m.warnings || [],
    files: state.files.map(f => ({ name: f.name, lang: f.lang, lines: (f.text || '').split('\n').length, parsed: !!f.parsed }))
  };
}

// Cellule CSV : guillemets doublés + protection contre l'injection de
// formules tableur (un DSN "=cmd(...)" ne doit jamais s'exécuter dans Excel).
function csvCell(v){
  v = String(v == null ? '' : v);
  if (/^[=+\-@]/.test(v)) v = "'" + v;
  return '"' + v.replace(/"/g,'""') + '"';
}
function resultsCSV(){
  const rows = [['From','To','Relation','Confidence','Evidence']];
  getModel().edges.forEach(e => {
    const ev = (e.ev||[]).map(x => (x.file||'?') + (x.ln ? ':' + x.ln : '') + (x.note ? ' — ' + x.note : '')).join(' | ');
    rows.push([e.f, e.t, e.k, e.c, ev]);
  });
  return rows.map(r => r.map(csvCell).join(',')).join('\r\n') + '\r\n';
}

function resultsMD(){
  const m = getModel();
  const byT = t => [...m.nodes.values()].filter(n=>n.type===t);
  const nm = id => { const n = m.nodes.get(id); return n ? n.name : id; };
  const evs = e => (e.ev||[]).map(x => (x.file||'?') + (x.ln ? ':' + x.ln : '') + (x.note ? ' — ' + x.note : '')).join(' ; ').replace(/\|/g,'/');
  const L = [];
  L.push('# Reforge analysis report');
  L.push('');
  L.push('_Generated ' + new Date().toISOString() + '. Every relation carries its evidence (file:line) and a confidence level: certain / probable / unknown. Nothing is invented._');
  L.push('');
  L.push('## Overview');
  L.push('- Jobs: ' + byT('job').length + ' · steps: ' + byT('step').length + ' · programs: ' + byT('prog').length + ' · copybooks: ' + byT('cpy').length);
  L.push('- Datasets: ' + byT('ds').length + ' · DB2 tables: ' + byT('tbl').length + ' · CICS files/maps/queues: ' + (byT('fct').length + byT('map').length + byT('q').length));
  L.push('- Relations: ' + m.edges.length + ' (certain: ' + m.edges.filter(e=>e.c==='certain').length + ', probable: ' + m.edges.filter(e=>e.c==='probable').length + ', unknown: ' + m.edges.filter(e=>e.c==='unknown').length + ')');
  L.push('');
  L.push('## Jobs & steps');
  byT('job').forEach(j => {
    L.push('### ' + j.name);
    m.edges.filter(e => e.f === j.id && e.k === 'contains').forEach(e => {
      const s = m.nodes.get(e.t); if (!s) return;
      const exec = m.edges.find(x => x.f === s.id && x.k === 'exec');
      const dss = m.edges.filter(x => x.f === s.id && ['read','write','update','delete','unknown'].includes(x.k));
      L.push('- **' + s.name + '** → ' + (exec ? nm(exec.t) : 'no program detected')
        + (dss.length ? ' ; data: ' + dss.map(x => x.k + ' ' + nm(x.t) + ' (' + x.c + ')').join(', ') : ''));
    });
  });
  L.push('');
  L.push('## Programs');
  byT('prog').forEach(p => {
    const uses = m.edges.filter(e => e.f === p.id && e.k === 'uses');
    const sql = m.edges.filter(e => e.f === p.id && String(e.k).startsWith('sql-'));
    const calls = m.edges.filter(e => e.f === p.id && e.k === 'call');
    const paras = m.edges.filter(e => e.f === p.id && e.k === 'contains' && e.t.startsWith('para|'));
    L.push('- **' + p.name + '** : ' + paras.length + ' paragraph(s), ' + uses.length + ' copybook(s), ' + sql.length + ' SQL table access(es), ' + calls.length + ' call(s)');
  });
  L.push('');
  L.push('## Datasets');
  byT('ds').forEach(d => {
    const rel = m.edges.filter(e => e.t === d.id && ['read','write','update','delete','unknown'].includes(e.k));
    L.push('- **' + d.name + '**' + (d.data && d.data.temp ? ' (temporary)' : '') + ' : ' + (rel.map(x => x.k + ' by ' + nm(x.f) + ' (' + x.c + ')').join(', ') || 'no usage detected'));
  });
  L.push('');
  const fcts = byT('fct'), maps = byT('map'), qs = byT('q');
  if (fcts.length || maps.length || qs.length){
    L.push('## CICS resources');
    fcts.forEach(d => L.push('- CICS file **' + d.name + '** (FCT entry, dataset unknown) : ' + m.edges.filter(e=>e.t===d.id).map(x => x.k + ' by ' + nm(x.f)).join(', ')));
    maps.forEach(d => L.push('- CICS map **' + d.name + '** : used by ' + m.edges.filter(e=>e.t===d.id).map(x => nm(x.f)).join(', ')));
    qs.forEach(d => L.push('- CICS queue **' + d.name + '** : ' + m.edges.filter(e=>e.t===d.id).map(x => x.k + ' by ' + nm(x.f)).join(', ')));
    L.push('');
  }
  L.push('## Points of attention');
  if (!(m.warnings||[]).length) L.push('- None detected.');
  else (m.warnings||[]).forEach(w => L.push('- ' + w));
  L.push('');
  L.push('## All relations (' + m.edges.length + ')');
  L.push('| From | To | Relation | Confidence | Evidence |');
  L.push('|---|---|---|---|---|');
  m.edges.forEach(e => L.push('| ' + nm(e.f) + ' | ' + nm(e.t) + ' | ' + e.k + ' | ' + e.c + ' | ' + (evs(e) || '-') + ' |'));
  L.push('');
  return L.join('\n');
}

// Lecture express pour non-spécialiste : générée depuis les relations détectées
// uniquement (aucune phrase en dur). C'est la carte « 5 minutes » que un
// responsable non expert peut lire avant de poser ses questions.
function summaryStoryHTML(){
  const m = getModel();
  const byT = t => [...m.nodes.values()].filter(n=>n.type===t);
  const nm = id => { const n = m.nodes.get(id); return n ? n.name : id; };
  const escList = a => a.length ? a.map(x => '<b class="mono">' + esc(nm(x)) + '</b>').join(', ') : '<i>none</i>';
  const jobLines = byT('job').slice(0, 4).map(j => {
    const steps = m.edges.filter(e => e.f === j.id && e.k === 'contains').map(e => m.nodes.get(e.t)).filter(Boolean);
    const chain = steps.map(s => {
      const exec = m.edges.find(x => x.f === s.id && x.k === 'exec');
      return esc(String(s.name).split('.').slice(1).join('.') || s.name) + ' → ' + (exec ? esc(nm(exec.t)) : '<i>no program</i>');
    }).join(' · ') || '<i>no step detected</i>';
    return '<li><span class="mono" style="color:var(--text)">' + esc(j.name) + '</span> : ' + chain + '</li>';
  }).join('');
  const dsLines = byT('ds').slice(0, 8).map(d => {
    const reads = m.edges.filter(e => e.t === d.id && e.k === 'read').map(e => e.f);
    const wr = m.edges.filter(e => e.t === d.id && ['write','update'].includes(e.k)).map(e => e.f + ' (' + e.c + ')');
    return '<li><span class="mono">' + esc(d.name) + (d.data && d.data.temp ? ' <i>(temp)</i>' : '') + '</span> — read: ' + (reads.length ? escList(reads) : '<i>nobody detected</i>') + ' · written: ' + (wr.length ? escList(wr) : '<i>nobody detected</i>') + '</li>';
  }).join('');
  const cpy = byT('cpy')[0];
  let scen = '<i>No copybook in this project.</i>';
  if (cpy){
    const imp = impact(m, cpy.id);
    const progs = imp.up.direct.filter(x => x.id.startsWith('prog|')).map(x => nm(x.id) + ' (' + x.conf + ')');
    const jobs = imp.up.indirect.filter(x => x.id.startsWith('job|')).map(x => nm(x.id));
    scen = 'changing <span class="mono">' + esc(cpy.name) + '</span> affects ' + escList(progs)
      + (jobs.length ? ' — and job(s) ' + escList(jobs) : '')
      + '. <b>Question for the developer:</b> "if this layout changes, which programs and jobs need regression tests, and which tests do you plan?"';
  }
  const warns = (m.warnings || []).slice(0, 6);
  const warnLines = warns.length ? warns.map(w => '<li>' + esc(w) + '</li>').join('') : '<li><span class="ok">✓ No warning detected — every relation is confirmed.</span></li>';
  return `<div class="card" style="max-width:760px"><h3>⏱ First 5 minutes — plain-language read</h3>
    <p class="note" style="font-size:13px;line-height:1.6;color:var(--text2)">What a non-specialist can see immediately — generated from the detected relations only, evidence and confidence included.</p>
    <p class="note" style="line-height:1.9"><b>1. The jobs:</b></p><ul class="note" style="line-height:1.8">${jobLines || '<li><i>none</i></li>'}</ul>
    <p class="note" style="line-height:1.9"><b>2. The data:</b></p><ul class="note" style="line-height:1.8">${dsLines || '<li><i>none</i></li>'}</ul>
    <p class="note" style="line-height:1.9"><b>3. Change scenario:</b> ${scen}</p>
    <p class="note" style="line-height:1.9"><b>4. Points to ask about:</b></p><ul class="note" style="line-height:1.8">${warnLines}</ul>
  </div>`;
}

function downloadResults(fmt){
  const specs = {
    json: { name: 'reforge-results.json', type: 'application/json', build: () => JSON.stringify(resultsPayload(), null, 2) },
    csv:  { name: 'reforge-relations.csv', type: 'text/csv', build: resultsCSV },
    md:   { name: 'reforge-report.md', type: 'text/markdown', build: resultsMD }
  };
  const spec = specs[fmt];
  if (!spec || !state.files.length) return;
  const blob = new Blob([spec.build()], { type: spec.type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = spec.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  track('export_results_' + fmt);
}

// ── Export / import de projet (.json) ──
function exportProject(){
  if (!state.files.length) return;
  const data = { app: 'reforge', v: SESSION_VER, exported: new Date().toISOString(),
    files: state.files.map(f => ({ name: f.name, lang: f.lang, text: f.text, sample: !!f.sample })) };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'reforge-project.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  track('export_project');
}

function isReforgeProject(name, text){
  return /\.json$/i.test(name) && /"app"\s*:\s*"reforge"/.test((text || '').slice(0, 500));
}

async function importProject(text){
  let data;
  try { data = JSON.parse(text); } catch(e){ return false; }
  if (!data || data.app !== 'reforge' || !Array.isArray(data.files)) return false;
  state.files = [];
  for (const f of data.files){
    const t = f.text || '';
    const nf = { name: f.name, lang: detectLang(f.name, t), text: t, lines: t.split('\n').length, sample: !!f.sample };
    parseFile(nf);
    state.files.push(nf);
  }
  state.loaded = true;
  state.entity = null; state.srcFile = null; state.pySel = null;
  state.group = 'explore'; state.sub = 'map';
  document.getElementById('statusText').textContent = 'Project imported';
  buildLog();
  saveSession();
  renderLeft(); renderNav(); renderContent();
  track('import_project');
  return true;
}

// ── Télémétrie légère (compteurs d'usage GA, jamais de noms de fichiers) ──
function track(name){
  try { if (typeof gtag === 'function') gtag('event', name); } catch(e){}
}

    </div>` : '';
    const logArea = state.loaded ? `<div class="card log" style="max-width:760px">
      ${state.log.map(l=>`<div><span class="${l.cls}">${esc(l.text)}</span></div>`).join('')}
    </div>` : emptyState('🔬','No analysis run yet','The parsing log (JCL + COBOL v3) and the engine self-tests will appear here.');
    return `
    <div class="toolbar">
      <button class="analyze-btn" style="width:auto" onclick="state._testResults=runSelfTests();renderContent()">⚙ Engine self-tests</button>
      <button class="analyze-btn" style="width:auto" onclick="state._v2Results=runV2Tests();renderContent()">⚙ V2 suite (FD/01, SQL, JCL, CICS, XSS)</button>
      <button class="analyze-btn" style="width:auto" onclick="toggleTelemetry()">${telemetryOn() ? '📡 Telemetry ON' : '📡 Telemetry OFF (opt-in)'}</button>
    </div>
    ${testArea}
    ${v2Area}
    ${logArea}
    <div class="card" style="max-width:760px;margin-top:14px"><h3>Known limits (documented, not hidden)</h3><p class="note" style="line-height:1.8">
      • Dynamic SQL (PREPARE/EXECUTE): statement text unknown → no table extracted, explicit warning.<br>
      • Cataloged PROCs / INCLUDE members: resolved only if uploaded in the project.<br>
      • Literal continuation: resumed at the apostrophe; column 16-71 spaces of the first line are not re-padded.<br>
      • EXEC CICS: FILE/DATASET (FCT), MAP, QUEUE (TSQ/TDQ), XCTL/LINK handled. FILE(variable) dynamic not resolved (no edge); HANDLE/AID control flow not modeled; DLI/IMS and REXX not analyzed — no relation invented.<br>
      • PERFORM/GOTO to an undefined target: flagged as warning, no edge created.<br>
      • AI: not implemented — no simulated output.<br>
      • Telemetry: OFF by default (opt-in above). Source files never leave the browser (IndexedDB local, export by your action only).</p></div>`;
  },
};

function renderContent(){
  const c = document.getElementById('content');
  c.innerHTML = PANELS[state.sub] ? PANELS[state.sub]() : emptyState('…','Coming soon','');
}

// ══════════════════ 7. NAVIGATION ══════════════════

function renderNav(){
  const g = NAV.find(n=>n.id===state.group);
  document.getElementById('groups').innerHTML = NAV.map(n =>
    `<div class="group ${n.id===state.group?'active':''}" onclick="switchGroup('${n.id}')"><span class="g-icon">${n.icon}</span>${n.label}</div>`
  ).join('');
  document.getElementById('subtabs').innerHTML = g.subs.map(s =>
    `<div class="subtab ${s.id===state.sub?'active':''} ${s.hot?'hot':''}" onclick="switchSub('${s.id}')">${s.label}</div>`
  ).join('');
}
function switchGroup(id){
  state.group = id;
  state.sub = NAV.find(n=>n.id===id).subs[0].id;
  renderNav(); renderContent();
}
function switchSub(id){ state.sub = id; renderNav(); renderContent(); }

// ══════════════════ 8. PANNEAU GAUCHE ══════════════════

function fIcon(lang){ return lang==='JCL' ? '📄' : lang==='CPY' ? '📋' : lang==='CBL' ? '🖥' : '❓'; }

function renderLeft(){
  document.getElementById('fileList').innerHTML = state.files.map((f,i)=>`
    <div class="file">
      <span class="ficon">${fIcon(f.lang)}</span>
      <span class="fname" title="${esc(f.name)}">${esc(f.name)}</span>
      <span class="lang lang-${f.lang.toLowerCase()}">${f.lang}</span>
      <button class="rm" title="Remove this file" onclick="removeFile(${i})">×</button>
    </div>`).join('');
  document.getElementById('clearAll').style.display = state.files.length ? 'block' : 'none';
  document.getElementById('exportBtn').style.display = state.files.length ? 'block' : 'none';
  const g = buildGraph();
  document.getElementById('stats').innerHTML = state.files.length ?
    `<div class="stat"><b>${state.files.length}</b><span>Files</span></div>
     <div class="stat"><b>${g.jobs.length}</b><span>JCL jobs</span></div>
     <div class="stat"><b>${g.programs.length}</b><span>Programs</span></div>
     <div class="stat"><b>${g.datasets.length}</b><span>Datasets</span></div>` : '';
  document.getElementById('analyzeBtn').disabled = !state.files.length;
}

// ══════════════════ 9. SAMPLE SYSTEM ══════════════════

function loadSample(){
  state.files = JSON.parse(JSON.stringify(SAMPLE_FILES));
  state.files.forEach(f => { f.lines = f.text.split('\n').length; parseFile(f); });
  state.loaded = true;
  state.entity = null; state.srcFile = null; state.pySel = null;
  state.group = 'explore'; state.sub = 'map';
  document.getElementById('statusText').textContent = 'Sample system loaded';
  buildLog();
  saveSession(); track('load_sample');
  renderLeft(); renderNav(); renderContent();
}

// ── Télémétrie (Google Analytics) : OFF par défaut, opt-in explicite ──
// Aucun script externe n'est chargé avant consentement ; état persisté en localStorage.
function telemetryOn(){ try { return localStorage.getItem('reforge_telemetry') === '1'; } catch(e){ return false; } }
function toggleTelemetry(){
  const on = !telemetryOn();
  try { localStorage.setItem('reforge_telemetry', on ? '1' : '0'); } catch(e){}
  if (on && typeof gtag !== 'function' && !document.getElementById('gtag-js')){
    try {
      const s = document.createElement('script');
      s.id = 'gtag-js'; s.async = true; s.src = 'https://www.googletagmanager.com/gtag/js?id=G-TMZLXLY7BC';
      document.head.appendChild(s);
      window.dataLayer = window.dataLayer || [];
      window.gtag = function(){ window.dataLayer.push(arguments); };
      gtag('js', new Date()); gtag('config', 'G-TMZLXLY7BC');
    } catch(e){}
  }
  renderContent();
}

// ══════════════════ 10. WIRING ══════════════════

const dz = document.getElementById('dz');
const fi = document.getElementById('fileInput');
dz.addEventListener('click', e => { if (e.target.tagName !== 'INPUT') fi.click(); });
fi.addEventListener('change', () => { handleFiles(fi.files); fi.value = ''; });
['dragenter','dragover'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); dz.classList.add('hover'); }));
['dragleave','drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); dz.classList.remove('hover'); }));
dz.addEventListener('drop', e => { handleFiles(e.dataTransfer.files); });
document.getElementById('sampleBtn').onclick = loadSample;
document.getElementById('analyzeBtn').onclick = analyze;
document.getElementById('exportBtn').onclick = exportProject;
document.getElementById('themeBtn').onclick = () => {
  document.body.classList.toggle('light');
  const light = document.body.classList.contains('light');
  document.getElementById('themeBtn').textContent = light ? '🌙' : '☀';
  try { localStorage.setItem('reforge_theme', light ? 'light' : 'dark'); } catch(e){}
};

// Thème persisté
try {
  if (localStorage.getItem('reforge_theme') === 'light'){
    document.body.classList.add('light');
    document.getElementById('themeBtn').textContent = '🌙';
  }
} catch(e){}

renderLeft(); renderNav(); renderContent();

// ── Self-tests automatiques via ?selftest (CI / vérification rapide) ──
if (location.search.indexOf('selftest') >= 0){
  state._testResults = runSelfTests();
  state._v2Results = runV2Tests();
  state.group = 'tech'; state.sub = 'debug';
  renderNav(); renderContent();
}

// ── Restauration de session (IndexedDB) — « Welcome back » ──
(async () => {
  const saved = await loadSession();
  if (saved && saved.v === SESSION_VER && Array.isArray(saved.files) && saved.files.length){
    state.files = saved.files;
    state.log = saved.log || [];
    state.loaded = !!saved.loaded;
    state.entity = null; state.srcFile = null; state.pySel = null;
    if (state.loaded){
      document.getElementById('statusText').textContent = `Welcome back — ${state.files.length} file(s) restored`;
      track('restore_session');
    } else {
      document.getElementById('statusText').textContent = `${state.files.length} file(s) restored — click Analyze`;
    }
    renderLeft(); renderNav(); renderContent();
  }
})();

<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reforge — Redesign Concept</title>
<style>
  :root{
    --bg:#080b14; --bg2:#0d1120; --bg3:#141828; --bg4:#1a2035;
    --border:#1e2540; --border2:#28304e;
    --text:#e2e6f3; --text2:#8892b0; --text3:#4a5270;
    --accent:#4f8fff; --accent2:#2563eb; --purple:#8b5cf6; --cyan:#22d3ee;
    --green:#34d399; --yellow:#fbbf24; --red:#f87171;
    --grad:linear-gradient(135deg,#4f8fff,#8b5cf6);
  }
  body.light{
    --bg:#f0f2f9; --bg2:#fff; --bg3:#e8eaf5; --bg4:#dde0f0;
    --border:#d0d5ea; --border2:#b8bdda;
    --text:#0e1120; --text2:#3d456a; --text3:#8890aa;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
    background:var(--bg); color:var(--text);
    height:100vh; display:flex; flex-direction:column; overflow:hidden;
    font-size:14px; -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:ui-monospace,'Cascadia Code',Menlo,Consolas,monospace}

  /* ── HEADER ── */
  header{
    display:flex; align-items:center; gap:12px; padding:0 20px; height:54px;
    background:var(--bg2); border-bottom:1px solid var(--border);
    flex-shrink:0; position:relative; z-index:10;
  }
  header::after{content:''; position:absolute; bottom:0; left:0; right:0; height:1px; background:var(--grad); opacity:.5}
  .logo{font-family:ui-monospace,Menlo,monospace; font-size:17px; font-weight:700; background:var(--grad); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text}
  .logo span{opacity:.55; font-weight:400}
  .header-tag{font-family:ui-monospace,Menlo,monospace; font-size:11px; color:var(--text2); border:1px solid var(--border2); border-radius:4px; padding:2px 8px}
  .badge-concept{font-family:ui-monospace,Menlo,monospace; font-size:10px; color:var(--purple); border:1px dashed var(--purple); border-radius:4px; padding:2px 8px; letter-spacing:1px}
  .header-spacer{flex:1}
  .status{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text2)}
  .dot{width:7px; height:7px; border-radius:50%; background:var(--green); box-shadow:0 0 6px var(--green)}
  .header-link{color:var(--text2); font-size:12px; text-decoration:none}
  .header-link:hover{color:var(--accent)}
  .theme-btn{background:var(--bg3); color:var(--text); border:1px solid var(--border2); border-radius:6px; padding:5px 10px; cursor:pointer; font-size:13px}

  /* ── WORKSPACE ── */
  .workspace{flex:1; display:grid; grid-template-columns:270px 1fr; min-height:0}

  /* Left panel */
  .left{background:var(--bg2); border-right:1px solid var(--border); padding:14px; display:flex; flex-direction:column; gap:12px; overflow-y:auto}
  .panel-h{font-family:ui-monospace,Menlo,monospace; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--text3)}
  .dropzone{
    border:1.5px dashed var(--border2); border-radius:10px; padding:18px 12px;
    text-align:center; color:var(--text2); transition:.15s; cursor:pointer; font-size:13px;
  }
  .dropzone:hover,.dropzone.hover{border-color:var(--accent); color:var(--text); background:rgba(79,143,255,.05)}
  .dropzone .icon{font-size:22px; display:block; margin-bottom:6px}
  .browse{color:var(--accent); text-decoration:underline}
  .sample-btn{
    width:100%; padding:10px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600;
    color:#fff; background:var(--grad); border:none; transition:.15s;
  }
  .sample-btn:hover{filter:brightness(1.12)}
  .analyze-btn{
    width:100%; padding:9px; border-radius:8px; cursor:pointer; font-size:13px; font-weight:600;
    background:var(--bg3); color:var(--text); border:1px solid var(--border2); transition:.15s;
  }
  .analyze-btn:hover:not(:disabled){border-color:var(--accent)}
  .analyze-btn:disabled{opacity:.4; cursor:not-allowed}
  .file-list{display:flex; flex-direction:column; gap:6px}
  .file{display:flex; align-items:center; gap:8px; background:var(--bg3); border:1px solid var(--border); border-radius:7px; padding:7px 9px; font-size:12px}
  .file .ficon{flex-shrink:0}
  .file .fname{font-family:ui-monospace,Menlo,monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0}
  .lang{font-family:ui-monospace,Menlo,monospace; font-size:9px; font-weight:700; border-radius:3px; padding:2px 5px; flex-shrink:0}
  .lang-jcl{color:var(--cyan); border:1px solid var(--cyan)}
  .lang-cbl{color:var(--accent); border:1px solid var(--accent)}
  .lang-cpy{color:var(--yellow); border:1px solid var(--yellow)}
  .lang-txt{color:var(--text2); border:1px solid var(--border2)}
  .rm{background:none; border:none; color:var(--text3); cursor:pointer; font-size:15px; line-height:1; padding:0 4px; border-radius:4px; flex-shrink:0}
  .rm:hover{color:var(--red); background:rgba(248,113,113,.12)}
  .clear-btn{background:none; border:none; color:var(--text3); font-size:11px; cursor:pointer; text-align:left; padding:0; text-decoration:underline}
  .clear-btn:hover{color:var(--red)}
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .stat{background:var(--bg3); border:1px solid var(--border); border-radius:8px; padding:8px 10px}
  .stat b{display:block; font-size:18px; font-family:ui-monospace,Menlo,monospace}
  .stat span{font-size:11px; color:var(--text2)}

  /* Right panel */
  .right{display:flex; flex-direction:column; min-width:0; min-height:0}
  .groups{display:flex; gap:6px; padding:10px 16px 0; border-bottom:1px solid var(--border); background:var(--bg2)}
  .group{
    padding:8px 16px; font-size:13px; font-weight:600; color:var(--text2); cursor:pointer;
    border:1px solid transparent; border-bottom:none; border-radius:8px 8px 0 0; position:relative; top:1px;
    display:flex; align-items:center; gap:7px;
  }
  .group:hover{color:var(--text)}
  .group.active{color:var(--text); background:var(--bg); border-color:var(--border)}
  .group.active .g-icon{opacity:1}
  .g-icon{font-size:13px; opacity:.7}
  .subtabs{display:flex; gap:2px; padding:9px 16px; background:var(--bg); border-bottom:1px solid var(--border); flex-wrap:wrap}
  .subtab{padding:6px 13px; font-size:12.5px; color:var(--text2); cursor:pointer; border-radius:6px; border:1px solid transparent}
  .subtab:hover{color:var(--text); background:var(--bg3)}
  .subtab.active{color:var(--accent); background:rgba(79,143,255,.08); border-color:rgba(79,143,255,.3); font-weight:600}
  .subtab.hot{color:var(--purple)}
  .content{flex:1; overflow:auto; padding:18px}

  /* Empty state */
  .empty{height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:var(--text2)}
  .empty .e-icon{font-size:34px; margin-bottom:10px; opacity:.6}
  .empty .e-title{font-size:16px; font-weight:600; color:var(--text); margin-bottom:6px}
  .empty .e-sub{font-size:13px; max-width:380px; line-height:1.5}
  .empty .e-hint{margin-top:16px; font-size:12px; color:var(--text3)}

  /* Generic cards */
  .card{background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:14px}
  .card h3{font-size:13px; margin-bottom:8px; color:var(--text)}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:14px}
  table.tbl{width:100%; border-collapse:collapse; font-size:12.5px}
  table.tbl th{text-align:left; font-family:ui-monospace,Menlo,monospace; font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:var(--text3); padding:6px 8px; border-bottom:1px solid var(--border2)}
  table.tbl td{padding:7px 8px; border-bottom:1px solid var(--border); color:var(--text2)}
  table.tbl td:first-child{color:var(--text); font-family:ui-monospace,Menlo,monospace; font-size:12px}
  .pill{font-family:ui-monospace,Menlo,monospace; font-size:10px; border-radius:4px; padding:2px 7px}
  .pill-io{color:var(--text2); border:1px solid var(--border2)}

  /* Map */
  .toolbar{display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap}
  .toolbar input{background:var(--bg3); border:1px solid var(--border2); color:var(--text); border-radius:6px; padding:6px 10px; font-size:12.5px; width:200px}
  .legend{display:flex; gap:12px; font-size:11px; color:var(--text2); margin-left:auto}
  .legend i{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px}
  .svgwrap{background:var(--bg2); border:1px solid var(--border); border-radius:10px; overflow:hidden}
  .node rect{stroke-width:1.5}
  .node text{font-family:ui-monospace,Menlo,monospace; font-size:11px; fill:var(--text)}
  .node .ntype{font-size:8.5px; letter-spacing:1px; fill:var(--text2)}
  .edge{stroke:var(--border2); stroke-width:1.2; fill:none}

  /* Flow steps */
  .step-body{margin-bottom:14px}
  .step-head{font-family:ui-monospace,Menlo,monospace; font-size:13px; font-weight:700; color:var(--accent)}
  .step-sub{font-size:12px; color:var(--text2); margin-top:3px; line-height:1.5}

  /* Code viewer */
  .codeblock{background:var(--bg2); border:1px solid var(--border); border-radius:10px; padding:14px; overflow:auto; font-family:ui-monospace,Menlo,monospace; font-size:12px; line-height:1.6; white-space:pre}
  .k{color:var(--purple)} .c{color:var(--text3)} .s{color:var(--green)} .n{color:var(--yellow)}
  .code-cols{display:grid; grid-template-columns:1fr 1fr; gap:14px; min-width:0}
  .code-cols .codeblock{min-height:220px}
  .note{font-size:11.5px; color:var(--text2); margin-top:8px}
  .note b{color:var(--yellow)}
  .key-panel{display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:10px; padding:30px 20px; color:var(--text2); border:1.5px dashed var(--border2); border-radius:10px}
  .key-panel .kp-icon{font-size:28px}
  .key-panel p{font-size:12.5px; max-width:320px; line-height:1.6}
  .key-input{background:var(--bg3); border:1px solid var(--border2); color:var(--text); border-radius:6px; padding:8px 12px; font-size:12.5px; width:min(280px,100%); font-family:ui-monospace,Menlo,monospace}
  .key-input:focus{outline:none; border-color:var(--accent)}
  .key-btn{background:var(--grad); color:#fff; border:none; border-radius:6px; padding:8px 14px; font-size:12px; font-weight:600; cursor:pointer}
  .key-btn:hover{filter:brightness(1.12)}
  .key-btn-subtle{background:var(--bg3); color:var(--text2); border:1px solid var(--border2); border-radius:6px; padding:8px 14px; font-size:12px; cursor:pointer}

  /* Impact */
  .impact-left{display:flex; flex-direction:column; gap:4px}
  .entity{padding:8px 10px; border-radius:7px; font-family:ui-monospace,Menlo,monospace; font-size:12px; cursor:pointer; color:var(--text2); border:1px solid transparent}
  .entity:hover{background:var(--bg3)}
  .entity.sel{background:rgba(79,143,255,.08); color:var(--accent); border-color:rgba(79,143,255,.3)}
  .impact-arrow{color:var(--text3); font-size:12px; padding:5px 0}
  .entity-row{padding:7px 10px; border-radius:7px; font-family:ui-monospace,Menlo,monospace; font-size:12px; color:var(--text)}

  /* Log */
  .log{font-family:ui-monospace,Menlo,monospace; font-size:11.5px; line-height:1.8; color:var(--text2)}
  .log .ok{color:var(--green)} .log .warn{color:var(--yellow)} .log .info{color:var(--accent)}

  ::-webkit-scrollbar{width:9px;height:9px} ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:5px} ::-webkit-scrollbar-track{background:transparent}
</style>
<!-- Google Analytics telemetry: ON by default (usage events only — never source code, file names or analysis data; events go to Google and may be associated with browser/device identifiers). Can be disabled via Debug → Telemetry button, choice persisted. -->
</head>
<body>

<!-- reforge.html — redesign mockup (companion to index.html, the landing). Host in the same GitHub Pages repo. -->

<header>
  <div class="logo">REFORGE<span>.io</span></div>
  <div class="header-tag">Legacy Analyzer</div>
  <div class="header-spacer"></div>
  <div class="status"><div class="dot"></div><span id="statusText">Ready</span></div>
  <a class="header-link" href="mailto:adrien@vyniad.be">adrien@vyniad.be</a>
  <button class="theme-btn" id="themeBtn">☀</button>
</header>

<div class="workspace">
  <aside class="left">
    <div class="panel-h">⬆ Source</div>
    <div class="dropzone" id="dz">
      <input type="file" id="fileInput" multiple style="display:none">
      <span class="icon">📁</span>
      Drop your legacy files here<br>
      JCL · COBOL · CPY — or a Reforge project (.json)<br>
      or <span class="browse">browse files</span>
    </div>
    <button class="sample-btn" id="sampleBtn">⚡ Try with a sample system</button>
    <div class="file-list" id="fileList"></div>
    <button class="clear-btn" id="clearAll" onclick="clearAllFiles()" style="display:none">Clear all files</button>
    <div class="stat-grid" id="stats"></div>
    <button class="analyze-btn" id="analyzeBtn" disabled>▶ Analyze</button>
    <button class="analyze-btn" id="exportBtn" style="display:none;margin-top:8px">⬇ Export project (.json)</button>
  </aside>

  <main class="right">
    <nav class="groups" id="groups"></nav>
    <nav class="subtabs" id="subtabs"></nav>
    <section class="content" id="content"></section>
  </main>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  WORKING PROTOTYPE: real drop + detection + parsing
//  (embedded mini-analyzer to demonstrate the UX)
// ═══════════════════════════════════════════════════════════

// ── Navigation: 4 groups instead of 13 flat tabs ──
const NAV = [
  { id:'explore',   icon:'🗺', label:'Explore',   subs:[ {id:'map',label:'System Map'}, {id:'flow',label:'Flow'}, {id:'programs',label:'Programs'}, {id:'data',label:'Data'} ] },
  { id:'analyze',   icon:'🔬', label:'Analyze',  subs:[ {id:'impact',label:'Impact'}, {id:'lineage',label:'Data Lineage'}, {id:'db2',label:'DB2 / SQL'}, {id:'summary',label:'Summary'}, {id:'delta',label:'Version Diff'}, {id:'history',label:'History'} ] },
  { id:'modernize', icon:'⚡', label:'Modernize', subs:[ {id:'python',label:'COBOL → Python',hot:true}, {id:'ai',label:'AI Explain',hot:true} ] },
  { id:'tech',      icon:'🛠', label:'Tech',      subs:[ {id:'source',label:'Source'}, {id:'copybooks',label:'Copybooks'}, {id:'debug',label:'Debug'} ] },
];

const state = { files:[], loaded:false, log:[], group:'explore', sub:'map', entity:null, srcFile:null, pySel:null, srcIdx:null, _model:null, _testResults:null, delta:null, history:[], histA:null, histB:null };

// ══════════════════ 1. DETECTION & PARSING (real) ══════════════════

function base(n){ return n.replace(/\.[^.]+$/,'').toUpperCase(); }

function detectLang(name, text){
  const ext = (name.split('.').pop()||'').toUpperCase();
  const t = text.toUpperCase();
  if (ext === 'JCL') return 'JCL';
  if (ext === 'CPY' || ext === 'COPY') return 'CPY';
  if (ext === 'REX' || ext === 'EXEC') return 'REXX';
  if (/^\s*\/\*\s*REXX/i.test(text)) return 'REXX';
  // Job execution log (SDSF/SAR/ESF export): dedicated extension or JES patterns
  // standard (IEF142I COND CODE, IEF450I ABEND, $HASP373/$HASP395).
  if (['LOG','SDSF','SAR','JOBLOG','JESMSGLG'].includes(ext)) return 'JOBLOG';
  if (/IEF142I .+COND CODE|IEF450I .+ABNORMAL ENDED|\$HASP373 .+STARTED|\$HASP395 .+ENDED - RC=/i.test(text)) return 'JOBLOG';
  if (/\bIDENTIFICATION DIVISION\b/.test(t) || /\bPROGRAM-ID\b/.test(t)) return 'CBL';
  if (/^\s*\/\//m.test(t) && /\b(EXEC|PROC|JOB|DD)\b/.test(t)) return 'JCL';
  if (/\bPIC(TURE)?\s+[S9VX]/i.test(text) && !/\bPROCEDURE DIVISION\b/.test(t)) return 'CPY';
  if (/\b(DIVISION|SECTION)\b/.test(t)) return 'CBL';
  if (ext === 'CBL' || ext === 'COB' || ext === 'CB2') return 'CBL';
  // Scheduler export: dedicated extension or JOB <job> AFTER <predecessors> format
  if (ext === 'SCH' || ext === 'SCHED' || /^JOB\s+[A-Z0-9@#$.\-]+\s+AFTER\b/m.test(t)) return 'SCHED';
  return 'TXT';
}

// ── JCL ENGINE v2 ─────────────────────────────────────────────────────────
// Real tokenizer → statement parser → model builder. Handles:
// JOB/EXEC/DD/PROC/PEND/SET/IF-ELSE-ENDIF/INCLUDE/JCLLIB, in-stream PROC
// expansion, symbolic parameters (SET, PROC defaults, EXEC symbols),
// EXEC overrides (PROCSTEP.DD.PARAM), DISP input/output classification,
// GDG (±n), temp datasets (&&), in-stream data (DD *), continuations,
// columns 73-80. Never throws: anything unrecognized lands in warnings[].

const JCL_OPS = new Set([
  'JOB', 'EXEC', 'DD', 'PROC', 'PEND', 'SET', 'IF', 'ELSE', 'ENDIF',
  'OUTPUT', 'INCLUDE', 'JCLLIB', 'COMMAND', 'XMIT', 'CNTL', 'ENDCNTL', 'EXPORT',
]);
const EXEC_STD_PARAMS = new Set([
  'PGM', 'PROC', 'PARM', 'COND', 'RD', 'TIME', 'REGION', 'ADDRSPC', 'DYNAMNBR',
  'CLASS', 'MSGCLASS', 'MSGLEVEL', 'NOTIFY', 'USER', 'PASSWORD', 'TYPRUN', 'ACCT',
]);

function tokenizeStatements(text, warnings){
  const statements = [];
  const lines = text.split(/\r?\n/);
  let inStreamData = false, curInline = null, inDlm = null, inData = false;
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].slice(0, 72).trimEnd();
    const ln = i + 1;
    if (!line.trim()) continue;
    if (inStreamData) {
      // JCL Reference rules (honest, tested):
      //  • DLM='xx' coded: ONLY the delimiter ends the data — lines
      //    starting with // or /* are DATA (that is the purpose of DLM).
      //  • DD DATA without DLM: /* ends the data, but // lines
      //    are DATA (DATA vs * difference).
      //  • DD * without DLM: // or /* end it (historical behavior).
      if (inDlm) {
        if (line.trim().toUpperCase() === inDlm) { inStreamData = false; curInline = null; inDlm = null; inData = false; continue; }
        if (curInline) curInline.push({ ln, text: line });
        continue;
      }
      if (line.startsWith('/*')) { inStreamData = false; curInline = null; inData = false; }
      else if (line.startsWith('//')) {
        if (inData) { if (curInline) curInline.push({ ln, text: line }); continue; } // DD DATA: // is data
        inStreamData = false; curInline = null; inData = false;
      }
      else { if (curInline) curInline.push({ ln, text: line }); continue; }
    }
    if (line.startsWith('/*')) continue;
    if (line.startsWith('//*')) continue;
    if (!line.startsWith('//')) { warnings.push(`L${ln}: non-JCL line ignored`); continue; }
    const rest = line.slice(2);
    if (rest.trim() === '') continue;
    const firstTok = rest.trim().split(/\s+/)[0];
    const looksLikeContinuation =
      firstTok.includes('=') ||
      firstTok.startsWith("'") ||
      (statements.length > 0 && statements[statements.length - 1].operands.trim().endsWith(','));
    if (looksLikeContinuation && !JCL_OPS.has(firstTok.toUpperCase())) {
      const prev = statements[statements.length - 1];
      if (prev && (prev.op === 'EXEC' || prev.op === 'DD' || prev.op === 'PROC' || prev.op === 'SET')) {
        prev.operands += ' ' + rest.trim();
        continue;
      }
      warnings.push(`L${ln}: orphan continuation ignored`);
      continue;
    }
    const t = rest.trim().match(/^(\S+)(?:\s+(.*))?$/);
    if (!t) continue;
    let name = null, op = null, operands = t[2] || '';
    if (JCL_OPS.has(t[1].toUpperCase())) {
      op = t[1].toUpperCase();
    } else {
      name = t[1];
      const t2 = operands.match(/^(\S+)\s*(.*)$/);
      if (t2 && JCL_OPS.has(t2[1].toUpperCase())) {
        op = t2[1].toUpperCase();
        operands = t2[2] || '';
      } else {
        const prev = statements[statements.length - 1];
        if (prev) { prev.operands += ' ' + rest.trim(); continue; }
        warnings.push(`L${ln}: unrecognized statement ignored ("${t[1]}")`);
        continue;
      }
    }
    const st = { name, op, operands: operands.trim(), line: ln };
    if (op === 'DD' && /^(\*|DATA\b)/.test(operands.trim())) {
      inStreamData = true; curInline = st.inline = [];
      inData = /^DATA\b/.test(operands.trim());
      const dm = operands.toUpperCase().match(/DLM\s*=\s*'([^']*)'/);
      inDlm = dm ? dm[1] : null;
    }
    statements.push(st);
  }
  return statements;
}

function parseParams(operands){
  const parts = [];
  let depth = 0, quote = false, cur = '';
  for (const ch of operands) {
    if (quote) { cur += ch; if (ch === "'") quote = false; continue; }
    if (ch === "'") { quote = true; cur += ch; continue; }
    if (ch === '(') depth++;
    if (ch === ')') depth--;
    if (ch === ',' && depth === 0) { parts.push(cur.trim()); cur = ''; continue; }
    cur += ch;
  }
  if (cur.trim()) parts.push(cur.trim());
  const out = {};
  for (const p of parts) {
    if (!p) continue;
    const eq = p.indexOf('=');
    if (eq > 0) out[p.slice(0, eq).toUpperCase()] = p.slice(eq + 1).replace(/^'|'$/g, '');
    else out[p.toUpperCase()] = true;
  }
  return out;
}

function substitute(value, symbols){
  if (typeof value !== 'string') return value;
  const s = value.replace(/&([A-Z@$#][A-Z0-9@$#]*)/gi, (m, v) => {
    const up = v.toUpperCase();
    if (symbols[up] !== undefined && symbols[up] !== true) return symbols[up];
    return m;
  });
  return s.replace(/\.\./g, '.');
}

function classifyUsage(p){
  // no DISP → no invented usage: 'unknown' + downstream warning
  if (p.DISP === undefined || typeof p.DISP !== 'string') return 'unknown';
  const disp = p.DISP.toUpperCase();
  const first = disp.startsWith('(') ? disp.slice(1) : disp;
  const head = first.split(/[,(]/)[0].trim();
  if (head === '') return 'output';   // DISP=(,CATLG): omitted status = NEW
  if (head === 'NEW' || head === 'MOD') return 'output';
  if (head === 'SHR' || head === 'OLD') return 'input';
  return 'unknown';
}

function buildDD(st, p, symbols){
  const dd = { ddname: st.name, line: st.line };
  if (p.DSN !== undefined) {
    const dsn = substitute(p.DSN, symbols);
    if (dsn.startsWith('&&')) {
      dd.name = dsn.toUpperCase(); dd.temp = true; dd.usage = 'output';
    } else if (dsn.startsWith('*.')) {
      // back reference: DSN=*.STEP01.SORTOUT (temp passed from one step to another)
      dd.name = dsn.toUpperCase(); dd.backref = true; dd.usage = classifyUsage(p);
    } else {
      const g = dsn.match(/^(.*)\(([-+]?\d+)\)$/);
      if (g) { dd.name = g[1].toUpperCase(); dd.gdg = parseInt(g[2], 10); }
      else dd.name = dsn.toUpperCase();
      dd.usage = classifyUsage(p);
    }
  } else if (p.SYSOUT !== undefined) { dd.sysout = String(p.SYSOUT); dd.usage = 'output'; }
  else if (p.DUMMY !== undefined) { dd.dummy = true; }
  if (p.DISP !== undefined && typeof p.DISP === 'string') dd.disp = p.DISP.toUpperCase();
  if (p.SPACE !== undefined) dd.space = String(p.SPACE);
  return dd;
}

// ── DD overrides of a PROC: "//STEPNAME.DDNAME DD …" cards placed after the EXEC.
// Reliability: an unresolved override → explicit warning, NEVER silence;
// the effective dataset (after override) is the one shown in the lineage.
function applyProcDdOverrides(step, proc, copies, symbols, warn){
  const seen = new Set();
  for (const odd of (step.dds || [])){
    const raw = String(odd.ddname || '').toUpperCase();
    const parts = raw.split('.');
    if (parts.length < 2 || !parts[1]){
      warn(`DD ${odd.ddname} follows EXEC ${step.name} of PROC ${proc.name} without a stepname.ddname qualifier — not a valid override, ignored`);
      continue;
    }
    const psCopy = copies.find(c => (c.name || '').toUpperCase() === parts[0]);
    if (!psCopy){
      warn(`override ${raw} (after EXEC ${step.name}) matches no step named ${parts[0]} in PROC ${proc.name} — ignored`);
      continue;
    }
    if (parts.length >= 3){
      // nested override (OUTER.STEP.DD): re-emitted on the copy for the next
      // iteration (the PROC copy will be expanded in turn) — otherwise it is an error
      if (psCopy.kind === 'PROC'){
        const resid = JSON.parse(JSON.stringify(odd));
        resid.ddname = parts.slice(1).join('.');
        psCopy.dds.push(resid);
      } else {
        warn(`override ${raw}: ${parts[0]} is not a nested PROC in ${proc.name} — ignored`);
      }
      continue;
    }
    const targets = psCopy.dds.filter(d => (d.ddname || '').toUpperCase() === parts[1]);
    if (!targets.length){
      warn(`override ${raw} (after EXEC ${step.name}) matches no DD named ${parts[1]} in step ${parts[0]} of PROC ${proc.name} — ignored`);
      continue;
    }
    if (targets.length > 1)
      warn(`override ${raw}: the PROC step concatenates DD ${parts[1]} — the override applies to the FIRST member, the others are unchanged`);
    if (seen.has(raw)){
      // 2nd card (or more) for the same STEPNAME.DDNAME → CONCATENATION in real JCL:
      // each card adds a dataset to the DD (order kept). Each dataset is
      // materialized with its own suffixed ddname — no more silent loss.
      if (odd.dummy === true){ warn(`override ${raw}: DD DUMMY in concatenation — empty member, no dataset edge`); continue; }
      if (odd.name === undefined){ warn(`override ${raw}: concatenation card without DSN — nothing to apply`); continue; }
      const nname = substitute(odd.name, symbols);
      if (nname.includes('&')) psCopy.hasUnresolvedSymbols = true;
      let n = 2;
      while (psCopy.dds.some(d => d.ddname === parts[1] + '#' + n)) n++;
      psCopy.dds.push({ ddname: parts[1] + '#' + n, line: odd.line, name: nname, temp: odd.temp, gdg: odd.gdg,
        usage: odd.usage, disp: odd.disp, sysout: odd.sysout, space: odd.space, overriddenBy: raw, concatenated: true });
      continue;
    }
    seen.add(raw);
    const t = targets[0];
    const fields = ['name','temp','gdg','usage','sysout','dummy','disp','space','backref'];
    if (!fields.some(k => odd[k] !== undefined)){
      warn(`override ${raw}: card carries no DSN/DISP/SYSOUT/DUMMY/SPACE parameter — nothing to apply`);
      continue;
    }
    for (const k of fields){
      if (k === 'name' && odd.name !== undefined){
        t.name = substitute(odd.name, symbols);
        if (t.name.includes('&')) psCopy.hasUnresolvedSymbols = true;
      } else if (odd[k] !== undefined){
        t[k] = odd[k];
      }
    }
    // DD DUMMY as override: no more dataset I/O — the DSN is removed (no invented edge)
    if (odd.dummy === true){ delete t.name; delete t.backref; }
    t.overriddenBy = raw; // evidence: visible in stepDesc and the edge note
  }
}

function linkProcs(result){
  for (const job of result.jobs) {
    // Iterative expansion: a nested PROC may call another PROC —
    // loop to the fixed point (guard 10), chain followed to detect
    // recursion (a PROC calling itself: flagged, never expanded).
    let guard = 0, changed = true;
    while (changed && guard < 10){
      changed = false; guard++;
      const expanded = [];
      for (const step of job.steps) {
        if (step.kind !== 'PROC' || !step.target) { expanded.push(step); continue; }
        if (step.resolved === false) { expanded.push(step); continue; } // already flagged (not found)
        const proc = result.procs[step.target];
        if (!proc) {
          step.resolved = false;
          expanded.push(step);
          result.warnings.push(`${job.name}: PROC ${step.target} not found (external cataloged proc?)`);
          job.procsUsed.push(step.target);
          continue;
        }
        if ((step.chain || []).includes(step.target)){
          expanded.push(step);
          if (!result.warnings.some(w => w.includes(`recursive PROC ${step.target}`)))
            result.warnings.push(`${job.name}: recursive PROC call to ${step.target} — not expanded`);
          continue;
        }
        step.resolved = true;
        changed = true;
        job.procsUsed.push(proc.name);
        const symbols = { ...proc.defaults, ...step.symbols };
        const copies = [];
        for (const ps of proc.steps) {
          const copy = JSON.parse(JSON.stringify(ps));
          copy.proc = proc.name;
          copy.via = step.name;
          copy.chain = [...(step.chain || []), proc.name];
          for (const dd of copy.dds) {
            if (dd.name) {
              dd.name = substitute(dd.name, symbols);
              if (dd.name.includes('&')) copy.hasUnresolvedSymbols = true;
            }
          }
          for (const [ov, val] of Object.entries(step.overrides)) {
            const parts = ov.split('.');
            const ddname = parts.length >= 3 ? parts[1].toUpperCase() : parts[0].toUpperCase();
            const param = (parts.length >= 3 ? parts.slice(2) : parts.slice(1)).join('.').toUpperCase();
            const dd = copy.dds.find(d => (d.ddname || '').toUpperCase() === ddname);
            if (dd) dd['ov_' + param] = val;
          }
          copies.push(copy);
        }
        // overrides "//STEP.DD DD …" of the calling step: applied to the copies, with a warning if unresolved
        applyProcDdOverrides(step, proc, copies, symbols, msg => result.warnings.push(`${job.name}: ${msg}`));
        for (const c of copies) expanded.push(c);
      }
      job.steps = expanded;
    }
  }
}

// INCLUDE MEMBER=X: if the member is uploaded (JCL file of the project), its
// statements are spliced into the stream — otherwise precise warning, never guessed.
function resolveIncludes(stmts, members, stack, warns){
  const out = [];
  for (const st of stmts){
    if (st.op !== 'INCLUDE'){ out.push(st); continue; }
    const p = parseParams(st.operands);
    let member = null;
    if (typeof p.MEMBER === 'string' && p.MEMBER) member = p.MEMBER.trim().toUpperCase();
    else {
      const raw = st.operands.trim();
      const dn = raw.match(/\(([^()]+)\)\s*$/); // INCLUDE DSN=X.Y(NAME) or MEMBER=X.Y(NAME)
      member = dn ? dn[1].toUpperCase() : raw.split(/\s+/)[0].toUpperCase();
    }
    if (!member){ warns.push(`L${st.line}: INCLUDE without member name — ignored`); continue; }
    if (stack.includes(member)){ warns.push(`L${st.line}: INCLUDE ${member} circular — skipped`); continue; }
    if (stack.length >= 5){ warns.push(`L${st.line}: INCLUDE nesting deeper than 5 — stopped`); continue; }
    const text = members[member];
    if (text == null){
      warns.push(`L${st.line}: INCLUDE member ${member} not uploaded — statements not available`);
      out.push(st);
      continue;
    }
    out.push(...resolveIncludes(tokenizeStatements(text, warns), members, stack.concat(member), warns));
  }
  return out;
}

// ── SORT cards (DFSORT): honest analysis of SYSIN cards, no invention ──
function parseSortCards(text){
  const info = { type: null, fields: [], format: null, sum: null, decoded: false };
  const cards = (text || '').toUpperCase().split(/\r?\n/).map(l => l.trim()).filter(l => l && !l.startsWith('*'));
  const fmtCard = cards.find(c => /FORMAT\s*=/.test(c));
  if (fmtCard){ const fm = fmtCard.match(/FORMAT\s*=\s*([A-Z0-9]+)/); if (fm) info.format = fm[1]; }
  for (const card of cards){
    if (/^SORT\b/.test(card) && /FIELDS\s*=\s*COPY\b/.test(card)){ info.type = 'copy'; info.decoded = true; continue; }
    const m = (/^SORT\b/.test(card) && card.match(/FIELDS\s*=\s*\(([^)]*)\)/));
    if (m){
      info.type = 'sort';
      const fm = card.match(/FORMAT\s*=\s*([A-Z0-9]+)/);
      if (fm) info.format = fm[1];
      const toks = m[1].split(',').map(s => s.trim()).filter(Boolean);
      if (toks.length % 4 === 0 && toks.every((t, i) => (i % 4 === 2) ? /^(CH|ZD|PD|BI|FS|AC)$/.test(t) : (i % 4 === 3) ? /^[ABD]$/.test(t) : /^\d+$/.test(t))){
        for (let i = 0; i < toks.length; i += 4) info.fields.push({ pos: +toks[i], len: +toks[i+1], type: toks[i+2], order: toks[i+3] });
      } else if (info.format && toks.length % 3 === 0 && toks.every((t, i) => (i % 3 === 2) ? /^[ABD]$/.test(t) : /^\d+$/.test(t))){
        // short form: (p,l,order,...) with global FORMAT=
        for (let i = 0; i < toks.length; i += 3) info.fields.push({ pos: +toks[i], len: +toks[i+1], type: info.format, order: toks[i+2] });
      }
      if (info.fields.length) info.decoded = true;
      continue;
    }
    if (/^SUM\s+FIELDS\s*=\s*NONE\b/.test(card)){ info.sum = 'none'; continue; }
    const sm = card.match(/^SUM\s+FIELDS\s*=\s*(\([^)]*\)|[A-Z0-9,=]+)/);
    if (sm){ info.sum = sm[1]; continue; }
    // INCLUDE/OMIT COND: recursive decoding, literals respected (C'…', X'…',
    // commas included) and parentheses. Decoded forms: (p,l,type,OP,val),
    // short form (p,type,OP,val) with global FORMAT=, field-to-field comparison
    // (p,l,type,OP,p2,l2), joined by AND/OR (comma = AND). Any sub-condition
    // unknown → the whole card stays raw and marked undecoded — never guessed.
    const im = card.match(/^(INCLUDE|OMIT)\s+COND\s*=\s*(.+?)\s*$/);
    if (im){
      const blk = { raw: im[2], conds: [], joins: [], decoded: false };
      info[im[1] === 'INCLUDE' ? 'include' : 'omit'] = blk;
      const TYPE = /^(CH|ZD|PD|BI|FS|AC)$/, OPR = /^(EQ|NE|GT|GE|LT|LE)$/;
      const VAL = t => /^\d+$/.test(t) || /^C'[^']*'$/.test(t) || /^X'[0-9A-F]*'$/.test(t);
      const splitTop = (s) => { // split at level 0, respects '…' and (…)
        const out = []; let d = 0, q = false, cur = '';
        for (let i = 0; i < s.length; i++){
          const ch = s[i];
          if (q){ cur += ch; if (ch === "'") q = false; continue; }
          if (ch === "'"){ q = true; cur += ch; continue; }
          if (ch === '(') d++;
          else if (ch === ')') d--;
          if (ch === ',' && d === 0){ out.push(cur); cur = ''; continue; }
          cur += ch;
        }
        out.push(cur);
        return out.map(x => x.trim()).filter(Boolean);
      };
      const unwrap = (t) => { // remove enclosing parentheses (quote-aware)
        while (t.startsWith('(') && t.endsWith(')')){
          let d = 0, ok = true, q = false;
          for (let i = 0; i < t.length; i++){
            const ch = t[i];
            if (q){ if (ch === "'") q = false; continue; }
            if (ch === "'"){ q = true; continue; }
            if (ch === '(') d++;
            else if (ch === ')'){ d--; if (d === 0 && i < t.length - 1){ ok = false; break; } }
          }
          if (!ok) break;
          t = t.slice(1, -1).trim();
        }
        return t;
      };
      const parseCond = toks => {
        if (toks.length === 5 && /^\d+$/.test(toks[0]) && /^\d+$/.test(toks[1]) && TYPE.test(toks[2]) && OPR.test(toks[3]) && VAL(toks[4]))
          return { pos: +toks[0], len: +toks[1], type: toks[2], op: toks[3], value: toks[4] };
        if (toks.length === 4 && info.format && /^\d+$/.test(toks[0]) && TYPE.test(toks[1]) && OPR.test(toks[2]) && VAL(toks[3]))
          return { pos: +toks[0], len: null, type: toks[1], op: toks[2], value: toks[3] };
        if (toks.length === 6 && toks.every((t, i) => (i === 2 ? TYPE.test(t) : i === 3 ? OPR.test(t) : /^\d+$/.test(t))))
          return { pos: +toks[0], len: +toks[1], type: toks[2], op: toks[3], value: toks[4] + ',' + toks[5], field2: true };
        return null;
      };
      const walk = toks => {
        const conds = [], joins = [];
        let i = 0, expectCond = true;
        while (i < toks.length){
          const t = toks[i];
          if (/^(AND|OR)$/.test(t)){
            if (expectCond || !conds.length) return null;
            joins.push(t); expectCond = true; i++; continue;
          }
          if (!expectCond) joins.push('AND'); // implicit comma between 2 sub-conditions
          if (t.startsWith('(') && t.endsWith(')')){
            const sub = walk(splitTop(unwrap(t)));
            if (!sub) return null;
            conds.push(...sub.conds); joins.push(...sub.joins);
            expectCond = false; i++; continue;
          }
          let j = i; const rest = [];
          while (j < toks.length && !/^(AND|OR)$/.test(toks[j]) && !toks[j].startsWith('(')){ rest.push(toks[j]); j++; }
          if (j === i) return null;
          const c = parseCond(rest);
          if (!c) return null;
          conds.push(c); expectCond = false; i = j;
        }
        return expectCond ? null : { conds, joins };
      };
      const res = walk(splitTop(unwrap(blk.raw)));
      if (res && res.conds.length){ blk.conds = res.conds; blk.joins = res.joins; blk.decoded = true; }
      continue;
    }
    // INREC/OUTREC BUILD/OVERLAY/FIELDS: reassembly of (pos,len) pairs
    // and (out:pos,len) / (out:literal) — the rest stays raw, never invented.
    const ir = card.match(/^(INREC|OUTREC)\s+(BUILD|OVERLAY|FIELDS)\s*=\s*\(?(.+?)\)?\s*$/);
    if (ir){
      const blk = { kind: ir[2], raw: ir[3], items: [], decoded: false };
      const toks = ir[3].split(',').map(x => x.trim()).filter(Boolean);
      let ok = toks.length > 0;
      let i = 0;
      while (ok && i < toks.length){
        const t = toks[i];
        const m2 = t.match(/^(\d+):(\d+)$/);
        if (m2 && i + 1 < toks.length && /^\d+$/.test(toks[i+1])){ blk.items.push({ out: +m2[1], pos: +m2[2], len: +toks[i+1] }); i += 2; }
        else if (/^\d+$/.test(t) && i + 1 < toks.length && /^\d+$/.test(toks[i+1])){ blk.items.push({ out: null, pos: +t, len: +toks[i+1] }); i += 2; }
        else { const m3 = t.match(/^(\d+):C'(.*)'$/); if (m3){ blk.items.push({ out: +m3[1], literal: m3[2] }); i += 1; } else { ok = false; blk.items = []; } }
      }
      blk.decoded = ok && blk.items.length > 0;
      info[ir[1] === 'INREC' ? 'inrec' : 'outrec'] = blk;
      continue;
    }
    // OUTFIL FNAMES/OUTDD: additional outputs of the sort — named DDs
    // become known outputs of the step (real usage, no more "unknown").
    if (/^OUTFIL\b/.test(card)){
      const blk = { raw: card, names: [], decoded: false };
      const fn = card.match(/FNAMES?\s*=\s*\(([^)]+)\)/) || card.match(/FNAMES?\s*=\s*([A-Z0-9\-@#$.]+)/);
      const od = card.match(/OUTDD\s*=\s*\(([^)]+)\)/) || card.match(/OUTDD\s*=\s*([A-Z0-9\-@#$.]+)/);
      (fn ? fn[1].split(',') : []).forEach(x => { if (x.trim()) blk.names.push(x.trim()); });
      (od ? od[1].split(',') : []).forEach(x => { if (x.trim()) blk.names.push(x.trim()); });
      blk.decoded = blk.names.length > 0;
      (info.outfil = info.outfil || []).push(blk);
      continue;
    }
    // OPTION COPY: sort bypassed, pure copy — decoded. Other OPTION parameters
    // (EQUALS, DYNALLOC, etc.): recognized, not decoded (documented).
    if (/^OPTION\b/.test(card)){
      if (/\bCOPY\b/.test(card)){ info.type = 'copy'; info.decoded = true; info.optionCopy = true; }
      continue;
    }
    // RECORD/MODS/DEBUG/END: recognized, not decoded (documented)
    if (/^(RECORD|MODS|DEBUG|END)\b/.test(card)) continue;
  }
  return info;
}

// ── Scheduler: scheduling export (documented format, never guessed) ──
// Accepted format (one statement per line, case-insensitive):
//   JOB <JOBNAME> AFTER <JOB1>,<JOB2>,…      (# or * = comment)
// The scheduler IS the source of the execution order: a declared dependency
// makes the order CERTAIN. Unknown lines, invalid names, self-dependencies and
// cycles → explicit warnings — no inference, never hidden.
function parseSched(text){
  const S = { deps: [], warnings: [] };
  const seen = new Map();
  (text || '').split(/\r?\n/).forEach((raw, i) => {
    const l = raw.trim();
    if (!l || l.startsWith('#') || l.startsWith('*')) return;
    const m = l.match(/^JOB\s+([A-Z0-9@#$.\-]{1,8})\s+AFTER\s+(.+)$/i);
    if (!m){ S.warnings.push('line ' + (i + 1) + ': not a "JOB … AFTER …" declaration — ignored, kept raw'); return; }
    const job = m[1].toUpperCase();
    const parts = m[2].split(',').map(x => x.trim().toUpperCase());
    const afters = parts.filter(x => /^[A-Z0-9@#$.\-]{1,8}$/.test(x));
    parts.filter(x => x && !/^[A-Z0-9@#$.\-]{1,8}$/.test(x))
      .forEach(x => S.warnings.push('line ' + (i + 1) + ': predecessor "' + x + '" is not a valid job name — ignored'));
    const rec = seen.get(job) || { job, after: [] };
    afters.forEach(a => {
      if (a === job){ S.warnings.push('job ' + job + ': declared AFTER itself — ignored (self-cycle)'); return; }
      if (!rec.after.includes(a)) rec.after.push(a);
    });
    seen.set(job, rec);
  });
  S.deps = [...seen.values()];
  S.deps.forEach(d => d.after.forEach(a => {
    const r = seen.get(a);
    if (r && r.after.includes(d.job)) S.warnings.push('cycle: ' + d.job + ' AFTER ' + a + ' and ' + a + ' AFTER ' + d.job + ' — order undefined, both edges kept as declared');
  }));
  return S;
}

// ── Job execution log (SDSF/SAR/ESF export): real RCs per step ────────────
// The ONLY legitimate source to evaluate COND/IF. Recognized formats (JESMSGLG
// standard) : IEF142I (COND CODE), IEF450I (ABEND), IEF453I (flush),
// $HASP373/$HASP395 (job name), and the simplified form "STEP RC=nnnn".
// Everything else is honestly ignored — never a guessed RC.
function parseJobLog(text){
  const LG = { logs: [], warnings: [] };
  const byJob = {};
  let cur = null; // last job seen ($HASP373) for the simplified form
  let recognized = 0;
  const ensure = (job) => {
    if (!job) return null;
    if (!byJob[job]){ byJob[job] = { job, steps: [], jobRc: null }; LG.logs.push(byJob[job]); }
    return byJob[job];
  };
  const setStep = (job, step, patch) => {
    const J = ensure(job); if (!J || !step) return;
    let s = J.steps.find(x => x.name === step);
    if (!s){ s = { name: step, rc: null, abend: null, flushed: false }; J.steps.push(s); }
    Object.assign(s, patch);
  };
  String(text || '').split(/\r?\n/).forEach(raw => {
    const line = raw.replace(/\s+$/, '');
    let m;
    if ((m = /(?:^|\s)IEF142I\s+(\S+)\s+(\S+).*COND CODE\s+(\d{1,8})/i.exec(line))){
      recognized++; setStep(m[1].toUpperCase(), m[2].toUpperCase(), { rc: parseInt(m[3], 10) });
    } else if ((m = /(?:^|\s)IEF450I\s+(\S+)\s+(\S+).*ABEND=([A-Z0-9]+)(?:\s+U(\d+))?/i.exec(line))){
      recognized++; setStep(m[1].toUpperCase(), m[2].toUpperCase(), { abend: (m[3] + (m[4] ? ' U' + m[4] : '')).toUpperCase() });
    } else if (/IEF453I/i.test(line) && /FLUSH/i.test(line) && (m = /(?:^|\s)IEF453I\s+(\S+)\s+(\S+)/i.exec(line))){
      recognized++; setStep(m[1].toUpperCase(), m[2].toUpperCase(), { flushed: true });
    } else if ((m = /\$HASP373\s+(\S+)\s+STARTED/i.exec(line))){
      recognized++; cur = m[1].toUpperCase(); ensure(cur);
    } else if ((m = /\$HASP395\s+(\S+)\s+ENDED\s*-\s*RC\s*=\s*(\d{1,8})/i.exec(line))){
      recognized++; cur = m[1].toUpperCase(); const J = ensure(cur); if (J) J.jobRc = parseInt(m[2], 10);
    } else if (cur && (m = /^\s*([A-Z][A-Z0-9@#$.\-]{0,7})\s+(?:-\s+)?RC\s*(?:=|:)?\s*(\d{1,8})\s*$/i.exec(line))){
      recognized++; setStep(cur, m[1].toUpperCase(), { rc: parseInt(m[2], 10) });
    }
  });
  if (!recognized) LG.warnings.push('job log uploaded but no JES/SDSF step status recognized — supported: IEF142I COND CODE, IEF450I ABEND, IEF453I flush, $HASP373/$HASP395, or STEP RC=nnnn (site-specific formats vary; nothing guessed)');
  return LG;
}

// ── REXX: minimal honest analysis — literal CALL, CALL via variable, quoted datasets ──
function parseREXX(fname, text){
  const R = { execName: null, calls: [], dsns: [], warns: [] };
  const nm = text.match(/\/\*\s*REXX\s+([A-Z0-9\-@#$.]+)/i);
  R.execName = (nm ? nm[1] : base(fname)).toUpperCase();
  const lines = text.split(/\r?\n/);
  // internal labels: LABEL: — so an internal jump is not mistaken for an external call
  const labels = new Set();
  lines.forEach(raw => { const lm = raw.match(/^\s*([A-Z][A-Z0-9\-@#$]*)\s*:\s*$/i); if (lm) labels.add(lm[1].toUpperCase()); });
  // code outside block comments /* */ (non-nested), '...' literals kept
  let inCmt = false;
  const codeAt = [];
  lines.forEach((raw, idx) => {
    let l = raw, out = '';
    while (l.length){
      if (inCmt){
        const e = l.indexOf('*/');
        if (e < 0){ l = ''; break; }
        l = l.slice(e + 2); inCmt = false;
      } else {
        const s = l.search(/\/\*|'/);
        if (s < 0){ out += l; break; }
        if (l[s] === "'"){
          out += l.slice(0, s);
          let j = s + 1;
          while (j < l.length){ if (l[j] === "'"){ if (l[j+1] === "'"){ j += 2; continue; } break; } j++; }
          out += l.slice(s, Math.min(j + 1, l.length)); l = l.slice(Math.min(j + 1, l.length));
        } else { out += l.slice(0, s); l = l.slice(s + 2); inCmt = true; }
      }
    }
    if (out.trim()) codeAt.push({ ln: idx + 1, code: out });
  });
  const SEG = '[A-Z0-9\\-#@]{1,8}';
  codeAt.forEach(({ ln, code }) => {
    const U = code.toUpperCase();
    let m;
    const callRe = /\bCALL\s+(?:'([^']*)'|([A-Z][A-Z0-9\-@#$.]*))/g;
    while ((m = callRe.exec(U))){
      if (m[1] !== undefined){ if (m[1].trim()) R.calls.push({ target: m[1].trim(), quoted: true, ln }); }
      else if (m[2] === 'ON' || m[2] === 'OFF') continue;         // CALL ON/OFF condition — not a call
      else if (labels.has(m[2])) continue;                         // internal label
      else R.calls.push({ viaVar: m[2], ln });                     // CALL via variable — unknown target
    }
    const dsnRe = new RegExp("'(" + SEG + "(?:\\." + SEG + ")+)(\\([A-Z0-9\\-#@$.]+\\))?'", 'g');
    while ((m = dsnRe.exec(U))) R.dsns.push({ name: m[1], member: m[2] ? m[2].slice(1, -1) : null, ln });
  });
  R.dsns = [...new Map(R.dsns.map(d => [d.name, d])).values()]; // deduplicated, first line number kept
  return R;
}

function parseJCL(text, members){
  const warnings = [];
  const stmts = resolveIncludes(tokenizeStatements(text, warnings), members || {}, [], warnings);
  const result = { jobs: [], procs: {}, warnings };
  let job = null;
  let procDef = null;
  let procStack = [];
  let condStack = [];
  let globalSymbols = {};
  for (const st of stmts) {
    switch (st.op) {
      case 'JOB':
        job = { name: st.name, line: st.line, params: parseParams(st.operands), steps: [], procsUsed: [] };
        result.jobs.push(job);
        procDef = null; procStack = []; condStack = [];
        break;
      case 'SET':
        Object.assign(globalSymbols, parseParams(st.operands));
        break;
      case 'PROC':
        if (st.name) {
          // nested in-stream PROCs: stack of definitions, PEND restores the parent
          procStack.push(procDef);
          procDef = { name: st.name.toUpperCase(), defaults: parseParams(st.operands), steps: [] };
          if (result.procs[procDef.name])
            warnings.push(`L${st.line}: PROC ${procDef.name} redefined (ambiguous definition) — the later definition wins for EXEC resolution, the earlier one is ignored`);
          result.procs[procDef.name] = procDef;
        } else if (job) {
          // PROC without name (JOB statement): symbolic defaults for this job
          Object.assign(globalSymbols, parseParams(st.operands));
        }
        break;
      case 'PEND':
        procDef = procStack.pop() || null;
        break;
      case 'EXEC': {
        const p = parseParams(st.operands);
        let kind = null, target = null;
        if (p.PGM !== undefined) { kind = 'PGM'; target = p.PGM; }
        else if (p.PROC !== undefined) { kind = 'PROC'; target = p.PROC; }
        else {
          const pos = Object.entries(p).find(([k, v]) => v === true && !EXEC_STD_PARAMS.has(k));
          if (pos) { kind = 'PROC'; target = pos[0]; }
          else warnings.push(`L${st.line}: EXEC without PGM or PROC`);
        }
        const step = {
          name: st.name, line: st.line, kind,
          condition: condStack.length ? { ...condStack[condStack.length - 1] } : null,
          dds: [], overrides: {}, symbols: {},
        };
        // phase 4: COND= (return test) and RD= (restart) — captured, never lost
        if (p.COND !== undefined && p.COND !== true) step.cond = String(p.COND).toUpperCase();
        if (p.RD !== undefined && p.RD !== true) step.rd = String(p.RD).toUpperCase();
        if (target) step.target = substitute(String(target), globalSymbols).toUpperCase();
        for (const [k, v] of Object.entries(p)) {
          if (k === 'PGM' || k === 'PROC') continue;
          if (k.includes('.')) step.overrides[k.toUpperCase()] = v;
          else if (!EXEC_STD_PARAMS.has(k)) step.symbols[k] = v;
        }
        if (procDef) procDef.steps.push(step);
        else if (job) job.steps.push(step);
        else warnings.push(`L${st.line}: EXEC outside of job ignored`);
        break;
      }
      case 'DD': {
        const owner = procDef ? procDef.steps : (job ? job.steps : []);
        const step = owner[owner.length - 1];
        if (!step) { warnings.push(`L${st.line}: DD outside of step ignored`); break; }
        const dd = buildDD(st, parseParams(st.operands), globalSymbols);
        if (st.inline && st.inline.length) dd.inline = st.inline; // in-stream cards captured (SORT, SYSTSIN…)
        step.dds.push(dd);
        break;
      }
      case 'IF':
        condStack.push({ text: st.operands.trim().replace(/\s+THEN\s*$/i,''), neg: false });
        break;
      case 'ELSE':
        if (condStack.length) condStack[condStack.length - 1].neg = true;
        break;
      case 'ENDIF':
        condStack.pop();
        break;
      case 'INCLUDE':
        // already handled by resolveIncludes: member spliced if uploaded, precise warning otherwise
        break;
      case 'JCLLIB':
        result.jcllib = st.operands.trim();
        break;
      case 'OUTPUT': case 'COMMAND': case 'XMIT': case 'CNTL': case 'ENDCNTL': case 'EXPORT':
        warnings.push(`L${st.line}: ${st.op} statement ignored (not needed for mapping)`);
        break;
      default:
        warnings.push(`L${st.line}: unknown operation ${st.op}`);
    }
  }
  // ── Post-pass phase 3 : cartes SORT (PGM=SORT/ICEMAN) + EXEC REXX/CLIST (IKJEFT01) ──
  const allSteps = [];
  result.jobs.forEach(jb => (jb.steps || []).forEach(s => allSteps.push(s)));
  Object.values(result.procs).forEach(p => (p.steps || []).forEach(s => allSteps.push(s)));
  allSteps.forEach(st => {
    if (st.kind !== 'PGM') return;
    const dds = st.dds || [];
    const target = String(st.target || '').toUpperCase();
    if (target === 'SORT' || target === 'ICEMAN' || target === 'DFSORT'){
      const sysin = dds.find(d => d.ddname === 'SYSIN');
      if (sysin && sysin.inline && sysin.inline.length){
        st.sortInfo = parseSortCards(sysin.inline.map(l => l.text).join('\n'));
        // OUTFIL FNAMES/OUTDD: these DDs are REAL outputs of the sort —
        // usage established even without DISP, never left "unknown".
        ((st.sortInfo.outfil || []).flatMap(x => x.names || [])).forEach(nm => {
          const dd = dds.find(d => d.ddname === nm);
          if (dd && dd.usage !== 'input'){
            if (dd.usage === 'unknown') dd.usage = 'output';
            dd.outfil = true;
          }
        });
        if (st.sortInfo.type === 'sort' && !st.sortInfo.decoded)
          warnings.push(`L${st.line}: SORT step ${st.name}: cards present but fields not decoded (unusual form) — shown as undecoded`);
      } else if (sysin && sysin.name){
        warnings.push(`L${st.line}: SORT step ${st.name}: SYSIN is a dataset (DSN=${sysin.name}) not uploaded — sort fields unknown`);
      } else {
        warnings.push(`L${st.line}: SORT step ${st.name}: no SYSIN cards captured — sort fields unknown`);
      }
    }
    if (target === 'IKJEFT01' || target === 'IKJEFT01B'){
      const sysin = dds.find(d => d.ddname === 'SYSTSIN');
      if (sysin && sysin.inline && sysin.inline.length){
        const txt = sysin.inline.map(l => l.text).join('\n');
        const m = txt.toUpperCase().match(/EXEC\s+'?([A-Z0-9\-@#$.]+(?:\([A-Z0-9\-@#$.]+\))?)/);
        if (m){
          let member = m[1];
          const dm = member.match(/^([A-Z0-9\-@#$.]+)\(([A-Z0-9\-@#$.]+)\)$/);
          if (dm) member = dm[2]; // EXEC 'dsn(member)' → membre
          st.rexxExec = member;
        } else {
          warnings.push(`L${st.line}: IKJEFT01 step ${st.name}: SYSTSIN present but no EXEC 'member' found — executed member unknown`);
        }
      } else if (sysin && sysin.name){
        warnings.push(`L${st.line}: IKJEFT01 step ${st.name}: SYSTSIN is a dataset (DSN=${sysin.name}) not uploaded — executed member unknown`);
      }
    }
  });
  linkProcs(result);
  return result;
}

// ── Global linking: "cataloged" PROCs and nested PROCs ──────────────
// The browser cannot reach your PROCLIB, but if you drop your
// PROC files next to your JCL, they are resolved as cataloged procs.
// Idempotent: called at each buildGraph, does nothing once everything is resolved.
function linkCatalogedProcs(){
  const registry = {};
  state.files.forEach(f=>{ if (f.lang === 'JCL' && f.parsed.procs) Object.keys(f.parsed.procs).forEach(pn=>{
    // same PROC name in several files: the last one wins (historical Object.assign) — flagged, never silent
    if (registry[pn] && !(f.parsed.warnings||[]).some(w => w.includes(`PROC ${pn} defined in multiple files`)))
      (f.parsed.warnings = f.parsed.warnings || []).push(`PROC ${pn} defined in multiple files (ambiguous definition) — the later file (${f.name}) wins for EXEC resolution`);
    registry[pn] = f.parsed.procs[pn];
  }); });
  let changed = true, guard = 0;
  while (changed && guard < 25){
    changed = false; guard++;
    state.files.forEach(f=>{
      if (f.lang !== 'JCL' || !f.parsed.jobs) return;
      f.parsed.jobs.forEach(jb=>{
        for (let i = 0; i < jb.steps.length; i++){
          const s = jb.steps[i];
          if (s.kind !== 'PROC' || !s.target || s.resolved) continue;
          if ((s.chain || []).includes(s.target)) continue; // recursion already flagged
          const proc = registry[s.target];
          if (!proc) continue;
          if ((s.chain || []).length >= 10 || jb.steps.length > 200) continue; // guard rail
          s.resolved = true;
          jb.procsUsed = jb.procsUsed || [];
          jb.procsUsed.push(proc.name);
          const symbols = { ...proc.defaults, ...s.symbols };
          const copies = [];
          for (const ps of proc.steps){
            const copy = JSON.parse(JSON.stringify(ps));
            copy.proc = proc.name;
            copy.via = s.name;
            copy.chain = [...(s.chain || []), proc.name];
            for (const dd of copy.dds){
              if (dd.name){
                dd.name = substitute(dd.name, symbols);
                if (dd.name.includes('&')) copy.hasUnresolvedSymbols = true;
              }
            }
            for (const [ov, val] of Object.entries(s.overrides || {})){
              const parts = ov.split('.');
              const ddname = parts.length >= 3 ? parts[1].toUpperCase() : parts[0].toUpperCase();
              const param = (parts.length >= 3 ? parts.slice(2) : parts.slice(1)).join('.').toUpperCase();
              const dd = copy.dds.find(d => (d.ddname || '').toUpperCase() === ddname);
              if (dd) dd['ov_' + param] = val;
            }
            copies.push(copy);
          }
          // overrides "//STEP.DD DD …" of the calling step: applied to the copies, with a warning if unresolved
          applyProcDdOverrides(s, proc, copies, symbols, msg => (f.parsed.warnings = f.parsed.warnings || []).push(`${f.name}: ${msg}`));
          jb.steps.splice(i, 1, ...copies);
          i += copies.length - 1;
          changed = true;
          // remove the obsolete "PROC … not found" warning
          if (f.parsed.warnings) f.parsed.warnings = f.parsed.warnings.filter(w => !w.includes(`PROC ${s.target} not found`));
        }
      });
    });
  }
  // flag the remaining recursive calls
  state.files.forEach(f=>{
    if (f.lang !== 'JCL' || !f.parsed.jobs || !f.parsed.warnings) return;
    f.parsed.jobs.forEach(jb=>jb.steps.forEach(s=>{
      if (s.kind === 'PROC' && s.target && (s.chain || []).includes(s.target)
          && !f.parsed.warnings.some(w => w.includes(`recursive PROC ${s.target}`)))
        f.parsed.warnings.push(`recursive PROC call to ${s.target} detected — not expanded`);
    }));
  });
}

// ══════════════════ 1b. COBOL ENGINE v3 ══════════════════
// True COBOL parser: fixed/free format, divisions/sections/paragraphs,
// SELECT ASSIGN, data levels (PIC/OCCURS/REDEFINES/VALUE), COPY
// nested (+REPLACING), PERFORM/THRU, CALL (literal + dynamically resolved),
// GO TO (including inside IF), READ/WRITE/REWRITE/OPEN, EXEC SQL blocks.
// Anything unrecognized produces a warning — no
// dependency is never invented.

function tkWords(s){ return s.replace(/,+$/,'').trim().split(/\s+/).filter(Boolean); }

function cobDetectFixed(raw){
  const lines = raw.split(/\r?\n/);
  let seq = 0, ind = 0, col8 = 0, nonEmpty = 0;
  for (const l of lines){
    if (!l.trim()) continue;
    nonEmpty++;
    if (/^[0-9]{3,6}(\s|$)/.test(l)) seq++;
    if (l.length > 7 && /^[0-9 ]{6}[*\-\/Dd]/.test(l.slice(0,7))) ind++;
    const first = l.search(/\S/);
    if (first >= 7) col8++;
  }
  if (!nonEmpty) return false;
  return (seq / nonEmpty >= 0.5) || (ind / nonEmpty >= 0.5) || (col8 / nonEmpty >= 0.6);
}

function cobLogicalItems(text, warns){
  const lines = text.split(/\r?\n/);
  // detected ONCE for the whole file: in free format, an entry
  // indented "    05  X PIC 9." must not be confused with a
  // fixed sequence area — otherwise the data level would be swallowed.
  const fixed0 = cobDetectFixed(text);
  let fixed = fixed0; // >>SOURCE FORMAT can change the format mid-file (real mixed case)
  const items = [];
  let inSql = false, sqlBuf = [], sqlStart = 0;
  let inCics = false, cicsBuf = [], cicsStart = 0;
  let litOpen = false; // literal still open at end of line ('-' continuation)
  for (let i = 0; i < lines.length; i++){
    const orig = lines[i];
    let l = orig;
    // COBOL 2002 directives: >>SOURCE FORMAT IS FREE/FIXED switches the format,
    // other >> (DEFINE, IF…) have no analysis effect — ignored
    const otrim = orig.trim();
    if (otrim.startsWith('>>')){
      const fm = otrim.match(/^>>\s*SOURCE\b.*?\b(FREE|FIXED)\b/i);
      if (fm) fixed = fm[1].toUpperCase() === 'FIXED';
      continue;
    }
    let ind = '';
    if (fixed){
      // fixed format: sequence area (col 1-6) + indicator (col 7), truncation at 72
      ind = l.length > 6 ? l[6] : ' ';
      if (ind === '*' || ind === '/') continue; // comment line
      if (ind === '-') l = '       ' + l.slice(7); // continuation: area A ignored
      else l = l.slice(7);
      if (l.length > 72) l = l.slice(0, 72);
      if (orig.length > 72 && warns) warns.push(`line ${i+1}: statement beyond column 72 truncated (fixed format)`);
    } else {
      // "mixed" free-format file: an isolated sequenced line (6 digits + space) stays fixed
      if (/^[0-9]{6}\s+\S/.test(l)) l = l.slice(7);
      if (l.length > 80){
        if (warns) warns.push(`line ${i+1}: very long line — free format assumed, not truncated`);
      }
    }
    // listing/compiler directives: EJECT, SKIP1-3, TITLE, CBL/*CBL — not code
    const ltrim = l.trim();
    if (/^(EJECT|SKIP[123])(\.|\s*$)/i.test(ltrim) || /^(TITLE|CBL)\b/i.test(ltrim)) continue;
    // free format: * or / at start of line (column 1) = comment/page-eject
    if (!fixed && /^\s*[*/]/.test(l)) continue;
    // floating comment *> (COBOL 2002+) — removed outside literals
    // (single OR double quote: both forms exist in 2002)
    {
      let q = false;
      for (let ci = 0; ci < l.length - 1; ci++){
        const ch = l[ci];
        if (ch === "'" || ch === '"') q = !q;
        else if (!q && ch === '*' && l[ci+1] === '>'){ l = l.slice(0, ci).trim(); break; }
      }
    }
    if (!l.trim()) continue;
    if (inSql){
      sqlBuf.push(l);
      if (/\bEND-EXEC\b/i.test(l)){
        items.push({ t: 'sql', text: sqlBuf.join(' '), ln: sqlStart });
        inSql = false; sqlBuf = [];
      }
      continue;
    }
    if (/^\s*EXEC\s+SQL\b/i.test(l)){
      if (/\bEND-EXEC\b/i.test(l)){
        items.push({ t: 'sql', text: l, ln: i+1 });
      } else {
        inSql = true; sqlBuf = [l]; sqlStart = i+1;
      }
      continue;
    }
    // EXEC CICS ... END-EXEC: dedicated block, same mechanics as SQL
    if (inCics){
      cicsBuf.push(l);
      if (/\bEND-EXEC\b/i.test(l)){
        items.push({ t: 'cics', text: cicsBuf.join(' '), ln: cicsStart });
        inCics = false; cicsBuf = [];
      }
      continue;
    }
    if (/^\s*EXEC\s+CICS\b/i.test(l)){
      if (/\bEND-EXEC\b/i.test(l)){
        items.push({ t: 'cics', text: l, ln: i+1 });
      } else {
        inCics = true; cicsBuf = [l]; cicsStart = i+1;
      }
      continue;
    }
    // literal continuation (col 7 '-'): the string resumes at the quote
    // WITHOUT inserted space — otherwise 'ABC' continued by 'DEF' would be corrupted
    if (fixed && ind === '-' && litOpen && items.length && items[items.length-1].t === 'line'){
      const last = items[items.length-1];
      const cm = l.trim().match(/^'(.*)$/);
      if (cm) last.text = last.text.replace(/\s+$/,'') + cm[1];
      else last.text += ' ' + l.trim();
    } else {
      items.push({ t: 'line', text: l, ln: i+1 });
    }
    {
      const lc = items.length && items[items.length-1].t === 'line' ? items[items.length-1].text : '';
      litOpen = (lc.match(/'/g) || []).length % 2 === 1;
    }
  }
  if (inSql && warns) warns.push(`line ${sqlStart}: EXEC SQL block without END-EXEC`);
  if (inCics && warns) warns.push(`line ${cicsStart}: EXEC CICS block without END-EXEC`);
  return { items, fixedHint: lines.some(l => /^[0-9]{3,6}(\s|$)/.test(l)) };
}

function cobSentences(items){
  const out = [];
  let buf = [], start = null;
  const endsWithPeriod = s => /\.\s*$/.test(s);
  for (const it of items){
    if (it.t === 'sql'){ out.push({ t:'sql', text: it.text, ln: it.ln }); continue; }
    if (it.t === 'cics'){ out.push({ t:'cics', text: it.text, ln: it.ln }); continue; }
    if (start === null) start = it.ln;
    // continuation: a line not ending with a half-known verb/keyword is joined to the next one
    buf.push(it.text.trim());
    const joined = buf.join(' ');
    if (endsWithPeriod(joined)){
      out.push({ t:'sentence', text: joined, ln: start });
      buf = []; start = null;
    }
  }
  if (buf.length){
    const joined = buf.join(' ');
    if (/\.\s*$/.test(joined)) out.push({ t:'sentence', text: joined, ln: start });
    else out.push({ t:'sentence', text: joined + '.', ln: start, incomplete: true });
  }
  return out;
}

function parseReplacing(s){
  // COPY X REPLACING ==A== BY ==B==  |  A BY B  |  LEADING/TRAILING ==A== BY ==B==
  // Pseudo-text (==...==) : correspondance TEXTOUELLE, y compris multi-mots et
  // non-word characters (:PREFIX:, -REC...). Simple word: delimited by \b.
  const pairs = [];
  const re = /(LEADING|TRAILING)?\s*(?:==([^=]+)==|\b([A-Z0-9][A-Z0-9\-]*)\b)\s+BY\s+(?:==([^=]+)==|\b([A-Z0-9][A-Z0-9\-]*)\b)/gi;
  let m;
  while ((m = re.exec(s))){
    const from = (m[2] !== undefined ? m[2] : (m[3] || '')).toUpperCase().trim();
    const to = (m[4] !== undefined ? m[4] : (m[5] || '')).toUpperCase().trim();
    if (from) pairs.push({ from, to, mode: (m[1] || '').toUpperCase(), pt: m[2] !== undefined });
  }
  return pairs;
}
function applyReplacing(t, pairs){
  for (const p of pairs){
    const a = p.from.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    try {
      // replacement by function: the replacement text ($, &…) is inserted as is
      if (p.mode === 'LEADING') t = t.replace(new RegExp(p.pt ? a : '\\b' + a, 'gi'), () => p.to);
      else if (p.mode === 'TRAILING') t = t.replace(new RegExp(p.pt ? a : a + '\\b', 'gi'), () => p.to);
      else t = t.replace(new RegExp(p.pt ? a : '\\b' + a + '\\b', 'gi'), () => p.to);
    } catch(e){ /* invalid pattern → original text kept */ }
  }
  return t;
}

function expandCopies(sents, registry, ctx, stack){
  const out = [];
  for (const sn of sents){
    if (sn.t !== 'sentence'){ out.push(sn); continue; }
    const cm = sn.text.match(/^COPY\s+([A-Z0-9\-]+)\s*(.*?)\.\s*$/i);
    if (!cm){ out.push(sn); continue; }
    const bname = cm[1].toUpperCase();
    const book = registry[bname] || registry[bname.replace(/^-/,'')];
    if (!book){
      ctx.warns.push(`line ${sn.ln}: COPY ${bname} not uploaded — layout unknown`);
      ctx.copyUsed.push({ name: bname, resolved: false, ln: sn.ln, file: ctx.file });
      out.push(sn); // keep the COPY sentence for trace
      continue;
    }
    if (stack.includes(bname)){
      ctx.warns.push(`line ${sn.ln}: COPY ${bname} circular reference — skipped`);
      continue;
    }
    if (stack.length >= 10){
      ctx.warns.push(`line ${sn.ln}: COPY nesting deeper than 10 — stopped`);
      continue;
    }
    ctx.copyUsed.push({ name: bname, resolved: true, ln: sn.ln, file: ctx.file });
    let btext = book.text;
    const pairs = parseReplacing(cm[2]);
    if (pairs.length) btext = applyReplacing(btext, pairs);
    const sub = expandCopies(cobSentences(cobLogicalItems(btext, ctx.warns).items).filter(s=>s.t==='sentence'), registry, ctx, stack.concat(bname));
    out.push({ t:'sentence', text: sn.text, ln: sn.ln, copy: bname });
    sub.forEach(s => { if (s.t==='sentence' && s.copy !== undefined) out.push(s); else out.push(s); });
  }
  return out;
}

const SQLKW = new Set(['SELECT','INSERT','UPDATE','DELETE','FROM','WHERE','SET','INTO','VALUES','JOIN','INNER','LEFT','RIGHT','OUTER','ON','AND','OR','NOT','IN','BETWEEN','LIKE','ORDER','GROUP','BY','AS','DISTINCT','UNION','ALL','CURSOR','FOR','FETCH','DECLARE','OPEN','CLOSE','WITH','HAVING','EXISTS','CASE','WHEN','THEN','END','TABLE','CREATE','DROP','ALTER','INDEX','VIEW','COUNT','SUM','AVG','MIN','MAX','CURRENT','TIMESTAMP','DATE','SCHEMA','COMMIT','ROLLBACK','WHENEVER','NOT','FOUND','SQLSTATE','SQLCODE','WITH','HOLD','SQLEXCEPTION','SQLWARNING','DESCRIPTOR','MERGE','TRUNCATE','ONLY','ROW','ROWS']);

function sqlTables(st){
  // st = text of an EXEC SQL block (without the prefix) → referenced tables
  // False positives excluded: aliases (only the first name kept), CTE (with
  // column list or recursive), subqueries "(SELECT…", host
  // variables, table functions. Quoted identifiers supported, qualified included.
  const text = st.replace(/^\s*EXEC\s+SQL/i,'').replace(/\bEND-EXEC\b\.?\s*$/i,'');
  const upper = text.toUpperCase();
  const tabs = new Set();
  // noms de CTE (WITH X AS (…) / WITH X (A,B) AS (…) / WITH RECURSIVE R AS (…)) :
  // these are not tables — excluded from the results
  const ctes = new Set();
  const cteRe = /(?:\bWITH\b(?:\s+RECURSIVE)?|,)\s*([A-Z0-9\-]+)\s*(?:\([^)]*\))?\s*AS\s*\(/g;
  let cm2;
  while ((cm2 = cteRe.exec(upper))) ctes.add(cm2[1]);
  // an identifier: quoted "MY TABLE" or plain; a name: 1 to 4 identifiers separated by dots
  const qid = (s) => {
    if (s.startsWith('"')){ const e = s.indexOf('"', 1); return e < 1 ? null : { id: s.slice(1, e), rest: s.slice(e + 1) }; }
    const mm = s.match(/^([A-Z0-9\-@#$_]+)/); return mm ? { id: mm[1], rest: s.slice(mm[1].length) } : null;
  };
  const parseName = (s) => {
    let name = '', rest = s.trim();
    for (let i = 0; i < 4; i++){
      const p = qid(rest);
      if (!p) break;
      name = name ? name + '.' + p.id : p.id;
      rest = p.rest.trim();
      if (rest.charAt(0) === '.'){ rest = rest.slice(1).trim(); continue; }
      break;
    }
    return { name, rest };
  };
  const pushList = (s) => {
    s.split(',').forEach(x => {
      const t = x.trim();
      if (!t) return;
      const { name } = parseName(t);
      if (!name) return; // "(SELECT…" (subquery), ":host-var"…
      const last = name.split('.').pop();
      // rejected by the LAST segment: SCHEMA.T1 is a table, but a lone FROM
      // (TABLE(X), DESCRIPTOR…) or a CTE name never are
      if (SQLKW.has(last) || ctes.has(last) || ctes.has(name)) return;
      if (name.startsWith(':') || name.startsWith('&')) return;
      tabs.add(name);
    });
  };
  // FROM t1, t2 alias / JOIN t / INTO t / UPDATE t / USING t (MERGE) / TABLE t (TRUNCATE, CREATE)
  const re = /\b(FROM|INTO|UPDATE|JOIN|TABLE|USING)\b/g;
  let m;
  while ((m = re.exec(upper))){
    const after = upper.slice(m.index + m[0].length).trim();
    // stop at the next SQL keyword
    let seg = after;
    const kwRe = /\b(SELECT|FROM|WHERE|SET|ON|USING|JOIN|INNER|LEFT|RIGHT|OUTER|VALUES|FOR|WITH|AS|END-EXEC)\b/;
    const km = seg.match(kwRe);
    if (km) seg = seg.slice(0, km.index);
    pushList(seg);
  }
  return [...tabs];
}

function sqlParse(C, s){
  const raw = s.text.replace(/^\s*EXEC\s+SQL/i,'').replace(/\bEND-EXEC\b\.?\s*$/i,'');
  const U = raw.toUpperCase();
  const first = tkWords(U)[0];
  // statements without data access: no edge, no noise
  if (['INCLUDE','WHENEVER','COMMIT','ROLLBACK','CONNECT','SET','FETCH','OPEN','CLOSE'].includes(first)){
    C.sql.push({ op: 'other', tables: [], ln: s.ln, text: raw.trim().slice(0, 200) });
    return;
  }
  if (first === 'PREPARE' || first === 'EXECUTE'){
    // dynamic SQL: the query text is unknown → 0 tables, no false positive
    C.sql.push({ op: 'dynamic', tables: [], ln: s.ln, text: raw.trim().slice(0, 200) });
    C.warns.push(`line ${s.ln}: dynamic SQL (${first}) — statement text unknown, tables NOT extracted (no false positive)`);
    return;
  }
  let op = null;
  if (first === 'DECLARE'){
    const cm = U.match(/\bCURSOR\s+FOR\s+(SELECT|INSERT|UPDATE|DELETE|MERGE)\b/);
    if (!cm){
      // DECLARE X TABLE / host variable declarations: not a data access
      C.sql.push({ op: 'other', tables: [], ln: s.ln, text: raw.trim().slice(0, 200) });
      return;
    }
    op = cm[1];
  } else if (['SELECT','INSERT','UPDATE','DELETE','MERGE','TRUNCATE'].includes(first)) op = first;
  // operation normalization: SELECT→read, INSERT/DELETE/TRUNCATE→write, UPDATE/MERGE→update
  if (op === 'SELECT') op = 'read';
  else if (op === 'INSERT' || op === 'DELETE' || op === 'TRUNCATE') op = 'write';
  else if (op === 'UPDATE' || op === 'MERGE') op = 'update';
  if (op === null && /\bSELECT\b/.test(U)) op = 'read';
  const tabs = sqlTables(s.text);
  C.sql.push({ op: op || 'unknown', tables: tabs, ln: s.ln, text: raw.trim().slice(0, 200) });
  if (!op)
    C.warns.push(`line ${s.ln}: EXEC SQL statement type not recognized (${first || '?'}) — tables still extracted, no typed edge created`);
}

// ═══ EXEC CICS: files (FCT), maps, queues, XCTL/LINK — never invented ═══
// Each command is recorded with its literal reference. FILE(WS-VAR)
// (value unknown at parse time) and commands without data access (RETURN,
// HANDLE, ASSIGN...) stay silent: no edge, no false positive.
function cicsParse(C, s, para){
  const raw = s.text.replace(/^\s*EXEC\s+CICS/i,'').replace(/\bEND-EXEC\b\.?\s*$/i,'').trim();
  const U = raw.toUpperCase();
  const w = tkWords(U);
  const cmd = w[0];
  const e = { cmd, op: null, file: null, fileVar: null, fileViaVar: false, queue: null, qtype: null, map: null, program: null, handles: null,
    para: para || null, ln: s.ln, silent: false, text: raw.slice(0, 200) };
  const lit = re => { const m2 = U.match(re); return m2 ? m2[1] : null; };
  if (['READ','WRITE','REWRITE','UPDATE','DELETE'].includes(cmd)){
    e.op = cmd === 'READ' ? 'read' : cmd === 'WRITE' ? 'write' : (cmd === 'REWRITE' || cmd === 'UPDATE') ? 'update' : 'delete';
    e.file = lit(/\b(?:FILE|DATASET)\s*\(\s*'([^']*)'\s*\)/);
    if (e.file) C.cicsFiles[e.file] = [...(C.cicsFiles[e.file]||[]), { op: e.op, ln: s.ln, cics: cmd, cicsFile: e.file }];
    else {
      // FILE(variable): value traced from MOVE 'X' TO var / level 88s in resolveOps;
      // if no constant seen → no edge, explicit warning, nothing invented.
      const vm = U.match(/\b(?:FILE|DATASET)\s*\(\s*([A-Z0-9\-]+)\s*\)/);
      e.fileVar = vm ? vm[1] : null;
      e.silent = true;
    }
  } else if (cmd === 'READQ' || cmd === 'WRITEQ' || cmd === 'DELETEQ'){
    e.op = cmd === 'READQ' ? 'read' : cmd === 'WRITEQ' ? 'write' : 'delete';
    e.qtype = (w[1] === 'TS' || w[1] === 'TD') ? w[1] : null;
    e.queue = lit(/\bQUEUE\s*\(\s*'([^']*)'\s*\)/);
    if (!e.queue) e.silent = true;
  } else if (cmd === 'SEND' || cmd === 'RECEIVE'){
    e.map = lit(/\bMAP\s*\(\s*'([^']*)'\s*\)/);
    if (!e.map) e.silent = true; // SEND TEXT / RECEIVE without MAP: not a named resource
  } else if (['XCTL','LINK','CALL','TRANSFER'].includes(cmd)){
    e.program = lit(/\bPROGRAM\s*\(\s*'([^']*)'\s*\)/);
    if (!e.program) e.silent = true; // PROGRAM(variable): unknown target → no edge
  } else if (cmd === 'HANDLE'){
    // HANDLE CONDITION err(PARA) ... / HANDLE AID ENTER(PARA) ... / HANDLE ABEND PROGRAM('X')
    e.handles = [];
    const hre = /([A-Z][A-Z0-9\-]*)\s*\(\s*([A-Z0-9\-]+)\s*\)/g;
    let hm;
    while ((hm = hre.exec(U))) e.handles.push({ key: hm[1], to: hm[2] });
    e.program = lit(/\bPROGRAM\s*\(\s*'([^']*)'\s*\)/);   // HANDLE ABEND PROGRAM('X')
    e.silent = !(e.handles.length || e.program);
  } else {
    e.silent = true; // RETURN/IGNORE/ASSIGN/GETMAIN...: no data access, no noise
  }
  C.cics.push(e);
}

const IDENT = /^[A-Z0-9][A-Z0-9\-]*$/;
// keywords that CANNOT be paragraph names (shared engine + translator)
const PARAGRAPH_KW = /^(SECTION|DIVISION|END|DECLARATIVES|EXIT|STOP|GO|GOBACK|PERFORM|MOVE|IF|ELSE|CALL|READ|WRITE|OPEN|CLOSE|DISPLAY|COMPUTE|ADD|SUBTRACT|MULTIPLY|DIVIDE|SET|INITIALIZE|ACCEPT|EVALUATE|END-EVALUATE|WHEN|END-IF|UNTIL|VARYING|CONTINUE|RETURN)$/;

// ══════════════════ 1c. COBOL → PYTHON TRANSLATION (deterministic) ══════════════════
// Two DISTINCT engines (Priority 2):
//  • DETERMINISTIC ENGINE (this one): each recognized statement is translated by
//    fixed rules — never by guesswork. Each statement carries a status
//    (translated / approximated / unsupported), its original COBOL line and its
//    Python line, visible in the translation report.
//  • AI ENGINE (optional, later): any AI proposal should be VALIDATED
//    by this engine (structure + statuses) and labeled "AI-proposed" — never
//    mixed with the deterministic translation. No simulated AI output.
// Doctrine: what is not translated is displayed as such (comment
// [NOT TRANSLATED] + unsupported status). No Python code is invented.

const PY_CONF = { move: .95, compute: .9, arith: .9, if: .9, evaluate: .85, perform: .85, goto: .7, display: .95, initialize: .9, stop: .95, call: .9, set88: .85, nop: 1, sql: 0, cics: 0, io: 0, unknown: 0 };

function pyIdent(name){
  let s = String(name || 'x').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '');
  if (!s || /^[0-9]/.test(s)) s = 'p_' + s;
  return s;
}
function pyQuote(s){ return '"' + String(s).replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"'; }

// PIC → Python type. Documented mapping, acknowledged approximation:
//  X/A → str, 9 → int, V → float (decimals serve ROUNDED),
//  S → signed (native in Python), COMP/COMP-3/BINARY → storage noted.
function pyPicType(v){
  const p = String(v.pic || '').toUpperCase();
  const digitsOf = (seg) => { let n = 0, mm; const re = /9(?:\((\d+)\))?/g; while ((mm = re.exec(seg))) n += mm[1] ? parseInt(mm[1], 10) : 1; return n; };
  if (!p) return null;
  if (/^[AX]/.test(p)){
    const d = digitsOf(p.replace(/[AX]/g, '9')) || 1;
    return { kind: 'str', len: d, decs: 0,
      note: 'PIC ' + p + ' → str' + (d > 1 ? ' (longueur ' + d + ' non contrainte en Python)' : '') + (v.usage ? ' [' + v.usage + ']' : '') };
  }
  const signed = /^S/.test(p);
  const body = p.replace(/^S/, '');
  const parts = body.split('V');
  const decs = digitsOf(parts[1] || '');
  const kind = decs > 0 ? 'float' : 'int';
  return { kind, decs, signed,
    note: 'PIC ' + p + ' → ' + kind + (decs > 0 ? ' (' + decs + ' decimals — float approximation, to validate for amounts)' : '') + (signed ? ' (signed)' : '') + (v.usage ? ' [' + v.usage + ']' : '') };
}

// ── tokenizer dedicated to the translation (literals preserved) ──
function trToks(t){
  const s = String(t).trim();
  const out = [];
  let i = 0;
  while (i < s.length){
    const ch = s[i];
    if (/\s/.test(ch)) { i++; continue; }
    if (ch === "'" || ch === '"'){
      let j = i + 1;
      while (j < s.length && s[j] !== ch) j++;
      out.push({ t: 'lit', v: s.slice(i + 1, j) });
      i = j + 1;
      continue;
    }
    if ('(),+-*/=<>:'.includes(ch)){ out.push({ t: 'op', v: ch }); i++; continue; }
    let m = s.slice(i).match(/^[A-Za-z][A-Za-z0-9\-]*/);
    if (m){ out.push({ t: 'w', v: m[0] }); i += m[0].length; continue; }
    // numerically prefixed identifier (numbered paragraphs: 1000-CALC, 0100-INIT)
    // → ONE word — otherwise "1000" becomes an unknown PERFORM target (real bug)
    m = s.slice(i).match(/^\d+[A-Za-z\-][A-Za-z0-9\-]*/);
    if (m){ out.push({ t: 'w', v: m[0] }); i += m[0].length; continue; }
    m = s.slice(i).match(/^\d+(?:\.\d+)?/);
    if (m){ out.push({ t: 'num', v: m[0] }); i += m[0].length; continue; }
    i++;
  }
  return out;
}
function trNormalize(toks){
  // merge of END+IF → END-IF, GO+TO → GOTO pairs (compound words)
  const out = [];
  for (let k = 0; k < toks.length; k++){
    const a = toks[k], b = toks[k + 1];
    if (a && b && a.t === 'w' && b.t === 'w'){
      const A = a.v.toUpperCase(), B = b.v.toUpperCase();
      if ((A === 'END' && ['IF', 'EVALUATE', 'PERFORM', 'SEARCH', 'PROGRAM'].includes(B)) || (A === 'GO' && B === 'TO')){
        out.push({ t: 'w', v: A === 'GO' ? 'GOTO' : A + '-' + B });
        k++;
        continue;
      }
    }
    out.push(a);
  }
  return out;
}

const TR_VERBS = new Set(['MOVE','COMPUTE','ADD','SUBTRACT','MULTIPLY','DIVIDE','IF','EVALUATE','PERFORM','GOTO','DISPLAY','INITIALIZE','STOP','CALL','READ','WRITE','REWRITE','DELETE','OPEN','CLOSE','EXIT','CONTINUE','SET','ACCEPT','EXEC','STRING','UNSTRING','SEARCH','SORT','MERGE','RETURN','ALTER','GOBACK','NEXT']);
const TR_BLOCKS = new Set(['ELSE','END-IF','WHEN','END-EVALUATE','END-PERFORM','OTHER']);
const TR_KWS = new Set(['TO','FROM','BY','INTO','GIVING','UNTIL','THRU','THROUGH','TIMES','VARYING','ROUNDED','ON','SIZE','ERROR','REMAINDER','SENTENCE','WITH','TEST','BEFORE','AFTER','UPON','ALSO','RUN','TRUE','FALSE','OTHER','ELSE','END-IF','END-EVALUATE','END-PERFORM','DEPENDING']);

const PY_FIG = { SPACE: '" "', SPACES: '" "', ZERO: '0', ZEROS: '0', ZEROES: '0', NULL: 'None', LOWVALUE: '"\\x00"', LOWVALUES: '"\\x00"', HIGHVALUE: '"\\xff"', HIGHVALUES: '"\\xff"', QUOTE: '"\\x27"' };
function trVal(tok){
  if (!tok) return 'None';
  if (tok.t === 'lit') return pyQuote(tok.v);
  if (tok.t === 'num') return tok.v;
  if (tok.t === 'op') return tok.v;
  const U = tok.v.toUpperCase();
  if (PY_FIG[U] !== undefined) return PY_FIG[U];
  return pyIdent(tok.v);
}
const trIsWord = (tok, u) => !!tok && tok.t === 'w' && tok.v.toUpperCase() === u;

function trCond(toks, i, endStops){
  // reads a condition (symbolic comparisons and keywords included) up to a verb
  const parts = [];
  while (i < toks.length){
    const t = toks[i];
    if (t.t === 'w'){
      const U = t.v.toUpperCase();
      if (U === 'NOT'){ parts.push(' not '); i++; continue; }
      if (U === 'AND'){ parts.push(' and '); i++; continue; }
      if (U === 'OR'){ parts.push(' or '); i++; continue; }
      if (U === 'GREATER'){ i++; if (trIsWord(toks[i], 'THAN')) i++; if (trIsWord(toks[i], 'OR') && trIsWord(toks[i+1], 'EQUAL')){ parts.push(' >= '); i += 2; if (trIsWord(toks[i], 'TO')) i++; } else parts.push(' > '); continue; }
      if (U === 'LESS'){ i++; if (trIsWord(toks[i], 'THAN')) i++; if (trIsWord(toks[i], 'OR') && trIsWord(toks[i+1], 'EQUAL')){ parts.push(' <= '); i += 2; if (trIsWord(toks[i], 'TO')) i++; } else parts.push(' < '); continue; }
      if (U === 'EQUAL'){ parts.push(' == '); i++; if (trIsWord(toks[i], 'TO')) i++; continue; }
      if (U === 'UNEQUAL'){ parts.push(' != '); i++; continue; }
      if (endStops.has(U) || TR_VERBS.has(U)) break;
      parts.push(pyIdent(t.v)); i++; continue;
    }
    if (t.t === 'op'){
      if (t.v === '=') parts.push(' == ');
      else if (t.v === '>' && toks[i+1] && toks[i+1].t === 'op' && toks[i+1].v === '='){ parts.push(' >= '); i++; }
      else if (t.v === '<' && toks[i+1] && toks[i+1].t === 'op' && toks[i+1].v === '='){ parts.push(' <= '); i++; }
      else parts.push(' ' + t.v + ' ');
      i++;
      continue;
    }
    parts.push(trVal(t)); i++;
  }
  return { py: parts.join('').replace(/\s+/g, ' ').trim(), i };
}

function trIdents(toks, i){
  const ids = [];
